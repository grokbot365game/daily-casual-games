<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <title>はねかえりホース — Recoil Hose</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230284c7'/%3E%3Ccircle cx='8' cy='9' r='3.2' fill='%23fb923c'/%3E%3Cpath d='M5 6.2 L6.2 3.2 L8 6 M8 6 L9.8 3.2 L11 6' fill='%23fb923c'/%3E%3Cpath d='M11 9.5 L14 8.2' stroke='%2338bdf8' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffdf8;
      --line: rgba(28, 25, 23, .12);
      --water: #0891b2;
      --fire: #ea580c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(80% 40% at 80% 0%, #fde68a 0%, transparent 46%),
        linear-gradient(180deg, #38bdf8 0%, #7dd3fc 42%, #fdba74 100%);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "WenQuanYi Micro Hei", "Meiryo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    .back {
      position: fixed;
      z-index: 30;
      top: max(10px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 253, 248, .94);
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-decoration: none;
    }
    .shell {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding:
        calc(max(10px, env(safe-area-inset-top)) + 42px)
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      min-height: 0;
    }
    .hud {
      flex: none;
      padding: 8px 12px 7px;
      border-radius: 16px;
      background: rgba(255, 253, 248, .94);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 24px rgba(12, 74, 110, .16);
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-weight: 900;
    }
    .fires { color: var(--fire); font-size: clamp(1rem, 3.4vw, 1.25rem); letter-spacing: .02em; }
    .timer { font-size: clamp(1rem, 3.4vw, 1.25rem); font-variant-numeric: tabular-nums; }
    .timer.warn { color: #e11d48; }
    .timer small, .fires small { font-size: .68rem; letter-spacing: .08em; margin-right: 4px; }
    .bar {
      margin-top: 6px;
      height: 8px;
      border-radius: 999px;
      background: #e7e5e4;
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22d3ee, #f59e0b);
    }
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 22px;
      overflow: hidden;
      background: #7dd3fc;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 14px 36px rgba(12, 74, 110, .2);
    }
    canvas#game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    .hint {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(28, 25, 23, .78);
      color: #fff;
      font-size: clamp(.85rem, 2.8vw, 1rem);
      font-weight: 800;
      text-align: center;
      pointer-events: none;
    }
    .hint:empty { display: none; }
    .toast {
      position: absolute;
      left: 50%;
      top: 14%;
      transform: translateX(-50%) scale(.72);
      opacity: 0;
      z-index: 5;
      padding: 4px 12px;
      font-size: clamp(2rem, 8vw, 3.4rem);
      font-weight: 900;
      letter-spacing: .04em;
      color: #fff;
      text-shadow: 0 4px 0 #0e7490, 0 10px 24px rgba(14, 116, 144, .45);
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      transition: transform .16s cubic-bezier(.2, 1.6, .4, 1), opacity .12s linear;
    }
    .toast.nag {
      font-size: clamp(1.35rem, 5vw, 2rem);
      text-shadow: 0 3px 0 #c2410c, 0 8px 18px rgba(194, 65, 12, .4);
    }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: auto;
      background: rgba(12, 54, 84, .42);
      backdrop-filter: blur(3px);
    }
    .overlay[hidden] { display: none !important; }
    .card {
      width: min(100%, 440px);
      margin: auto;
      max-height: 100%;
      overflow: auto;
      padding: 16px 16px 14px;
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 18px 48px rgba(12, 42, 68, .35);
      text-align: center;
    }
    .card[hidden] { display: none !important; }
    .card h1 {
      margin: 2px 0 0;
      font-size: clamp(1.7rem, 6vw, 2.15rem);
      letter-spacing: .04em;
      line-height: 1.2;
    }
    .card .en {
      margin: 2px 0 10px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }
    .demo-wrap {
      height: 112px;
      margin: 0 0 10px;
      border-radius: 16px;
      overflow: hidden;
      background: #7dd3fc;
    }
    canvas#demo { display: block; width: 100%; height: 100%; }
    .rules {
      margin: 0 0 10px;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
    }
    .rules li {
      padding: 8px 10px;
      border-radius: 12px;
      background: #e0f2fe;
      color: #0c4a6e;
      font-size: clamp(1rem, 3.6vw, 1.18rem);
      font-weight: 900;
      line-height: 1.35;
    }
    .rules li:nth-child(2) { background: #ffedd5; color: #9a3412; }
    .rules li:nth-child(3) { background: #fee2e2; color: #9f1239; }
    .sub {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
      line-height: 1.45;
    }
    .best { margin: 0 0 10px; color: #a16207; font-weight: 900; font-size: .9rem; }
    .card h2 { margin: 0 0 6px; font-size: clamp(1.7rem, 6vw, 2.2rem); letter-spacing: .06em; }
    .kicker {
      margin: 0;
      color: #e11d48;
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .18em;
    }
    .why {
      margin: 0 0 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fee2e2;
      color: #9f1239;
      font-size: .95rem;
      font-weight: 800;
      line-height: 1.45;
    }
    .why.ok { background: #d1fae5; color: #065f46; }
    .meta { margin: 0 0 4px; font-size: .95rem; font-weight: 800; }
    .record { margin: 4px 0 8px; color: #a16207; font-weight: 900; }
    .actions { display: grid; gap: 8px; margin-top: 8px; }
    .actions.locked { pointer-events: none; opacity: .55; }
    button, .btn {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      min-height: 48px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      color: #fff;
      background: var(--fire);
      box-shadow: 0 6px 0 #c2410c;
      text-decoration: none;
      display: grid;
      place-items: center;
    }
    button:active, .btn:active { transform: translateY(2px); box-shadow: 0 4px 0 #c2410c; }
    button:disabled { cursor: default; }
    button.secondary, .btn.secondary {
      color: var(--ink);
      background: #fff;
      box-shadow: inset 0 0 0 1px var(--line), 0 4px 0 rgba(28, 25, 23, .08);
    }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">ギャラリー</a>
  <div class="shell">
    <header class="hud">
      <div class="hud-row">
        <div class="fires" id="fire-label"><small>火</small>あと 8</div>
        <div class="timer" id="timer"><small>のこり</small>90.0</div>
      </div>
      <div class="bar" aria-hidden="true"><div id="bar-fill"></div></div>
    </header>
    <div class="stage">
      <canvas id="game"></canvas>
      <div class="hint" id="hint"></div>
      <div class="toast" id="toast"></div>
      <div class="overlay" id="overlay">
        <section class="card" id="title-card">
          <div class="demo-wrap"><canvas id="demo" width="640" height="220"></canvas></div>
          <h1>はねかえりホース</h1>
          <p class="en">Recoil Hose</p>
          <ul class="rules">
            <li>タップ＝水を出す／はんどうでうごく</li>
            <li>火を全部けしてゴールへ</li>
            <li>おちたら・火にふれたらアウト</li>
          </ul>
          <p class="sub">ポインタのほうへ水が出る。スペースでも出せる。矢印はむきだけ。<br>制限時間は 90びょう。あるくことはできない。</p>
          <p class="best" id="title-best">ベスト まだない</p>
          <button type="button" id="btn-start">はじめる</button>
        </section>
        <section class="card" id="end-card" hidden>
          <p class="kicker" id="end-kicker" hidden>アウト</p>
          <h2 id="end-title">クリア</h2>
          <p class="why" id="end-why"></p>
          <p class="meta" id="end-meta"></p>
          <p class="record" id="end-record"></p>
          <div class="actions locked" id="actions">
            <button type="button" id="btn-retry" disabled>もういちど</button>
            <button type="button" class="secondary" id="btn-copy" disabled>結果をコピー</button>
            <a class="btn secondary" href="../../index.html">ギャラリーへ</a>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script>
(function () {
  "use strict";

  var G = 1700, RECOIL = 2500, FRIC = 2600, MAXV = 900;
  var WATER_RANGE = 220, WATER_R = 24, EXT_TIME = 0.14, HURT_R = 26, DEATH_Y = 760;
  var DT = 1 / 60, LIMIT = 90;
  var STORE = "day15-recoil-hose-best";
  var PAGE = "https://grokbot365game.github.io/daily-casual-games/games/2026-10-10-recoil-hose/";
  var FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","WenQuanYi Micro Hei",sans-serif';

  var PLATFORM_SRC = [
    { x: 0, y: 540, w: 1020, h: 44, kind: "wood" },
    { x: 430, y: 428, w: 170, h: 18, kind: "stone" },
    { x: 1180, y: 558, w: 330, h: 30, kind: "wood" },
    { x: 1620, y: 484, w: 220, h: 24, kind: "wood" },
    { x: 1930, y: 566, w: 220, h: 22, kind: "wood" },
    { x: 2260, y: 492, w: 170, h: 22, span: 90, freq: 0.36, base: 2260, kind: "metal" },
    { x: 2620, y: 418, w: 280, h: 24, kind: "wood" },
    { x: 3020, y: 508, w: 120, h: 18, kind: "stone" },
    { x: 3240, y: 428, w: 130, h: 18, kind: "stone" },
    { x: 3500, y: 516, w: 480, h: 36, kind: "goal" }
  ];
  var FIRE_SRC = [
    { x: 680, y: 512, name: "A" },
    { x: 515, y: 400, name: "B" },
    { x: 940, y: 512, name: "C" },
    { x: 1455, y: 530, name: "D" },
    { x: 1780, y: 456, name: "E" },
    { x: 2100, y: 538, name: "F" },
    { x: 2865, y: 390, name: "G" },
    { x: 3780, y: 488, name: "I" }
  ];
  var GOAL = { x: 3900, top: 516, h: 180, r: 120 };
  var MOVE = 5;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var demo = document.getElementById("demo");
  var dctx = demo.getContext("2d");
  var overlay = document.getElementById("overlay");
  var titleCard = document.getElementById("title-card");
  var endCard = document.getElementById("end-card");
  var hintEl = document.getElementById("hint");
  var toastEl = document.getElementById("toast");
  var fireLabel = document.getElementById("fire-label");
  var timerEl = document.getElementById("timer");
  var barFill = document.getElementById("bar-fill");
  var actions = document.getElementById("actions");
  var titleBest = document.getElementById("title-best");

  var platforms = [];
  var fires = [];
  var fox = { x: 540, y: 540, vx: 0, vy: 0, ground: 0 };
  var aim = { x: 1, y: 0 };
  var input = { spray: false, target: null, dir: null };
  var mode = "title";
  var elapsed = 0;
  var endReason = "";
  var scripted = false;
  var suppressSpace = false;
  var spaceDown = false;
  var airborneTaught = false;
  var flagNag = 0;
  var toastTimer = 0;
  var lockTimer = 0;
  var acc = 0;
  var lastTs = 0;
  var shake = 0;
  var cam = { x: 0, y: 200 };
  var viewW = 900, viewH = 620, cssW = 1, cssH = 1, dpr = 1;
  var drops = [];
  var sparks = [];
  var popups = [];
  var clouds = [];
  var pointer = { down: false, id: null, sx: 0, sy: 0, valid: false };
  var arrows = { left: false, right: false, up: false, down: false };
  var audioCtx = null;

  for (var ci = 0; ci < 6; ci++) {
    clouds.push({
      x: 200 + ci * 680,
      y: 250 + (ci % 3) * 40,
      s: 0.8 + (ci % 3) * 0.25,
      v: 12 + ci * 3
    });
  }

  function clonePlatforms() {
    return PLATFORM_SRC.map(function (p) {
      return {
        x: p.x, y: p.y, w: p.w, h: p.h, kind: p.kind,
        span: p.span || 0, freq: p.freq || 0, base: p.base || p.x
      };
    });
  }
  function cloneFires() {
    return FIRE_SRC.map(function (f) {
      return { x: f.x, y: f.y, name: f.name, hp: 1, fade: 0 };
    });
  }
  function firesLeft() {
    var n = 0;
    for (var i = 0; i < fires.length; i++) if (fires[i].hp > 0) n++;
    return n;
  }
  function loadBest() {
    try {
      var n = parseFloat(localStorage.getItem(STORE));
      return isFinite(n) ? n : null;
    } catch (e) { return null; }
  }
  function saveBest(t) {
    var b = loadBest();
    if (b == null || t < b - 1e-4) {
      try { localStorage.setItem(STORE, String(t)); } catch (e) {}
      return true;
    }
    return false;
  }
  function fmt(sec) { return Math.max(0, sec).toFixed(1) + "びょう"; }
  function reasonWord(r) {
    if (r === "burn") return "火にふれた";
    if (r === "time") return "タイムオーバー";
    return "おちた";
  }

  function resetWorld() {
    platforms = clonePlatforms();
    fires = cloneFires();
    fox.x = 540; fox.y = 540; fox.vx = 0; fox.vy = 0; fox.ground = 0;
    aim.x = 1; aim.y = 0;
    input.spray = false; input.target = null; input.dir = null;
    elapsed = 0;
    endReason = "";
    airborneTaught = false;
    flagNag = 0;
    drops.length = 0;
    sparks.length = 0;
    popups.length = 0;
    shake = 0;
    acc = 0;
  }

  function land(prevY) {
    var best = null;
    for (var i = 0; i < platforms.length; i++) {
      var p = platforms[i];
      if (fox.x > p.x - 8 && fox.x < p.x + p.w + 8 && prevY <= p.y + 1.5 && fox.y >= p.y - 0.01) {
        if (!best || p.y < best.y) best = { i: i, y: p.y };
      }
    }
    if (best) { fox.y = best.y; fox.vy = 0; fox.ground = best.i; }
    else fox.ground = null;
  }

  function finish(kind, reason) {
    mode = kind;
    endReason = reason || "";
    document.body.dataset.mode = mode;
    if (kind === "win") {
      var bestNow = saveBest(elapsed);
      showEnd(true, bestNow);
    } else {
      showEnd(false, false);
    }
  }

  function step() {
    if (mode !== "play") return "ok";
    var time = elapsed;
    var mp = platforms[MOVE];
    var prev = mp.x;
    mp.x = mp.base + Math.sin(time * mp.freq * Math.PI * 2) * mp.span;
    if (fox.ground === MOVE) fox.x += mp.x - prev;

    var aimx = aim.x, aimy = aim.y;
    if (input.dir != null) {
      aimx = Math.cos(input.dir);
      aimy = Math.sin(input.dir);
    }
    if (input.target) {
      var dx = input.target.x - fox.x;
      var dy = input.target.y - (fox.y - 32);
      var L = Math.hypot(dx, dy) || 1;
      aimx = dx / L;
      aimy = dy / L;
    }
    var al = Math.hypot(aimx, aimy) || 1;
    aimx /= al; aimy /= al;
    aim.x = aimx; aim.y = aimy;

    var ax = 0, ay = G;
    if (input.spray) {
      ax -= aimx * RECOIL;
      ay -= aimy * RECOIL;
      shake = Math.min(shake + 0.55, 7);
    }
    fox.vx += ax * DT;
    fox.vy += ay * DT;
    if (fox.ground != null && !input.spray) {
      var fr = FRIC * DT;
      if (Math.abs(fox.vx) <= fr) fox.vx = 0;
      else fox.vx -= Math.sign(fox.vx) * fr;
    } else {
      fox.vx *= Math.exp(-0.25 * DT);
    }
    var sp = Math.hypot(fox.vx, fox.vy);
    if (sp > MAXV) { var k = MAXV / sp; fox.vx *= k; fox.vy *= k; }
    var prevY = fox.y;
    fox.x += fox.vx * DT;
    fox.y += fox.vy * DT;
    if (fox.vy >= 0) land(prevY);
    else fox.ground = null;
    if (fox.ground == null && fox.vy < -40) airborneTaught = true;

    if (input.spray) {
      var nx = fox.x + aimx * 40;
      var ny = fox.y - 32 + aimy * 40;
      var sdx = aimx * WATER_RANGE, sdy = aimy * WATER_RANGE;
      var L2 = sdx * sdx + sdy * sdy || 1;
      for (var i = 0; i < fires.length; i++) {
        var f = fires[i];
        if (f.hp <= 0) continue;
        var t = ((f.x - nx) * sdx + (f.y - ny) * sdy) / L2;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        var dist = Math.hypot(f.x - (nx + sdx * t), f.y - (ny + sdy * t));
        if (dist <= WATER_R) {
          var before = f.hp;
          f.hp -= DT / EXT_TIME;
          if (before > 0 && f.hp <= 0) {
            f.hp = 0;
            f.fade = 1;
            burst(f);
          }
        }
      }
      if (drops.length < 70 && Math.random() < 0.8) {
        drops.push({
          x: nx, y: ny,
          vx: aimx * 640 + (Math.random() - 0.5) * 30,
          vy: aimy * 640 + (Math.random() - 0.5) * 30,
          life: 0.22 + Math.random() * 0.08
        });
      }
    }

    for (var j = 0; j < fires.length; j++) {
      var fire = fires[j];
      if (fire.hp > 0 && Math.hypot(fox.x - fire.x, fox.y - 30 - fire.y) < HURT_R) {
        finish("fail", "burn");
        return "burn";
      }
    }
    if (fox.y > DEATH_Y || fox.x < -140 || fox.x > 4200) {
      finish("fail", "fall");
      return "fall";
    }
    var left = firesLeft();
    var atFlag = Math.abs(fox.x - GOAL.x) < GOAL.r && fox.y <= GOAL.top + 8 && fox.y > GOAL.top - GOAL.h;
    if (atFlag && left === 0) {
      finish("win", "");
      return "win";
    }
    if (atFlag && left > 0 && flagNag <= 0) {
      flagNag = 1.5;
      showToast("まだ火がある！", true);
    }
    elapsed += DT;
    if (flagNag > 0) flagNag -= DT;
    if (mode === "play" && elapsed >= LIMIT) {
      finish("fail", "time");
      return "time";
    }
    return "ok";
  }

  function burst(f) {
    showToast("けした！", false);
    popups.push({ x: f.x, y: f.y - 36, text: "けした！", life: 1.2, max: 1.2 });
    for (var i = 0; i < 16; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 80 + Math.random() * 220;
      sparks.push({
        x: f.x, y: f.y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 40,
        life: 0.45 + Math.random() * 0.35,
        max: 0.7,
        color: i % 3 === 0 ? "#fff" : i % 3 === 1 ? "#67e8f9" : "#fde68a",
        r: 2 + Math.random() * 3
      });
    }
    blip(880, 0.09, "triangle", 0.05);
    setTimeout(function () { blip(1320, 0.14, "sine", 0.04); }, 70);
  }

  function showToast(text, nag) {
    toastEl.textContent = text;
    toastEl.className = "toast show" + (nag ? " nag" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = "toast" + (nag ? " nag" : ""); }, 1100);
  }

  function blip(freq, dur, type, gain) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  function gatherInput() {
    if (scripted || mode !== "play") return;
    var kx = 0, ky = 0;
    if (arrows.left) kx -= 1;
    if (arrows.right) kx += 1;
    if (arrows.up) ky -= 1;
    if (arrows.down) ky += 1;
    if (pointer.down || (pointer.valid && !(kx || ky))) {
      var w = pointerWorld();
      input.target = w;
      input.dir = null;
    } else if (kx || ky) {
      input.target = null;
      input.dir = Math.atan2(ky, kx);
    } else {
      input.target = null;
      input.dir = null;
    }
    input.spray = !!(pointer.down || (spaceDown && !suppressSpace));
  }

  function pointerWorld() {
    return {
      x: cam.x + (pointer.sx / cssW) * viewW,
      y: cam.y + (pointer.sy / cssH) * viewH
    };
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cssW = Math.max(1, rect.width);
    cssH = Math.max(1, rect.height);
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    var aspect = cssW / cssH;
    viewH = 620;
    viewW = viewH * aspect;
    if (viewW < 520) {
      viewW = 520;
      viewH = viewW / aspect;
    }
  }

  function snapCamera() {
    resize();
    cam.x = fox.x - viewW * 0.32;
    cam.y = fox.y - viewH * 0.64;
    clampCam();
  }
  function clampCam() {
    if (viewW < 4100) cam.x = Math.max(-80, Math.min(4050 - viewW, cam.x));
    cam.y = Math.max(120, Math.min(880 - viewH, cam.y));
  }
  function updateCamera() {
    var look = aim.x * 80;
    var tx = fox.x - viewW * 0.32 + look;
    var ty = fox.y - viewH * 0.64;
    if (viewW < 4100) tx = Math.max(-80, Math.min(4050 - viewW, tx));
    ty = Math.max(120, Math.min(880 - viewH, ty));
    var s = mode === "play" ? 0.12 : 1;
    cam.x += (tx - cam.x) * s;
    cam.y += (ty - cam.y) * s;
  }

  function roundRect(c, x, y, w, h, r) {
    var rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  function drawBackground(c, t) {
    var sky = c.createLinearGradient(0, 140, 0, 760);
    sky.addColorStop(0, "#38bdf8");
    sky.addColorStop(0.45, "#7dd3fc");
    sky.addColorStop(0.78, "#fde68a");
    sky.addColorStop(1, "#fb923c");
    c.fillStyle = sky;
    c.fillRect(cam.x - 40, cam.y - 40, viewW + 80, viewH + 80);
    c.fillStyle = "#fef3c7";
    c.beginPath();
    c.arc(cam.x + viewW * 0.78, 300, 46, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "rgba(254,243,199,.7)";
    c.lineWidth = 3;
    for (var r = 0; r < 8; r++) {
      var ang = t * 0.3 + r * Math.PI / 4;
      c.beginPath();
      c.moveTo(cam.x + viewW * 0.78 + Math.cos(ang) * 58, 300 + Math.sin(ang) * 58);
      c.lineTo(cam.x + viewW * 0.78 + Math.cos(ang) * 76, 300 + Math.sin(ang) * 76);
      c.stroke();
    }
    for (var i = 0; i < clouds.length; i++) {
      var cl = clouds[i];
      var cx = cl.x - cam.x * 0.15 + t * cl.v;
      cx = ((cx % 2200) + 2200) % 2200 + cam.x - 200;
      c.fillStyle = "rgba(255,255,255,.82)";
      c.beginPath();
      c.ellipse(cx, cl.y, 34 * cl.s, 16 * cl.s, 0, 0, Math.PI * 2);
      c.ellipse(cx + 24 * cl.s, cl.y + 4, 24 * cl.s, 14 * cl.s, 0, 0, Math.PI * 2);
      c.ellipse(cx - 22 * cl.s, cl.y + 6, 20 * cl.s, 12 * cl.s, 0, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = "rgba(234, 88, 12, .18)";
    c.beginPath();
    c.moveTo(cam.x - 50, 820);
    c.quadraticCurveTo(cam.x + viewW * 0.3, 690, cam.x + viewW * 0.55, 800);
    c.quadraticCurveTo(cam.x + viewW * 0.8, 640, cam.x + viewW + 80, 790);
    c.lineTo(cam.x + viewW + 80, 900);
    c.lineTo(cam.x - 50, 900);
    c.fill();
  }

  function drawPlatform(c, p, t) {
    var x = p.x, y = p.y, w = p.w, h = Math.max(p.h, 16);
    c.fillStyle = "rgba(28,25,23,.18)";
    roundRect(c, x + 4, y + 8, w, h, 8);
    c.fill();
    if (p.kind === "metal") {
      c.fillStyle = "#475569";
      roundRect(c, x, y, w, h + 8, 8);
      c.fill();
      c.fillStyle = "#facc15";
      for (var s = 8; s < w - 8; s += 16) {
        c.fillRect(x + s, y + 2, 8, 6);
      }
      var dir = Math.cos(t * p.freq * Math.PI * 2) >= 0 ? 1 : -1;
      c.fillStyle = "#e2e8f0";
      c.beginPath();
      var ax = x + w / 2, ay = y + h * 0.65;
      c.moveTo(ax + dir * 16, ay);
      c.lineTo(ax - dir * 8, ay - 7);
      c.lineTo(ax - dir * 8, ay + 7);
      c.fill();
    } else if (p.kind === "goal") {
      c.fillStyle = "#b45309";
      roundRect(c, x, y, w, h + 10, 10);
      c.fill();
      c.fillStyle = "#4ade80";
      roundRect(c, x, y, w, 12, 6);
      c.fill();
      c.fillStyle = "#f472b6";
      for (var b = 18; b < w - 10; b += 28) {
        c.beginPath();
        c.moveTo(x + b, y);
        c.lineTo(x + b + 8, y - 14);
        c.lineTo(x + b + 16, y);
        c.fill();
      }
    } else if (p.kind === "stone") {
      c.fillStyle = "#78716c";
      roundRect(c, x, y, w, h + 8, 7);
      c.fill();
      c.fillStyle = "#a8a29e";
      roundRect(c, x, y, w, 8, 4);
      c.fill();
    } else {
      c.fillStyle = "#c2410c";
      roundRect(c, x, y, w, h + 10, 9);
      c.fill();
      c.fillStyle = "#fb923c";
      for (var plank = 10; plank < w - 6; plank += 22) c.fillRect(x + plank, y + 14, 2, h - 6);
      c.fillStyle = "#4ade80";
      roundRect(c, x, y, w, 12, 6);
      c.fill();
      c.fillStyle = "#16a34a";
      for (var g = 8; g < w; g += 14) {
        c.beginPath();
        c.moveTo(x + g, y + 2);
        c.lineTo(x + g + 3, y - 6);
        c.lineTo(x + g + 6, y + 2);
        c.fill();
      }
    }
  }

  function drawFire(c, f, t) {
    var alive = f.hp > 0;
    var s = alive ? (0.72 + 0.28 * f.hp) : Math.max(0, f.fade);
    if (s <= 0.02) return;
    var flick = 0.9 + Math.sin(t * 14 + f.x) * 0.1;
    c.save();
    c.translate(f.x, f.y);
    c.scale(s * flick, s * flick);
    c.fillStyle = "rgba(251, 146, 60, .35)";
    c.beginPath();
    c.ellipse(0, 8, 16, 5, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#fb923c";
    c.beginPath();
    c.moveTo(-12, 6);
    c.quadraticCurveTo(-14, -16, 0, -28);
    c.quadraticCurveTo(14, -16, 12, 6);
    c.fill();
    c.fillStyle = "#ef4444";
    c.beginPath();
    c.moveTo(-7, 6);
    c.quadraticCurveTo(-8, -8, 0, -18);
    c.quadraticCurveTo(9, -6, 7, 6);
    c.fill();
    c.fillStyle = "#fde68a";
    c.beginPath();
    c.moveTo(-3, 5);
    c.quadraticCurveTo(-2, -4, 1, -10);
    c.quadraticCurveTo(4, -2, 3, 5);
    c.fill();
    c.restore();
  }

  function drawFox(c, x, y, aimx, aimy, spraying, t) {
    var face = aimx < 0 ? -1 : 1;
    var bob = (!spraying) ? Math.sin(t * 3) * 1.1 : 0;
    c.save();
    c.translate(x, y + bob);
    c.scale(face, 1);
    var lean = spraying ? Math.max(-0.35, Math.min(0.35, -aimy * 0.25)) : Math.max(-0.2, Math.min(0.2, (fox.vx * face) / 4000));
    c.rotate(lean);
    c.fillStyle = "rgba(28,25,23,.18)";
    c.beginPath();
    c.ellipse(0, 2, 16, 4, 0, 0, Math.PI * 2);
    c.fill();
    var wag = Math.sin(t * 7) * 3;
    c.fillStyle = "#fb923c";
    c.beginPath();
    c.ellipse(-20, -20 + wag * 0.15, 13, 9, -0.5, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#fff7ed";
    c.beginPath();
    c.arc(-28, -26 + wag * 0.2, 5.5, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#9a3412";
    roundRect(c, -12, -16, 7, 16, 3); c.fill();
    roundRect(c, 5, -16, 7, 16, 3); c.fill();
    c.fillStyle = "#334155";
    roundRect(c, -13, -6, 9, 7, 2); c.fill();
    roundRect(c, 4, -6, 9, 7, 2); c.fill();
    c.fillStyle = "#f97316";
    c.beginPath();
    c.ellipse(0, -30, 16, 16, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#fff7ed";
    c.beginPath();
    c.ellipse(3, -26, 8, 10, 0.1, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#fb923c";
    c.beginPath();
    c.arc(10, -48, 13, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#fff7ed";
    c.beginPath();
    c.ellipse(18, -44, 7, 5.5, 0.1, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#fb7185";
    c.beginPath();
    c.arc(16, -42, 2, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#1c1917";
    c.beginPath();
    c.arc(22, -44, 2.1, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.arc(14, -50, 2.3, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#fff";
    c.beginPath();
    c.arc(14.8, -50.8, 0.8, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#f97316";
    c.beginPath();
    c.moveTo(2, -56); c.lineTo(6, -74); c.lineTo(14, -56); c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(12, -58); c.lineTo(18, -76); c.lineTo(22, -56); c.closePath(); c.fill();
    c.fillStyle = "#fb7185";
    c.beginPath();
    c.moveTo(5, -58); c.lineTo(7, -68); c.lineTo(12, -58); c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(14, -59); c.lineTo(18, -69); c.lineTo(20, -58); c.closePath(); c.fill();
    c.fillStyle = "#dc2626";
    c.beginPath();
    c.arc(10, -52, 12, Math.PI * 1.05, Math.PI * 1.95);
    c.fill();
    c.fillStyle = "#fecaca";
    c.beginPath();
    c.ellipse(6, -60, 4, 2, -0.5, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#facc15";
    c.beginPath();
    c.arc(18, -54, 2.4, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = "#f59e0b";
    roundRect(c, 0, -40, 16, 6, 3); c.fill();
    c.beginPath();
    c.moveTo(14, -36); c.quadraticCurveTo(24, -30, 16, -26); c.lineTo(12, -34); c.fill();
    c.restore();

    var nx = x + aimx * 40;
    var ny = y - 32 + aimy * 40;
    c.strokeStyle = "#334155";
    c.lineWidth = 5;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(x + face * 8, y - 30);
    c.quadraticCurveTo(x + face * 16, y - 18, nx, ny);
    c.stroke();
    c.save();
    c.translate(nx, ny);
    c.rotate(Math.atan2(aimy, aimx));
    c.fillStyle = "#fbbf24";
    roundRect(c, -2, -5, 14, 10, 3);
    c.fill();
    c.fillStyle = "#57534e";
    roundRect(c, 8, -3.5, 8, 7, 2);
    c.fill();
    c.restore();
  }

  function drawStream(c) {
    if (!input.spray || mode !== "play") {
      var x1 = fox.x + aim.x * 46;
      var y1 = fox.y - 32 + aim.y * 46;
      c.strokeStyle = "rgba(255,255,255,.85)";
      c.lineWidth = 2;
      c.setLineDash([4, 5]);
      c.beginPath();
      c.moveTo(fox.x + aim.x * 28, fox.y - 32 + aim.y * 28);
      c.lineTo(x1, y1);
      c.stroke();
      c.setLineDash([]);
      c.fillStyle = "#fff";
      c.beginPath();
      c.arc(x1, y1, 3.5, 0, Math.PI * 2);
      c.fill();
      return;
    }
    var nx = fox.x + aim.x * 40;
    var ny = fox.y - 32 + aim.y * 40;
    var x2 = nx + aim.x * WATER_RANGE;
    var y2 = ny + aim.y * WATER_RANGE;
    c.strokeStyle = "rgba(224,242,254,.95)";
    c.lineWidth = 12;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(nx, ny);
    c.lineTo(x2, y2);
    c.stroke();
    c.strokeStyle = "#22d3ee";
    c.lineWidth = 6;
    c.beginPath();
    c.moveTo(nx, ny);
    c.lineTo(x2, y2);
    c.stroke();
    c.strokeStyle = "rgba(255,255,255,.9)";
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(nx, ny);
    c.lineTo(x2, y2);
    c.stroke();
    c.strokeStyle = "rgba(255,255,255,.75)";
    c.lineWidth = 3;
    for (var i = 0; i < 4; i++) {
      var o = 18 + i * 12;
      c.beginPath();
      c.moveTo(fox.x - aim.x * o, fox.y - 26 - aim.y * o);
      c.lineTo(fox.x - aim.x * (o + 18), fox.y - 26 - aim.y * (o + 16));
      c.stroke();
    }
  }

  function drawFlag(c, t) {
    var x = GOAL.x, y = GOAL.top;
    c.strokeStyle = "#44403c";
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x, y - 118);
    c.stroke();
    var wave = Math.sin(t * 5) * 4;
    c.fillStyle = firesLeft() === 0 ? "#22c55e" : "#ef4444";
    c.beginPath();
    c.moveTo(x, y - 116);
    c.lineTo(x + 42, y - 100 + wave);
    c.lineTo(x, y - 82);
    c.fill();
    c.fillStyle = "#fff";
    c.font = "900 18px " + FONT;
    c.textAlign = "center";
    c.fillText("ゴール", x + 8, y - 128);
  }

  function drawPopups(c) {
    c.textAlign = "center";
    c.lineJoin = "round";
    for (var i = 0; i < popups.length; i++) {
      var p = popups[i];
      var u = 1 - p.life / p.max;
      var s = u < 0.16 ? 0.45 + (u / 0.16) * 0.75 : u > 0.72 ? 1 - (u - 0.72) : 1;
      var alpha = u > 0.72 ? Math.max(0, 1 - (u - 0.72) / 0.28) : 1;
      c.globalAlpha = alpha;
      c.font = "900 " + Math.round(54 * s) + "px " + FONT;
      c.lineWidth = 8;
      c.strokeStyle = "#0e7490";
      c.fillStyle = "#fff";
      var py = p.y - u * 28;
      c.strokeText(p.text, p.x, py);
      c.fillText(p.text, p.x, py);
      c.globalAlpha = 1;
    }
  }

  function draw() {
    resize();
    var t = elapsed || (performance.now() / 1000);
    var sx = (Math.random() - 0.5) * shake;
    var sy = (Math.random() - 0.5) * shake;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.save();
    ctx.scale(cssW / viewW, cssH / viewH);
    ctx.translate(-(cam.x + sx), -(cam.y + sy));
    drawBackground(ctx, t);
    for (var i = 0; i < platforms.length; i++) drawPlatform(ctx, platforms[i], t);
    drawFlag(ctx, t);
    for (var f = 0; f < fires.length; f++) drawFire(ctx, fires[f], t);
    for (var d = 0; d < drops.length; d++) {
      var drop = drops[d];
      ctx.globalAlpha = Math.max(0, drop.life * 4);
      ctx.fillStyle = "#e0f2fe";
      ctx.beginPath();
      ctx.arc(drop.x, drop.y, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (var s = 0; s < sparks.length; s++) {
      var spk = sparks[s];
      ctx.globalAlpha = Math.max(0, spk.life / spk.max);
      ctx.fillStyle = spk.color;
      ctx.beginPath();
      ctx.arc(spk.x, spk.y, spk.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawStream(ctx);
    var faceAimX = aim.x, faceAimY = aim.y;
    drawFox(ctx, fox.x, fox.y, faceAimX, faceAimY, input.spray && mode === "play", t);
    ctx.fillStyle = "#fff7ed";
    roundRect(ctx, 248, 512, 96, 28, 6);
    ctx.fill();
    ctx.fillStyle = "#9a3412";
    ctx.font = "900 15px " + FONT;
    ctx.textAlign = "center";
    ctx.fillText("スタート", 296, 532);
    drawPopups(ctx);
    ctx.restore();
  }

  function drawDemo() {
    if (titleCard.hidden) return;
    var w = demo.width, h = demo.height;
    var t = performance.now() / 1000;
    var phase = t % 2.5;
    var foxX = 150;
    var spraying = false;
    var fireOn = true;
    if (phase < 0.42) {
      spraying = true;
      foxX = 150 - phase * 90;
    } else if (phase < 1.15) {
      var u = (phase - 0.42) / 0.73;
      foxX = 150 - 0.42 * 90 - u * 24;
      fireOn = false;
    } else if (phase < 1.7) {
      foxX = 112;
      fireOn = false;
    } else {
      var back = (phase - 1.7) / 0.8;
      foxX = 112 + back * 38;
      fireOn = phase > 2.15;
    }
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    var g = dctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#38bdf8");
    g.addColorStop(1, "#fde68a");
    dctx.fillStyle = g;
    dctx.fillRect(0, 0, w, h);
    dctx.save();
    dctx.translate(0, 18);
    dctx.scale(1.15, 1.15);
    dctx.fillStyle = "#c2410c";
    roundRect(dctx, 40, 150, 360, 28, 8);
    dctx.fill();
    dctx.fillStyle = "#4ade80";
    roundRect(dctx, 40, 150, 360, 10, 5);
    dctx.fill();
    if (fireOn) {
      dctx.fillStyle = "#fb923c";
      dctx.beginPath();
      dctx.moveTo(300, 150);
      dctx.quadraticCurveTo(292, 120, 312, 108);
      dctx.quadraticCurveTo(330, 122, 324, 150);
      dctx.fill();
    } else if (phase < 1.7) {
      dctx.fillStyle = "#fff";
      dctx.font = "900 28px " + FONT;
      dctx.textAlign = "center";
      dctx.fillText("けした！", 312, 118);
    }
    if (spraying) {
      dctx.strokeStyle = "#e0f2fe";
      dctx.lineWidth = 8;
      dctx.lineCap = "round";
      dctx.beginPath();
      dctx.moveTo(foxX + 30, 118);
      dctx.lineTo(330, 130);
      dctx.stroke();
      dctx.strokeStyle = "rgba(255,255,255,.8)";
      dctx.lineWidth = 3;
      dctx.beginPath();
      dctx.moveTo(foxX - 10, 120);
      dctx.lineTo(foxX - 40, 124);
      dctx.stroke();
    }
    drawFox(dctx, foxX, 150, 1, 0.15, spraying, t);
    dctx.restore();
  }

  function updateVisuals(dt) {
    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.life -= dt;
      if (d.life <= 0) drops.splice(i, 1);
    }
    for (var s = sparks.length - 1; s >= 0; s--) {
      var sp = sparks[s];
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vy += 280 * dt;
      sp.life -= dt;
      if (sp.life <= 0) sparks.splice(s, 1);
    }
    for (var p = popups.length - 1; p >= 0; p--) {
      popups[p].life -= dt;
      if (popups[p].life <= 0) popups.splice(p, 1);
    }
    for (var f = 0; f < fires.length; f++) {
      if (fires[f].hp <= 0 && fires[f].fade > 0) fires[f].fade -= dt / 0.45;
    }
    shake *= 0.86;
    if (shake < 0.05) shake = 0;
  }

  function refreshHud() {
    var left = firesLeft();
    fireLabel.innerHTML = "<small>火</small>あと " + left;
    var remain = mode === "play" ? Math.max(0, LIMIT - elapsed) : LIMIT;
    if (mode === "win" || mode === "fail") remain = Math.max(0, LIMIT - elapsed);
    timerEl.innerHTML = "<small>のこり</small>" + remain.toFixed(1);
    timerEl.className = "timer" + (mode === "play" && remain < 10 ? " warn" : "");
    var prog = Math.max(0, Math.min(1, fox.x / GOAL.x));
    barFill.style.width = (prog * 100).toFixed(1) + "%";
    if (mode !== "play") {
      hintEl.textContent = "";
      return;
    }
    if (elapsed < 4.2) hintEl.textContent = "みずの向きと、はんたいにとぶ";
    else if (!airborneTaught && left <= 6) hintEl.textContent = "下にむけると、うえにはねる";
    else if (left === 0) hintEl.textContent = "ゴールのはたへ！";
    else hintEl.textContent = "";
  }

  function showBest() {
    var b = loadBest();
    titleBest.textContent = b == null ? "ベスト まだない" : "ベスト " + fmt(b);
  }

  function showEnd(win, isBest) {
    titleCard.hidden = true;
    endCard.hidden = false;
    overlay.hidden = false;
    var kicker = document.getElementById("end-kicker");
    var title = document.getElementById("end-title");
    var why = document.getElementById("end-why");
    var meta = document.getElementById("end-meta");
    var record = document.getElementById("end-record");
    var putOut = FIRE_SRC.length - firesLeft();
    if (win) {
      kicker.hidden = true;
      title.textContent = "クリア";
      why.className = "why ok";
      why.textContent = fmt(elapsed) + " で火を " + FIRE_SRC.length + "こ けした";
      meta.textContent = "タイム " + fmt(elapsed);
      record.textContent = isBest ? "ベストこうしん！" : (loadBest() != null ? "ベスト " + fmt(loadBest()) : "");
      blip(523, 0.12, "sine", 0.05);
      setTimeout(function () { blip(659, 0.12, "sine", 0.05); }, 120);
      setTimeout(function () { blip(784, 0.18, "triangle", 0.05); }, 240);
    } else {
      kicker.hidden = false;
      var word = reasonWord(endReason);
      title.textContent = word;
      why.className = "why";
      if (endReason === "burn") why.textContent = fmt(elapsed) + "で火にふれた · 火 あと " + firesLeft();
      else if (endReason === "time") why.textContent = LIMIT.toFixed(0) + "びょう経過 · 火 あと " + firesLeft();
      else why.textContent = fmt(elapsed) + "で場外 · 火 あと " + firesLeft();
      meta.textContent = "けした火 " + putOut + " / " + FIRE_SRC.length;
      record.textContent = "";
      blip(180, 0.22, "sawtooth", 0.04);
    }
    actions.classList.add("locked");
    var buttons = actions.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
    clearTimeout(lockTimer);
    lockTimer = setTimeout(function () {
      actions.classList.remove("locked");
      for (var j = 0; j < buttons.length; j++) buttons[j].disabled = false;
    }, 850);
  }

  function shareLine() {
    if (mode === "win") {
      return "はねかえりホースを" + fmt(elapsed) + "でクリア！火を" + FIRE_SRC.length + "こけした " + PAGE;
    }
    return "はねかえりホースは「" + reasonWord(endReason) + "」（" + fmt(elapsed) + "・火あと" + firesLeft() + "） " + PAGE;
  }

  function startGame() {
    resetWorld();
    mode = "play";
    scripted = false;
    document.body.dataset.mode = mode;
    overlay.hidden = true;
    titleCard.hidden = false;
    endCard.hidden = true;
    snapCamera();
    showBest();
    refreshHud();
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }

  function openTitle() {
    mode = "title";
    document.body.dataset.mode = mode;
    if (!platforms.length) resetWorld();
    overlay.hidden = false;
    titleCard.hidden = false;
    endCard.hidden = true;
    showBest();
    snapCamera();
  }

  document.getElementById("btn-start").addEventListener("click", function () {
    startGame();
  });
  document.getElementById("btn-retry").addEventListener("click", function () {
    if (actions.classList.contains("locked")) return;
    startGame();
  });
  document.getElementById("btn-copy").addEventListener("click", function () {
    if (actions.classList.contains("locked")) return;
    var text = shareLine();
    var btn = document.getElementById("btn-copy");
    function done() {
      btn.textContent = "コピーした";
      setTimeout(function () { btn.textContent = "結果をコピー"; }, 1000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        fallbackCopy(text); done();
      });
    } else {
      fallbackCopy(text); done();
    }
  });
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }

  function pressAt(e) {
    if (mode !== "play") return;
    pointer.down = true;
    pointer.valid = true;
    if (e.pointerId != null) pointer.id = e.pointerId;
    setPointer(e);
  }
  function moveAt(e) {
    if (mode !== "play") return;
    pointer.valid = true;
    setPointer(e);
  }
  canvas.addEventListener("pointerdown", function (e) {
    pressAt(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  canvas.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    pressAt(e);
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", moveAt);
  canvas.addEventListener("mousemove", moveAt);
  function endPointer(e) {
    if (e.pointerId != null && pointer.id != null && e.pointerId !== pointer.id) return;
    pointer.down = false;
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("mouseup", function () { pointer.down = false; });
  window.addEventListener("mouseup", function () { pointer.down = false; });
  function setPointer(e) {
    var rect = canvas.getBoundingClientRect();
    pointer.sx = e.clientX - rect.left;
    pointer.sy = e.clientY - rect.top;
  }

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    if (e.code === "ArrowLeft") arrows.left = true;
    if (e.code === "ArrowRight") arrows.right = true;
    if (e.code === "ArrowUp") arrows.up = true;
    if (e.code === "ArrowDown") arrows.down = true;
    if (e.code === "Space") {
      spaceDown = true;
      if (e.repeat) return;
      if (mode === "title") { suppressSpace = true; startGame(); }
      else if ((mode === "win" || mode === "fail") && !actions.classList.contains("locked")) {
        suppressSpace = true;
        startGame();
      }
    }
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "ArrowLeft") arrows.left = false;
    if (e.code === "ArrowRight") arrows.right = false;
    if (e.code === "ArrowUp") arrows.up = false;
    if (e.code === "ArrowDown") arrows.down = false;
    if (e.code === "Space") { spaceDown = false; suppressSpace = false; }
  });
  window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("resize", resize);

  function loop(now) {
    if (!lastTs) lastTs = now;
    var frameDt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;
    if (mode === "play" && !scripted) {
      gatherInput();
      acc += frameDt;
      var guard = 0;
      while (acc >= DT && guard < 4) {
        step();
        acc -= DT;
        guard++;
        if (mode !== "play") { acc = 0; break; }
      }
    }
    updateVisuals(frameDt);
    updateCamera();
    draw();
    drawDemo();
    refreshHud();
    document.body.dataset.mode = mode;
    requestAnimationFrame(loop);
  }

  window.__debug = {
    start: function () { startGame(); scripted = true; },
    setInput: function (inp) {
      scripted = true;
      input.spray = !!inp.spray;
      input.target = inp.target || null;
      input.dir = inp.dir == null ? null : inp.dir;
    },
    tick: function (n) {
      for (var i = 0; i < (n || 1); i++) {
        if (mode !== "play") break;
        var r = step();
        if (r !== "ok") break;
      }
    },
    screen: function (wx, wy) {
      var rect = canvas.getBoundingClientRect();
      return {
        x: rect.left + ((wx - cam.x) / viewW) * rect.width,
        y: rect.top + ((wy - cam.y) / viewH) * rect.height
      };
    },
    state: function () {
      return {
        mode: mode,
        x: fox.x, y: fox.y, vx: fox.vx, vy: fox.vy,
        ground: fox.ground,
        left: firesLeft(),
        time: elapsed,
        aimx: aim.x, aimy: aim.y,
        reason: endReason,
        fires: fires.map(function (f) { return { name: f.name, hp: f.hp }; })
      };
    }
  };

  resetWorld();
  openTitle();
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
