<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5c3a24">
  <meta name="description" content="みぬきけんさ — Spot Check. ルールをみて、みる・ふる・はかる。">
  <title>みぬきけんさ — Spot Check</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%235c3a24'/%3E%3Ccircle cx='8' cy='8.2' r='5.2' fill='%238a837b'/%3E%3Cellipse cx='6.1' cy='8' rx='1.7' ry='1.35' fill='%232a241c'/%3E%3Cellipse cx='9.9' cy='8' rx='1.7' ry='1.35' fill='%232a241c'/%3E%3Ccircle cx='6.2' cy='8' r='.55' fill='%23fff'/%3E%3Ccircle cx='10' cy='8' r='.55' fill='%23fff'/%3E%3Ccircle cx='11.6' cy='11.2' r='1.7' fill='%23e1c27a' stroke='%236b4e16' stroke-width='.4'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #2a2118;
      --muted: #6e5c48;
      --cream: #fff8ee;
      --paper: #f3e6d0;
      --stamp: #c4372f;
      --stamp-dark: #8e241e;
      --brass: #c6a15b;
      --brass-dark: #6b4e16;
      --look: #2f6f8f;
      --shake: #a86520;
      --measure: #6f5424;
      --pass: #1f7a4d;
      --pass-dark: #145c38;
      --line: rgba(42, 33, 24, .12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      color: var(--ink);
      background-color: #4a2e1b;
      background-image:
        radial-gradient(90% 42% at 100% 0%, rgba(231, 201, 138, .38), transparent 48%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 8px),
        linear-gradient(180deg, #8d5a38 0%, #5c3a24 46%, #3d2616 100%);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "WenQuanYi Micro Hei", "Droid Sans Fallback", "Meiryo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    [hidden] { display: none !important; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--brass);
      outline-offset: 2px;
    }
    .back {
      position: fixed;
      z-index: 40;
      top: max(10px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 248, 238, .94);
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-decoration: none;
    }
    .shell {
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding:
        calc(max(10px, env(safe-area-inset-top)) + 42px)
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      min-height: 0;
    }
    .hud {
      flex: none;
      padding: 6px 10px 7px;
      border-radius: 16px;
      background: rgba(255, 248, 238, .96);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 22px rgba(48, 28, 16, .18);
    }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-char { width: 54px; height: 62px; flex: none; }
    .hud-char .raccoon { width: 54px; height: 62px; }
    .day { flex: 1; min-width: 0; font-weight: 900; line-height: 1.1; }
    .day b { display: block; font-size: 1.02rem; letter-spacing: .04em; }
    .day span { color: var(--muted); font-size: .72rem; font-weight: 800; }
    .strikes {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 900;
      font-size: .78rem;
      letter-spacing: .02em;
    }
    .pip {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px var(--brass-dark);
      display: grid;
      place-items: center;
      font-size: 11px;
      color: transparent;
      background: transparent;
    }
    .pip.on {
      background: var(--stamp);
      box-shadow: none;
      color: #fff;
    }
    .timer {
      min-width: 46px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 1.35rem;
      line-height: 1;
      color: var(--brass-dark);
    }
    .timer small { display: block; font-size: .62rem; letter-spacing: .08em; color: var(--muted); }
    .timer.warn { color: var(--stamp); }
    .timer.warn small { color: var(--stamp); }
    .bar {
      margin-top: 5px;
      height: 7px;
      border-radius: 999px;
      background: #eadcc6;
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brass-dark), var(--brass));
      transform-origin: left center;
    }
    .bar > div.warn { background: var(--stamp); }
    .rule {
      flex: none;
      padding: 7px 12px 8px;
      border-radius: 16px;
      background: var(--cream);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 20px rgba(48, 28, 16, .16);
    }
    .rule .kicker {
      margin: 0;
      color: var(--stamp);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .14em;
    }
    .rule p {
      margin: 2px 0 0;
      font-size: .9rem;
      font-weight: 800;
      line-height: 1.35;
    }
    .rule ol {
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 1px;
      font-size: .8rem;
      font-weight: 800;
      line-height: 1.3;
    }
    .rule.pulse { animation: rulepop .7s ease; }
    @keyframes rulepop {
      0% { box-shadow: inset 0 0 0 2px var(--stamp), 0 8px 20px rgba(48, 28, 16, .16); }
      100% { box-shadow: inset 0 0 0 1px var(--line), 0 8px 20px rgba(48, 28, 16, .16); }
    }
    .item {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 10px 8px;
      border-radius: 18px;
      background: var(--cream);
      box-shadow: inset 0 -4px 0 var(--brass), inset 0 0 0 1px rgba(42, 33, 24, .08), 0 10px 24px rgba(48, 28, 16, .16);
    }
    .item-name {
      margin: 0;
      flex: none;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: .04em;
    }
    .art {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      place-items: center;
    }
    .art svg {
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }
    .art.arrive { animation: arrive .32s ease; }
    @keyframes arrive {
      from { transform: translateX(28px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .art.pulse-shake { animation: jiggle .42s ease; }
    .art.pulse-look { animation: peek .42s ease; }
    .art.pulse-measure { animation: weigh .42s ease; }
    @keyframes jiggle {
      20% { transform: rotate(-4deg); }
      40% { transform: rotate(4deg); }
      60% { transform: rotate(-2deg); }
      80% { transform: rotate(2deg); }
    }
    @keyframes peek {
      40% { transform: scale(1.06); }
      100% { transform: none; }
    }
    @keyframes weigh {
      40% { transform: translateY(5px); }
      100% { transform: none; }
    }
    .declare {
      margin: 0;
      flex: none;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--measure);
      font-size: .78rem;
      font-weight: 800;
    }
    .chips {
      flex: none;
      display: grid;
      gap: 4px;
      min-height: 34px;
    }
    .chip-empty {
      margin: 0;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255, 248, 238, .55);
      color: var(--cream);
      font-size: .78rem;
      font-weight: 800;
      text-align: center;
    }
    .chip {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 6px 8px;
      border-radius: 10px;
      font-size: .78rem;
      font-weight: 800;
      line-height: 1.35;
      animation: chipin .22s ease;
    }
    .chip b { flex: none; min-width: 3.1em; letter-spacing: .06em; }
    .chip-look { background: #e7f3f8; color: #1a4d66; box-shadow: inset 4px 0 0 var(--look); }
    .chip-shake { background: #fff1e4; color: #7a4510; box-shadow: inset 4px 0 0 var(--shake); }
    .chip-measure { background: #f8f1e2; color: #5c4520; box-shadow: inset 4px 0 0 var(--brass-dark); }
    @keyframes chipin {
      from { transform: translateY(-6px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }
    .controls { flex: none; display: grid; gap: 8px; }
    .inspect, .decide { display: grid; gap: 8px; }
    .inspect { grid-template-columns: 1fr 1fr 1fr; }
    .decide { grid-template-columns: 1fr 1fr; }
    .controls button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      min-height: 50px;
      padding: 8px 4px;
      color: #fff;
      font: inherit;
      font-weight: 900;
      font-size: 1.12rem;
      letter-spacing: .12em;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .2);
    }
    .decide button { min-height: 54px; font-size: 1.2rem; }
    .controls button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .2);
    }
    .controls button:disabled {
      opacity: .4;
      box-shadow: none;
      cursor: default;
    }
    .btn-look { background: var(--look); }
    .btn-shake { background: var(--shake); }
    .btn-measure { background: var(--measure); }
    .btn-pass { background: var(--pass); box-shadow: 0 4px 0 var(--pass-dark); }
    .btn-seal { background: var(--stamp); box-shadow: 0 4px 0 var(--stamp-dark); }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding:
        calc(max(10px, env(safe-area-inset-top)) + 46px)
        14px
        max(12px, env(safe-area-inset-bottom));
      overflow: auto;
    }
    #title {
      background:
        radial-gradient(80% 40% at 100% 0%, rgba(231, 201, 138, .4), transparent 50%),
        linear-gradient(180deg, #8d5a38 0%, #4a2e1b 100%);
    }
    #result { z-index: 24; background: rgba(48, 28, 16, .52); }
    #flash {
      z-index: 22;
      background: rgba(48, 28, 16, .22);
      pointer-events: auto;
    }
    .card {
      width: min(100%, 420px);
      margin: auto;
      padding: 16px 16px 14px;
      border-radius: 22px;
      background: var(--cream);
      box-shadow: 0 18px 48px rgba(48, 28, 16, .35);
      text-align: center;
    }
    .card.out { box-shadow: inset 0 0 0 4px var(--stamp), 0 18px 48px rgba(48, 28, 16, .35); }
    .card.clear { box-shadow: inset 0 0 0 4px var(--pass), 0 18px 48px rgba(48, 28, 16, .35); }
    .card.time { box-shadow: inset 0 0 0 4px var(--shake), 0 18px 48px rgba(48, 28, 16, .35); }
    .title-char { width: 136px; margin: 0 auto 2px; }
    .card-char { width: 96px; margin: 0 auto 4px; }
    .flash-box { text-align: center; }
    .flash-char { width: 96px; margin: 0 auto 6px; }
    .card h1 {
      margin: 0 0 4px;
      font-size: clamp(1.7rem, 7vw, 2.3rem);
      letter-spacing: .06em;
      line-height: 1.15;
    }
    .card h1.out { color: var(--stamp); font-size: clamp(2.2rem, 10vw, 3rem); }
    .card h1.clear { color: var(--pass); }
    .card h1.time { color: #9a5410; }
    .card h1.miss { color: var(--stamp); }
    .card .en {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }
    .card .dayline {
      margin: 0 0 10px;
      color: var(--brass-dark);
      font-size: .75rem;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .legend {
      list-style: none;
      margin: 0 0 8px;
      padding: 0;
      display: grid;
      gap: 6px;
      text-align: left;
    }
    .legend li {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px 10px;
      border-radius: 12px;
      background: #fff;
      font-weight: 800;
      font-size: .92rem;
    }
    .legend b { min-width: 3.2em; letter-spacing: .08em; }
    .legend span { color: var(--muted); font-size: .82rem; }
    .c-look { box-shadow: inset 4px 0 0 var(--look); }
    .c-look b { color: var(--look); }
    .c-shake { box-shadow: inset 4px 0 0 var(--shake); }
    .c-shake b { color: var(--shake); }
    .c-measure { box-shadow: inset 4px 0 0 var(--measure); }
    .c-measure b { color: var(--measure); }
    .then {
      margin: 0 0 12px;
      font-size: .86rem;
      font-weight: 800;
      line-height: 1.45;
    }
    .then .go { color: var(--pass); }
    .then .stop { color: var(--stamp); }
    .primary {
      appearance: none;
      width: 100%;
      border: 0;
      border-radius: 14px;
      min-height: 52px;
      padding: 12px 16px;
      color: #fff;
      background: var(--stamp);
      box-shadow: 0 5px 0 var(--stamp-dark);
      font: inherit;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: .12em;
      cursor: pointer;
    }
    .primary:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--stamp-dark); }
    .card.clear .primary { background: var(--pass); box-shadow: 0 5px 0 var(--pass-dark); }
    .why, .tell, .note, .meta {
      margin: 0 0 8px;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 900;
      line-height: 1.45;
      text-align: left;
    }
    .why { background: #fde8e6; color: var(--stamp-dark); font-size: .98rem; }
    .card.clear .why { background: #e5f6ec; color: var(--pass-dark); text-align: center; }
    .tell, .note { background: #fff6e4; color: #5c4520; font-size: .84rem; font-weight: 800; white-space: pre-line; }
    .meta { background: transparent; padding: 0 2px; color: var(--muted); font-size: .8rem; text-align: center; }
    .marks {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 0 0 10px;
    }
    .mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
      background: var(--paper);
      color: var(--muted);
    }
    .mark.ok { background: #e5f6ec; color: var(--pass); }
    .mark.bad { background: #fde8e6; color: var(--stamp); }
    #flash .word {
      display: inline-block;
      padding: 6px 16px 8px;
      border: 6px solid currentColor;
      border-radius: 16px;
      color: #fff;
      font-size: clamp(2.6rem, 12vw, 4.2rem);
      font-weight: 900;
      letter-spacing: .08em;
      line-height: 1.1;
      transform: rotate(-8deg);
      animation: stamp .28s cubic-bezier(.2, 1.5, .3, 1) both;
    }
    #flash .word.pass { color: #e9fff4; text-shadow: 0 4px 0 var(--pass-dark); }
    #flash .word.seal { color: #fff; text-shadow: 0 4px 0 var(--stamp-dark); }
    @keyframes stamp {
      0% { transform: scale(1.7) rotate(-16deg); opacity: 0; }
      100% { transform: scale(1) rotate(-8deg); opacity: 1; }
    }
    .raccoon { display: block; width: 100%; height: auto; overflow: visible; }
    .raccoon .fx { display: none; }
    .raccoon.is-idle .fx-idle,
    .raccoon.is-look .fx-look,
    .raccoon.is-shake .fx-shake,
    .raccoon.is-measure .fx-measure,
    .raccoon.is-yay .fx-yay,
    .raccoon.is-sad .fx-sad { display: block; }
    .raccoon .tail {
      transform-origin: 40px 108px;
      animation: wag 2.2s ease-in-out infinite;
    }
    .raccoon.is-yay { animation: hop .55s ease-in-out 2; }
    .raccoon.is-sad { transform: translateY(2px); }
    .raccoon.is-measure .clip { transform: rotate(-8deg); transform-origin: 108px 116px; }
    @keyframes wag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .art text { font-family: inherit; font-weight: 900; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">ギャラリー</a>

  <main class="shell" id="play" hidden>
    <header class="hud">
      <div class="hud-row">
        <div class="hud-char" id="hud-char"></div>
        <div class="day"><b id="day-label">1にちめ</b><span>/ 6</span></div>
        <div class="strikes" aria-label="ミス">
          <span class="pip" id="pip0">×</span>
          <span class="pip" id="pip1">×</span>
          <span id="miss-count">ミス 0/2</span>
        </div>
        <div class="timer" id="timer" hidden><b id="timer-num">15</b><small>びょう</small></div>
      </div>
      <div class="bar" id="timer-bar-wrap" hidden><div id="timer-bar"></div></div>
    </header>
    <section class="rule" id="rule">
      <p class="kicker">きょうのルール</p>
      <p id="rule-text"></p>
      <ol id="rule-list" hidden></ol>
    </section>
    <section class="item">
      <h2 class="item-name" id="item-name"></h2>
      <div class="art" id="art"></div>
      <p class="declare" id="declare"></p>
    </section>
    <div class="chips" id="chips" aria-live="polite"></div>
    <div class="controls">
      <div class="inspect">
        <button type="button" class="btn-look" id="btn-look">みる</button>
        <button type="button" class="btn-shake" id="btn-shake">ふる</button>
        <button type="button" class="btn-measure" id="btn-measure">はかる</button>
      </div>
      <div class="decide">
        <button type="button" class="btn-pass" id="btn-pass">つうか</button>
        <button type="button" class="btn-seal" id="btn-seal">ふういん</button>
      </div>
    </div>
  </main>

  <section class="overlay" id="title">
    <div class="card">
      <div class="title-char">
        <svg id="mascot" class="raccoon is-idle" viewBox="0 0 128 140" aria-hidden="true">
          <g class="tail">
            <path d="M46 96c-30 6-40 28-22 42 18 10 42-8 36-26-4-12-6-14-14-16z" fill="#d5d8dc"/>
            <path d="M14 132c12 4 22 1 28-6" stroke="#241c16" stroke-width="8" fill="none" stroke-linecap="round"/>
            <path d="M20 120c12 4 20 1 26-6" stroke="#241c16" stroke-width="8" fill="none" stroke-linecap="round"/>
            <path d="M28 108c10 4 16 1 20-5" stroke="#241c16" stroke-width="7" fill="none" stroke-linecap="round"/>
          </g>
          <ellipse cx="46" cy="34" rx="11" ry="13" fill="#b7bcc2" stroke="#2a2118" stroke-width="2"/>
          <ellipse cx="46" cy="36" rx="5" ry="6.5" fill="#f0b7ad"/>
          <ellipse cx="86" cy="34" rx="11" ry="13" fill="#b7bcc2" stroke="#2a2118" stroke-width="2"/>
          <ellipse cx="86" cy="36" rx="5" ry="6.5" fill="#f0b7ad"/>
          <ellipse cx="68" cy="108" rx="30" ry="24" fill="#b7bcc2" stroke="#2a2118" stroke-width="2.2"/>
          <ellipse cx="72" cy="114" rx="16" ry="14" fill="#fff8ee"/>
          <g class="badge">
            <circle cx="50" cy="106" r="13" fill="#f0d48a" stroke="#6b4e16" stroke-width="2.2"/>
            <path d="M50 96.2l2.4 5.8h6.1l-4.9 3.7 1.9 6-5.5-3.6-5.5 3.6 1.9-6-4.9-3.7h6.1z" fill="#6b4e16"/>
          </g>
          <g class="clip">
            <rect x="96" y="92" width="26" height="36" rx="3" fill="#fff" stroke="#6b4e16" stroke-width="2.4"/>
            <rect x="102" y="87" width="14" height="9" rx="2" fill="#f0d48a" stroke="#6b4e16" stroke-width="1.8"/>
            <path d="M101 104h16M101 110h16M101 116h10" stroke="#b4533a" stroke-width="2" stroke-linecap="round"/>
          </g>

      <h1>みぬきけんさ</h1>
      <p class="en">Spot Check</p>
      <p class="dayline">Day 16 · 2026-10-11</p>
      <ul class="legend">
        <li class="c-look"><b>みる</b><span>ラベル・シール・きず</span></li>
        <li class="c-shake"><b>ふる</b><span>おとと てごたえ</span></li>
        <li class="c-measure"><b>はかる</b><span>おもさをしんこくとくらべる</span></li>

  <section class="overlay" id="flash" hidden>
    <div class="flash-box">
      <div class="flash-char" id="flash-char"></div>
      <div class="word" id="flash-word">つうか！</div>

  <section class="overlay" id="result" hidden>
    <div class="card" id="result-card">
      <div class="card-char" id="result-char"></div>
      <h1 id="result-title">アウト</h1>
      <p class="why" id="result-why"></p>
      <p class="note" id="result-note" hidden></p>
      <p class="tell" id="result-tell" hidden></p>
      <div class="marks" id="day-marks" hidden></div>
      <p class="meta" id="result-meta"></p>
      <button type="button" class="primary" id="result-btn">もういちど</button>
    </div>
  </section>

  <script>
    const LIMIT = 15;
    const CELEBRATE_MS = 1100;
    const DAYS = [
      {
        rule: "きけんなびんはふういん。ふつうのものはつうか。",
        name: "あかいびん",
        declare: "りんごジュース 200g",
        art: "bottle",
        look: "ラベルのうらに、あかい「きけん」スタンプ。",
        shake: "とぷん。ふつうのえきのおと。",
        measure: "200g。しんこくとぴったり。",
        bad: true,
        what: "きけんなびんだった",
        tell: "みる：ラベルのうらにあかい「きけん」スタンプ"
      },
      {
        rule: "なかみがからのものはふういん。みためがよくても、ふるかはかれ。",
        name: "おちゃのかん",
        declare: "りょこうのおちゃ 180g",
        art: "tea",
        look: "ラベルはあたらしい。きずもなし。よさそう。",
        shake: "からから。なかみがほとんどない。",
        measure: "40g。しんこく180gよりずっとかるい。",
        bad: true,
        what: "からっぽのかんだった",
        tell: "ふる：からから。はかる：40g（しんこく180g）"
      },
      {
        rule: "おとかおもさが、はちみつらしくないびんはふういん。ほんものならつうか。",
        name: "はちみつのびん",
        declare: "はなのはちみつ 300g",
        art: "honey",
        look: "きんラベルに「ほんもの」シール。いろもきんいろ。",
        shake: "しゃばしゃば。はちみつならとろっとするはず。",
        measure: "190g。はちみつの300gよりあきらかにかるい。",
        bad: true,
        what: "にせのはちみつだった",
        tell: "ふる：みずみたいなおと。はかる：190g（しんこく300g）"
      },
      {
        rule: "ひびのあるはこはふういん。シールのきずだけで、おもさのちがいが10gみまんならつうか。",
        name: "せんべいのはこ",
        declare: "のりせんべい 250g",
        art: "box",
        look: "きずはシールのうえだけ。はこにひびはない。",
        shake: "ぱりぱり。せんべいのおと。",
        measure: "248g。しんこく250g。ちがいは2g。",
        bad: false,
        what: "ただのものだった",
        tell: "きずはシールのうえだけ。おもさのちがいは2gで、ひびはない"
      },
      {
        rule: "あかもじ「さいけんさ」は、きんシールよりつよくてふういん。おもさのちがいがちいさくても、あかもじできめる。",
        name: "きんのシールぶくろ",
        declare: "おみやげ 200g",
        art: "pouch",
        look: "きんシールのよこに、ちいさいあかもじ「さいけんさ」。",
        shake: "ふつうのおと。へんなかんじはしない。",
        measure: "205g。しんこく200g。ちがいは5gでちいさい。",
        bad: true,
        what: "さいけんさのものだった",
        tell: "みる：きんシールのよこにあかもじ「さいけんさ」。きょうはあかもじのほうがつよい"
      },
      {
        rule: "2ついじょうあてはまったらふういん。1ついかはつうか。",
        points: ["① くうどうのすじ", "② からからのおと", "③ しんこくより30gいじょうかるい"],
        name: "おみやげかん",
        declare: "おみやげかん 400g",
        art: "can",
        look: "① くうどうのすじ：なし。せんはもよう。",
        shake: "② からからのおと：あり。",
        measure: "③ 30gいじょうかるい：なし。18gかるいだけ。",
        bad: false,
        what: "ただのものだった",
        tell: "からからは1つだけ。せんはもよう。18gかるいは30gみまん"
      }
    ];

    const state = {
      phase: "title",
      day: 0,
      strikes: 0,
      used: { look: false, shake: false, measure: false },
      results: [],
      round: 0,
      timer: 0,
      left: LIMIT,
      lastStart: -1e9
    };

    const play = document.getElementById("play");
    const title = document.getElementById("title");
    const flash = document.getElementById("flash");
    const result = document.getElementById("result");
    const chips = document.getElementById("chips");
    const art = document.getElementById("art");
    const resultBtn = document.getElementById("result-btn");

    function makeRaccoon(mood) {
      const svg = document.getElementById("mascot").cloneNode(true);
      svg.removeAttribute("id");
      svg.setAttribute("class", "raccoon is-" + mood);
      return svg;
    }

    function setMood(mood) {
      document.querySelectorAll("svg.raccoon").forEach((svg) => {
        svg.setAttribute("class", "raccoon is-" + mood);
      });
    }

    function syncDataset() {
      document.body.dataset.phase = state.phase;
      document.body.dataset.day = String(state.day + 1);
      document.body.dataset.strikes = String(state.strikes);
    }

    function renderStrikes() {
      document.getElementById("miss-count").textContent = "ミス " + state.strikes + "/2";
      document.getElementById("pip0").classList.toggle("on", state.strikes >= 1);
      document.getElementById("pip1").classList.toggle("on", state.strikes >= 2);
    }

    function stopTimer() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = 0;
      }
    }

    function bumpRound() {
      state.round += 1;
      stopTimer();
    }

    function updateTimer() {
      const show = state.phase === "play";
      const timer = document.getElementById("timer");
      const wrap = document.getElementById("timer-bar-wrap");
      timer.hidden = !show;
      wrap.hidden = !show;
      if (!show) return;
      const sec = Math.max(0, Math.ceil(state.left - 1e-4));
      document.getElementById("timer-num").textContent = String(sec);
      const warn = sec <= 5;
      timer.classList.toggle("warn", warn);
      const bar = document.getElementById("timer-bar");
      bar.style.width = Math.max(0, Math.min(100, (state.left / LIMIT) * 100)) + "%";
      bar.classList.toggle("warn", warn);
    }

    function startTimer() {
      stopTimer();
      const id = state.round;
      const deadline = performance.now() + LIMIT * 1000;
      state.left = LIMIT;
      updateTimer();
      state.timer = setInterval(() => {
        if (id !== state.round || state.phase !== "play") return;
        state.left = Math.max(0, (deadline - performance.now()) / 1000);
        updateTimer();
        if (state.left <= 0) {
          stopTimer();
          onTimeout();
        }
      }, 80);
    }

    function itemArt(kind) {
      const shadow = '<ellipse cx="100" cy="140" rx="46" ry="6" fill="#e7d3b0"/>';
      if (kind === "bottle") {
        return `<svg viewBox="0 0 200 150" aria-hidden="true">${shadow}
          <path d="M86 22h28v14h8c10 10 16 24 16 48 0 30-16 42-38 42s-38-12-38-42c0-24 6-38 16-48h8z" fill="#f4fbff" stroke="#2a2118" stroke-width="3"/>
          <path d="M70 86h60c2 18-8 32-30 32s-32-14-30-32z" fill="#e23d36"/>
          <rect x="78" y="78" width="44" height="22" rx="3" fill="#c4372f"/>
          <text x="100" y="94" text-anchor="middle" font-size="13" fill="#fff">きけん</text>
          <rect x="90" y="12" width="20" height="12" rx="3" fill="#e1c27a" stroke="#2a2118" stroke-width="2.4"/>
        </svg>`;
      }
      if (kind === "tea") {
        return `<svg viewBox="0 0 200 150" aria-hidden="true">${shadow}
          <rect x="68" y="48" width="64" height="78" rx="8" fill="#2f6a45" stroke="#2a2118" stroke-width="3"/>
          <ellipse cx="100" cy="48" rx="32" ry="12" fill="#e1c27a" stroke="#2a2118" stroke-width="3"/>
          <rect x="76" y="70" width="48" height="32" rx="4" fill="#fff8ee" stroke="#2a2118" stroke-width="2"/>
          <text x="100" y="91" text-anchor="middle" font-size="14" fill="#2f6a45">おちゃ</text>
        </svg>`;
      }
      if (kind === "honey") {
        return `<svg viewBox="0 0 200 150" aria-hidden="true">${shadow}
          <path d="M78 40h44l8 18v58c0 10-12 16-30 16s-30-6-30-16V58z" fill="#f8e7b0" stroke="#2a2118" stroke-width="3"/>
          <path d="M80 78h40v28c0 8-8 12-20 12s-20-4-20-12z" fill="#e2a322"/>
          <rect x="82" y="62" width="36" height="22" rx="3" fill="#e1c27a" stroke="#6b4e16" stroke-width="2"/>
          <text x="100" y="77" text-anchor="middle" font-size="9" fill="#6b4e16">ほんもの</text>
          <rect x="90" y="28" width="20" height="14" rx="3" fill="#c4372f" stroke="#2a2118" stroke-width="2"/>
        </svg>`;
      }
      if (kind === "box") {
        return `<svg viewBox="0 0 200 150" aria-hidden="true">${shadow}
          <rect x="52" y="40" width="96" height="86" rx="6" fill="#c9854a" stroke="#2a2118" stroke-width="3"/>
          <rect x="68" y="58" width="64" height="40" rx="4" fill="#fff8ee" stroke="#2a2118" stroke-width="2"/>
          <text x="100" y="82" text-anchor="middle" font-size="12" fill="#a86520">せんべい</text>
          <path d="M74 64l48 28M78 92l40-30M92 60l18 36" stroke="#2a2118" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </svg>`;
      }
      if (kind === "pouch") {
        return `<svg viewBox="0 0 200 150" aria-hidden="true">${shadow}
          <path d="M70 36h60l14 16v62c0 16-18 22-44 22s-44-6-44-22V52z" fill="#f3d7a2" stroke="#2a2118" stroke-width="3"/>
          <path d="M70 52h60" stroke="#2a2118" stroke-width="3"/>
          <circle cx="92" cy="86" r="16" fill="#e1c27a" stroke="#6b4e16" stroke-width="3"/>
          <text x="124" y="80" font-size="8" fill="#c4372f">さいけんさ</text>
        </svg>`;
      }
      return `<svg viewBox="0 0 200 150" aria-hidden="true">${shadow}
        <rect x="70" y="40" width="60" height="86" rx="16" fill="#d85a4a" stroke="#2a2118" stroke-width="3"/>
        <ellipse cx="100" cy="40" rx="30" ry="11" fill="#e1c27a" stroke="#2a2118" stroke-width="3"/>
        <path d="M78 70c12 8 32 8 44 0M78 86c12 8 32 8 44 0M78 102c12 8 32 8 44 0" stroke="#f7e2b0" stroke-width="4" fill="none"/>
        <path d="M100 48v70" stroke="#f4c9c4" stroke-width="2" stroke-dasharray="3 4"/>
      </svg>`;
    }

    function renderRule(day) {
      const card = document.getElementById("rule");
      document.getElementById("rule-text").textContent = day.rule;
      const list = document.getElementById("rule-list");
      list.replaceChildren();
      if (day.points) {
        list.hidden = false;
        day.points.forEach((point) => {
          const li = document.createElement("li");
          li.textContent = point;
          list.appendChild(li);
        });
      } else {
        list.hidden = true;
      }
      card.classList.remove("pulse");
      void card.offsetWidth;
      card.classList.add("pulse");
    }

    function resetActions() {
      ["look", "shake", "measure"].forEach((kind) => {
        const button = document.getElementById("btn-" + kind);
        button.disabled = false;
        button.classList.remove("used");
      });
      document.getElementById("btn-pass").disabled = false;
      document.getElementById("btn-seal").disabled = false;
    }

    function lockActions() {
      ["look", "shake", "measure", "pass", "seal"].forEach((kind) => {
        document.getElementById("btn-" + kind).disabled = true;
      });
    }

    function showEmptyChip() {
      chips.replaceChildren();
      const empty = document.createElement("p");
      empty.className = "chip-empty";
      empty.id = "chip-empty";
      empty.textContent = "けんさすると、てがかりがここにのこる";
      chips.appendChild(empty);
    }

    function addChip(kind, label, text) {
      const empty = document.getElementById("chip-empty");
      if (empty) empty.remove();
      const chip = document.createElement("div");
      chip.className = "chip chip-" + kind;
      const b = document.createElement("b");
      b.textContent = label;
      const span = document.createElement("span");
      span.textContent = text;
      chip.append(b, span);
      chips.appendChild(chip);
    }

    function pulseArt(kind) {
      art.classList.remove("pulse-look", "pulse-shake", "pulse-measure", "arrive");
      void art.offsetWidth;
      art.classList.add("pulse-" + kind);
    }

    function startDay() {
      const day = DAYS[state.day];
      state.phase = "play";
      state.used = { look: false, shake: false, measure: false };
      document.getElementById("day-label").textContent = (state.day + 1) + "にちめ";
      renderRule(day);
      document.getElementById("item-name").textContent = day.name;
      document.getElementById("declare").textContent = "しんこく：" + day.declare;
      art.innerHTML = itemArt(day.art);
      art.classList.remove("pulse-look", "pulse-shake", "pulse-measure");
      art.classList.remove("arrive");
      void art.offsetWidth;
      art.classList.add("arrive");
      showEmptyChip();
      resetActions();
      renderStrikes();
      setMood("idle");
      syncDataset();
      startTimer();
    }

    function startGame() {
      const now = performance.now();
      if (now - state.lastStart < 450) return;
      state.lastStart = now;
      bumpRound();
      state.day = 0;
      state.strikes = 0;
      state.results = [];
      title.hidden = true;
      result.hidden = true;
      flash.hidden = true;
      play.hidden = false;
      renderStrikes();
      startDay();
    }

    function inspect(kind) {
      if (state.phase !== "play" || state.used[kind]) return;
      state.used[kind] = true;
      const button = document.getElementById("btn-" + kind);
      button.disabled = true;
      button.classList.add("used");
      const labels = { look: "みる", shake: "ふる", measure: "はかる" };
      addChip(kind, labels[kind], DAYS[state.day][kind]);
      setMood(kind);
      pulseArt(kind);
    }

    function failPhrase(day, kind) {
      if (kind === "time") return "じかんぎれ：" + (day.bad ? day.what : "ただのものだった");
      if (day.bad) return "つうかミス：" + day.what;
      return "ふういんミス：ただのものだった";
    }

    function headlineFor(kind, day) {
      if (kind === "time") return "じかんぎれ";
      if (day.bad) return "つうかミス";
      return "ふういんミス";
    }

    function renderMarks(show) {
      const row = document.getElementById("day-marks");
      row.replaceChildren();
      row.hidden = !show;
      if (!show) return;
      for (let i = 0; i < DAYS.length; i += 1) {
        const mark = document.createElement("span");
        const entry = state.results[i];
        mark.className = "mark" + (entry ? (entry.ok ? " ok" : " bad") : "");
        mark.textContent = entry ? (entry.ok ? "○" : "×") : "·";
        row.appendChild(mark);
      }
    }

    function showCard(opts) {
      state.phase = opts.phase;
      stopTimer();
      updateTimer();
      flash.hidden = true;
      result.hidden = false;
      const card = document.getElementById("result-card");
      card.className = "card " + opts.tone;
      const heading = document.getElementById("result-title");
      heading.textContent = opts.headline;
      heading.className = opts.tone;
      document.getElementById("result-char").replaceChildren(makeRaccoon(opts.mood));
      setMood(opts.mood);
      const why = document.getElementById("result-why");
      why.textContent = opts.why || "";
      why.hidden = !opts.why;
      const note = document.getElementById("result-note");
      note.textContent = opts.note || "";
      note.hidden = !opts.note;
      const tell = document.getElementById("result-tell");
      tell.textContent = opts.tell ? "みのがしたてがかり：" + opts.tell : "";
      tell.hidden = !opts.tell;
      document.getElementById("result-meta").textContent = opts.meta || "";
      resultBtn.textContent = opts.button;
      resultBtn.onclick = opts.onButton;
      renderMarks(!!opts.marks);
      syncDataset();
    }

    function nextDay() {
      if (state.phase !== "strike") return;
      result.hidden = true;
      state.day += 1;
      startDay();
    }

    function openClear() {
      if (state.phase === "clear") return;
      const misses = state.results.filter((entry) => entry && !entry.ok);
      const note = misses.map((entry) => entry.day + "にちめ：" + entry.why + "\n" + entry.tell).join("\n");
      showCard({
        phase: "clear",
        tone: "clear",
        mood: "yay",
        headline: "クリア",
        why: misses.length ? "6にちおわった。ミス " + state.strikes + "/2" : "ミスなしで、6にちクリア！",
        note: note,
        tell: "",
        meta: "",
        marks: true,
        button: "もういちど",
        onButton: startGame
      });
    }

    function registerMiss(kind) {
      const day = DAYS[state.day];
      state.strikes += 1;
      const why = failPhrase(day, kind);
      const isOut = state.strikes >= 2;
      state.results[state.day] = {
        ok: false,
        day: state.day + 1,
        why: why,
        tell: day.tell
      };
      renderStrikes();
      const last = state.day >= DAYS.length - 1;
      showCard({
        phase: isOut ? "out" : "strike",
        tone: isOut ? "out" : (kind === "time" ? "time" : "miss"),
        mood: "sad",
        headline: isOut ? "アウト" : headlineFor(kind, day),
        why: why,
        note: kind === "time" ? "えらぶまえに、じかんぎれ。" : "",
        tell: day.tell,
        meta: (state.day + 1) + "にちめ · ミス " + state.strikes + "/2",
        marks: false,
        button: isOut ? "もういちど" : (last ? "けっかへ" : "つぎへ"),
        onButton: isOut ? startGame : (last ? openClear : nextDay)
      });
    }

    function celebrate(approve, done) {
      state.phase = "celebrate";
      stopTimer();
      updateTimer();
      lockActions();
      const word = document.getElementById("flash-word");
      word.textContent = approve ? "つうか！" : "ふういん！";
      word.className = "word " + (approve ? "pass" : "seal");
      document.getElementById("flash-char").replaceChildren(makeRaccoon("yay"));
      setMood("yay");
      flash.hidden = false;
      syncDataset();
      setTimeout(() => {
        flash.hidden = true;
        done();
      }, CELEBRATE_MS);
    }

    function decide(approve) {
      if (state.phase !== "play") return;
      state.phase = "lock";
      bumpRound();
      updateTimer();
      const day = DAYS[state.day];
      const correct = approve ? !day.bad : day.bad;
      if (correct) {
        state.results[state.day] = { ok: true, day: state.day + 1 };
        celebrate(approve, () => {
          if (state.day >= DAYS.length - 1) openClear();
          else {
            state.day += 1;
            startDay();
          }
        });
      } else {
        registerMiss(approve ? "approve" : "seal");
      }
    }

    function onTimeout() {
      if (state.phase !== "play") return;
      state.phase = "lock";
      bumpRound();
      registerMiss("time");
    }

    document.getElementById("hud-char").replaceChildren(makeRaccoon("idle"));
    document.getElementById("btn-start").addEventListener("click", startGame);
    document.getElementById("btn-look").addEventListener("click", () => inspect("look"));
    document.getElementById("btn-shake").addEventListener("click", () => inspect("shake"));
    document.getElementById("btn-measure").addEventListener("click", () => inspect("measure"));
    document.getElementById("btn-pass").addEventListener("click", () => decide(true));
    document.getElementById("btn-seal").addEventListener("click", () => decide(false));

    document.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (event.key === "Enter") {
        if (!result.hidden) resultBtn.click();
        else if (!title.hidden) startGame();
        return;
      }
      if (state.phase !== "play") return;
      if (event.key === "1") inspect("look");
      else if (event.key === "2") inspect("shake");
      else if (event.key === "3") inspect("measure");
      else if (event.key === "a" || event.key === "A") decide(true);
      else if (event.key === "s" || event.key === "S") decide(false);
    });

    syncDataset();
  </script>
</body>
</html>
