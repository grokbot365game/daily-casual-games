<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a1844">
  <meta name="description" content="つめてジャック。コウモリのルナと、口のまんなかのひかりをタップしてランタンに12こつめる。おとし・まちがいもの・あふれは1回でおしまい。">
  <meta property="og:title" content="つめてジャック — Stuff Jack">
  <meta property="og:description" content="口のまんなかのひかりをタップ。12こつめたらまんてんランタン。おとし・まちがいもの・あふれは1回でおしまい。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://grokbot365game.github.io/daily-casual-games/games/2026-10-21-stuff-jack/">
  <title>つめてジャック</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a1844'/%3E%3Cellipse cx='8' cy='9.2' rx='5.2' ry='4.6' fill='%23ff7a1a'/%3E%3Cpath d='M6.2 8.2h1.2v1.5H6.2zM8.6 8.2h1.2v1.5H8.6zM6.4 10.6h3.2v.7c0 .8-.7 1.3-1.6 1.3s-1.6-.5-1.6-1.3z' fill='%23fff3c4'/%3E%3Cpath d='M8 3.2c.6 1.2-.2 2.2-.2 2.2h.8S8.6 4.2 8 3.2z' fill='%233d8a42'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #2c1430;
      --muted: #7a5a72;
      --paper: #fff8ef;
      --line: rgba(44, 20, 48, .14);
      --orange: #e25a12;
      --gold: #f0b429;
      --good: #b45309;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(90% 40% at 50% -10%, #6a3a78 0%, transparent 55%),
        linear-gradient(180deg, #1b1033 0%, #4a2468 42%, #3a2218 74%, #140e10 100%);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "WenQuanYi Micro Hei", "Droid Sans Fallback", "Meiryo", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      transition: background .45s ease;
    }
    body.is-night {
      background: #05040a;
      transition: none;
    }
    body.is-night .hud,
    body.is-night .bubble { visibility: hidden; }
    [hidden] { display: none !important; }
    button, a { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }
    .back, .mute {
      position: fixed;
      z-index: 70;
      top: max(10px, env(safe-area-inset-top));
      border: 0;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 248, 239, .94);
      box-shadow: inset 0 0 0 1px var(--line);
      font-weight: 800;
      text-decoration: none;
    }
    .back {
      left: max(12px, env(safe-area-inset-left));
      padding: 8px 14px;
      min-height: 44px;
      display: grid;
      place-items: center;
      font-size: .78rem;
      letter-spacing: .04em;
    }
    .mute {
      right: max(12px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .mute svg { width: 22px; height: 22px; display: block; }
    .mute .slash { display: none; }
    .mute.is-muted .slash { display: block; }
    .shell {
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding:
        calc(max(10px, env(safe-area-inset-top)) + 52px)
        max(12px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      min-height: 0;
    }
    body.is-night .hud { opacity: 0; }
    .hud {
      flex: none;
      border-radius: 16px;
      padding: 8px 12px 10px;
      background: rgba(255, 248, 239, .96);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 18px rgba(44, 20, 48, .08);
      transition: opacity .35s ease;
    }
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .hud-top b { font-size: 1.02rem; letter-spacing: .04em; }
    #hud-best {
      margin: 0;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 800;
    }
    .scoreline {
      margin: 2px 0 0;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .scoreline strong {
      font-size: 1.85rem;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .scoreline strong.pop { animation: numpop .28s ease; }
    .scoreline .unit { font-weight: 900; color: var(--muted); }
    .goal { margin-left: auto; font-size: .78rem; font-weight: 800; color: var(--orange); }
    @keyframes numpop {
      0% { transform: scale(1); }
      40% { transform: scale(1.28); color: #e25a12; }
      100% { transform: scale(1); }
    }
    .dots { margin-top: 6px; display: flex; gap: 4px; }
    .dots i {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: #ead8cc;
      display: block;
    }
    .dots i.on { background: linear-gradient(90deg, #ffb347, #ff7a1a); }
    .steps { margin-top: 6px; }
    .step-label {
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      color: var(--muted);
    }
    .pips { display: flex; gap: 5px; width: min(180px, 52%); }
    .pips i {
      flex: 1;
      height: 7px;
      border-radius: 999px;
      background: #ead8cc;
      display: block;
    }
    .pips i.on { background: var(--orange); }
    .pips i.soon { background: var(--gold); }
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 22px;
      overflow: hidden;
      background: transparent;
      touch-action: none;
    }
    .stage.shake-drop { animation: shDrop .48s ease; }
    .stage.shake-wrong { animation: shWrong .42s ease; }
    .stage.shake-over { animation: shOver .5s ease; }
    .stage.shake-win { animation: shWin .45s ease; }
    @keyframes shDrop {
      0%, 100% { transform: translateY(0); }
      35% { transform: translateY(8px); }
      60% { transform: translateY(-3px); }
    }
    @keyframes shWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
    }
    @keyframes shOver {
      0%, 100% { transform: rotate(0); }
      30% { transform: rotate(-1.4deg) translateY(-4px); }
      60% { transform: rotate(1.2deg); }
    }
    @keyframes shWin {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    canvas#game {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
    }
    .flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    .flash.go { animation: flash .22s ease; }
    .flash[data-kind="good"].go { background: rgba(255, 214, 120, .45); }
    .flash[data-kind="bad"].go { background: rgba(255, 70, 90, .28); }
    .flash[data-kind="over"].go { background: rgba(255, 140, 40, .4); }
    @keyframes flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .coach {
      position: absolute;
      z-index: 3;
      left: 6px;
      top: 6px;
      width: min(46%, 200px);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .mascot { width: 102px; }
    .mascot svg { width: 100%; height: auto; display: block; overflow: visible; }
    .mascot .face { display: none; }
    .mascot[data-mood="idle"] .face.idle,
    .mascot[data-mood="focus"] .face.focus,
    .mascot[data-mood="cheer"] .face.cheer,
    .mascot[data-mood="gasp"] .face.gasp,
    .mascot[data-mood="yay"] .face.yay { display: block; }
    .mascot[data-mood="idle"] { animation: bob 2.4s ease-in-out infinite; }
    .mascot.is-pop[data-mood="cheer"],
    .mascot.is-pop[data-mood="yay"] { animation: hop .5s ease; }
    .mascot.is-pop[data-mood="gasp"] { animation: shake .4s ease; }
    body.is-night .mascot { filter: drop-shadow(0 0 10px rgba(255, 170, 50, .85)); }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes hop {
      0% { transform: translateY(0); }
      40% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px) rotate(-3deg); }
      75% { transform: translateX(5px) rotate(3deg); }
    }
    .bubble {
      width: 100%;
      margin-top: -8px;
      border-radius: 16px;
      padding: 7px 10px 8px;
      background: rgba(255, 248, 239, .96);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 16px rgba(44, 20, 48, .1);
    }
    .who {
      margin: 0;
      color: var(--orange);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .say {
      margin: 1px 0 0;
      font-size: .95rem;
      font-weight: 900;
      line-height: 1.35;
    }
    .warn, .callout {
      position: absolute;
      z-index: 4;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 24px);
      margin: 0;
      font-weight: 900;
      text-align: center;
      pointer-events: none;
    }
    .warn {
      top: 18%;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff6d8;
      color: #8a4b12;
      font-size: 1.02rem;
      box-shadow: 0 8px 20px rgba(44, 20, 48, .18);
    }
    .callout {
      top: 16%;
      padding: 6px 16px;
      border-radius: 16px;
      background: rgba(255, 248, 239, .96);
      font-size: 2rem;
      letter-spacing: .08em;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .18);
    }
    .callout[data-kind="drop"] { color: #1d4e89; }
    .callout[data-kind="wrong"] { color: #6d28d9; }
    .callout[data-kind="over"] { color: #c2410c; }
    .callout[data-kind="win"] { color: #a16207; background: #fff6d8; }
    .callout[data-kind="go"] { color: white; background: var(--orange); font-size: 1.4rem; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(16px, env(safe-area-inset-top))
        16px
        max(16px, env(safe-area-inset-bottom));
      background: rgba(24, 10, 32, .55);
      touch-action: pan-y;
    }
    .overlay.is-locked .card a,
    .overlay.is-locked .card button { pointer-events: none; }
    .card {
      width: min(100%, 400px);
      margin: 8px auto;
      padding: 18px 18px 16px;
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 18px 48px rgba(24, 10, 32, .32);
      text-align: center;
    }
    .card h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: .04em;
      line-height: 1.2;
    }
    .card .en {
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
    }
    .rules {
      margin: 0 0 10px;
      padding: 12px 12px 12px 34px;
      border-radius: 14px;
      background: #fff1e4;
      text-align: left;
      font-weight: 900;
      font-size: 1.18rem;
      line-height: 1.45;
    }
    .rules li { margin: 2px 0; }
    .need {
      margin: 0 0 14px;
      font-size: .95rem;
      font-weight: 900;
      color: var(--orange);
    }
    .rules-best {
      margin: -6px 0 12px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }
    .go, .retry {
      appearance: none;
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 16px;
      background: var(--orange);
      color: white;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .go:active, .retry:not(:disabled):active { transform: scale(.985); }
    .retry:disabled { opacity: .45; }
    #rules-mascot, #res-mascot { display: flex; justify-content: center; }
    #rules-mascot .mascot { width: 88px; animation: none; }
    #res-mascot { min-height: 0; }
    #res-mascot .mascot { width: 76px; animation: none; }
    .mini {
      width: 92px;
      margin: 0 auto 4px;
      filter: drop-shadow(0 0 0 transparent);
    }
    .mini svg { width: 100%; height: auto; display: block; }
    .mini .face { display: none; }
    .mini[data-tier="ember"] .face.ember,
    .mini[data-tier="one"] .face.one,
    .mini[data-tier="warm"] .face.warm,
    .mini[data-tier="bright"] .face.bright,
    .mini[data-tier="full"] .face.full { display: block; }
    .mini[data-tier="ember"] { filter: drop-shadow(0 0 6px rgba(255, 140, 40, .55)); }
    .mini[data-tier="one"] { filter: drop-shadow(0 0 8px rgba(255, 160, 50, .7)); }
    .mini[data-tier="warm"] { filter: drop-shadow(0 0 10px rgba(255, 170, 50, .8)); }
    .mini[data-tier="bright"] { filter: drop-shadow(0 0 12px rgba(255, 190, 70, .9)); }
    .mini[data-tier="full"] { filter: drop-shadow(0 0 16px rgba(255, 200, 80, 1)); }
    .mini[data-tier="dark"] .body { fill: #6a3a28; }
    .res-title {
      margin: 0;
      font-size: 1.45rem;
      letter-spacing: .06em;
    }
    .card.is-win .res-title { color: #8a5a00; }
    .res-label {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .res-score {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .res-score span { font-size: 1.15rem; margin-left: 2px; }
    .res-score small {
      display: inline-block;
      margin-left: 4px;
      font-size: 1rem;
      color: var(--muted);
    }
    .res-reason, .res-next {
      margin: 0;
      font-weight: 900;
      line-height: 1.4;
    }
    .res-reason { margin-top: 8px; font-size: 1.05rem; }
    .res-next {
      margin-top: 2px;
      color: var(--muted);
      font-size: .92rem;
    }
    .card[data-kind="drop"] .res-reason { color: #1d4e89; }
    .card[data-kind="wrong"] .res-reason { color: #6d28d9; }
    .card[data-kind="over"] .res-reason { color: #c2410c; }
    .card[data-kind="win"] .res-reason { color: #2f7a38; }
    .res-best {
      margin: 8px 0 0;
      font-size: .95rem;
      font-weight: 900;
      color: #8a5a00;
    }
    .quote {
      margin: 10px 0;
      padding: 8px 10px;
      border-radius: 12px;
      background: #fff3e4;
      font-weight: 900;
      line-height: 1.4;
    }
    .btns { display: grid; gap: 8px; }
    .share {
      display: block;
      padding: 11px 12px;
      border-radius: 14px;
      background: #1c1917;
      color: white;
      font-weight: 800;
      text-decoration: none;
    }
    .fine { margin: 10px 0 0; font-size: .82rem; font-weight: 800; }
    .fine a { color: var(--muted); }
    @media (max-height: 700px) {
      .card { padding: 12px 14px; }
      .card h1 { font-size: 1.4rem; }
      .rules { font-size: 1.05rem; padding: 8px 10px 8px 30px; }
      .res-score { font-size: 2.1rem; }
      .coach .mascot, #rules-mascot .mascot { width: 72px; }
      .say { font-size: .86rem; }
      .callout { font-size: 1.6rem; top: 12%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mascot, .stage, .scoreline strong { animation: none !important; }
      .hud, body { transition: none; }
    }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">ギャラリー</a>
  <button type="button" class="mute" id="mute" aria-pressed="false" aria-label="音を消す">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.5a4 4 0 0 1 0 5"/>
      <path class="slash" fill="none" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round" d="M6 5l13 14"/>
    </svg>
  </button>
  <div class="shell">
    <header class="hud">
      <div class="hud-top">
        <b>つめてジャック</b>
        <p id="hud-best" hidden>ベスト</p>
      </div>
      <p class="scoreline"><strong id="count">0</strong><span class="unit">こ</span><span class="goal" id="goal">目標 12こ</span></p>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="hud-top steps">
        <span class="step-label">だんかい</span>
        <div class="pips" id="pips" aria-hidden="true"></div>
      </div>
    </header>
    <div class="stage" id="stage">
      <canvas id="game" width="360" height="520" aria-label="つめてジャック。口のまんなかのひかりをタップする"></canvas>
      <div class="flash" id="flash"></div>
      <div class="coach" id="coach">
        <div id="coach-mascot"></div>
        <div class="bubble">
          <p class="who">ルナ</p>
          <p class="say" id="say">口のまんなかでタップ！</p>
        </div>
      </div>
      <p class="warn" id="warn" hidden></p>
      <p class="callout" id="callout" hidden>はじめ</p>
    </div>
  </div>

  <div class="overlay" id="rules">
    <div class="card">
      <div id="rules-mascot"></div>
      <h1>つめてジャック</h1>
      <p class="en">Stuff Jack · Day 26</p>
      <ol class="rules">
        <li>口のまんなかでタップ</li>
        <li>ひからないものはタップしない</li>
        <li>ミスは1回でおしまい</li>
      </ol>
      <p class="need" id="rank-need">まんてんランタンは、ひかり12こ</p>
      <p class="rules-best" id="rules-best" hidden></p>
      <button type="button" class="go" id="btn-start">つめはじめる</button>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="card" id="res-card">
      <div id="res-mascot"></div>
      <div class="mini" id="mini" data-tier="dark" aria-hidden="true">
        <svg viewBox="0 0 80 78">
          <ellipse cx="40" cy="72" rx="22" ry="4" fill="rgba(0,0,0,.25)"/>
          <path d="M40 16c2 6-1 10-1 10h3s-1-5-2-10z" fill="#3d8a42"/>
          <ellipse class="body" cx="40" cy="46" rx="26" ry="22" fill="#ff7a1a"/>
          <ellipse cx="32" cy="38" rx="6" ry="4" fill="rgba(255,255,255,.28)"/>
          <g class="face ember" fill="#fff1c2">
            <circle cx="32" cy="44" r="3"/>
          </g>
          <g class="face one" fill="#fff3c4">
            <path d="M24 38h14l-7 12z"/>
          </g>
          <g class="face warm" fill="#fff6d4">
            <path d="M22 36h12l-6 10z"/>
            <path d="M46 36h12l-6 10z"/>
            <path d="M30 54h20v4c0 4-4 7-10 7s-10-3-10-7z"/>
          </g>
          <g class="face bright" fill="#fff8e0">
            <path d="M20 34h14l-7 12z"/>
            <path d="M46 34h14l-7 12z"/>
            <path d="M26 52h28v6c0 6-6 10-14 10s-14-4-14-10z"/>
          </g>
          <g class="face full" fill="#fffdf2">
            <path d="M29 30l2.2 5.2 5.6.4-4.3 3.6 1.4 5.4L29 41.6 23.1 44.6l1.4-5.4-4.3-3.6 5.6-.4z"/>
            <path d="M51 30l2.2 5.2 5.6.4-4.3 3.6 1.4 5.4L51 41.6 45.1 44.6l1.4-5.4-4.3-3.6 5.6-.4z"/>
            <path d="M24 52h32v7c0 7-7 12-16 12s-16-5-16-12z"/>
          </g>
        </svg>
      </div>
      <h2 class="res-title" id="res-title">くろカボチャ</h2>

          ctx.stroke();
        }
      } else {
        ctx.translate(it.x, y);
        ctx.scale(sc, sc);
        if (it.bad === "mud") {
          ctx.fillStyle = "#6a4326";
          ctx.beginPath();
          ctx.ellipse(0, 2, R - 1, R - 5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#4a2c16";
          ctx.beginPath();
          ctx.arc(-7, -1, 6, 0, Math.PI * 2);
          ctx.arc(8, 5, 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (it.bad === "bug") {
          ctx.strokeStyle = "#2a1830";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-4, -8);
          ctx.quadraticCurveTo(-12, -18, -7, -22);
          ctx.moveTo(4, -8);
          ctx.quadraticCurveTo(12, -18, 7, -22);
          ctx.stroke();
          ctx.fillStyle = "#5b3d78";
          ctx.beginPath();
          ctx.ellipse(0, 3, R - 5, R - 7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#d5c4ee";
          ctx.beginPath();
          ctx.ellipse(-8, -1, 5, 7, -0.5, 0, Math.PI * 2);
          ctx.ellipse(8, -1, 5, 7, 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(-4, 2, 2, 0, Math.PI * 2);
          ctx.arc(5, 2, 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          var drop = ctx.createLinearGradient(0, -R, 0, R);
          drop.addColorStop(0, "#b7e6ff");
          drop.addColorStop(0.4, "#3aa0e8");
          drop.addColorStop(1, "#1d6cb5");
          ctx.fillStyle = drop;
          ctx.beginPath();
          ctx.moveTo(0, -R + 2);
          ctx.bezierCurveTo(R, -2, R * 0.85, R, 0, R);
          ctx.bezierCurveTo(-R * 0.85, R, -R, -2, 0, -R + 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,255,.75)";
          ctx.beginPath();
          ctx.ellipse(-5, -2, 3.5, 6, -0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        drawBadge();
      }
      ctx.restore();
    }
    function drawParticles() {
      var k;
      for (k = 0; k < particles.length; k++) {
        var p = particles[k];
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function drawReveal() {
      ctx.fillStyle = "#05040a";
      ctx.fillRect(-2, -2, LW + 4, LH + 4);
      var tier = tierOf(count);
      var u = Math.min(1, revealT / 0.8);
      var ease = 1 - Math.pow(1 - u, 3);
      var tierPower = { dark: 0.14, ember: 0.3, one: 0.44, warm: 0.58, bright: 0.8, full: 1 }[tier];
      var power = tierPower * ease;
      var hx = CX;
      var hy = Math.min(LH * 0.46, pumpCy);
      var fit = 0.68 + 0.32 * tierPower;
      var rx = 122 * fit;
      var ry = 108 * fit;
      var bloom = ctx.createRadialGradient(hx, hy, 10, hx, hy, 70 + 170 * tierPower);
      bloom.addColorStop(0, "rgba(255, 200, 90, " + (0.2 + 0.62 * power) + ")");
      bloom.addColorStop(0.5, "rgba(255, 120, 30, " + (0.12 * power) + ")");
      bloom.addColorStop(1, "rgba(255, 80, 0, 0)");
      ctx.fillStyle = bloom;
      ctx.fillRect(0, 0, LW, LH);
      if (tier === "bright" || tier === "full") {
        ctx.strokeStyle = "rgba(255, 214, 140, " + (0.25 * power) + ")";
        ctx.lineWidth = 3;
        var ray;
        for (ray = 0; ray < 10; ray++) {
          var a = ray / 10 * Math.PI * 2 + clock * 0.15;
          ctx.beginPath();
          ctx.moveTo(hx + Math.cos(a) * 90, hy + Math.sin(a) * 78);
          ctx.lineTo(hx + Math.cos(a) * (150 + (tier === "full" ? 30 : 0)), hy + Math.sin(a) * (120 + (tier === "full" ? 20 : 0)));
          ctx.stroke();
        }
      }
      drawPumpkin(hx, hy, rx, ry, tier, power);
      if (tier === "full" || tier === "bright") {
        var ember;
        for (ember = 0; ember < 8; ember++) {
          var ea = clock * 0.8 + ember;
          var er = 130 + (ember % 3) * 12;
          ctx.globalAlpha = 0.35 + 0.35 * Math.sin(clock * 3 + ember);
          ctx.fillStyle = "#ffd27a";
          ctx.beginPath();
          ctx.arc(hx + Math.cos(ea) * er * 0.7, hy - 20 + Math.sin(ea * 1.4) * 36, 2.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }
    function drawPlay() {
      drawSky();
      var shell = count / GOAL;
      drawPumpkin(CX, pumpCy, pumpRx, pumpRy, null, shell * 0.55);
      ctx.fillStyle = "#1a0c10";
      ctx.beginPath();
      ctx.ellipse(CX, pumpCy - pumpRy + 18, 36, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      if (count > 0) {
        ctx.fillStyle = "rgba(255, 190, 80, " + (0.25 + shell * 0.6) + ")";
        ctx.beginPath();
        ctx.ellipse(CX, pumpCy - pumpRy + 18, 22, 7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      drawLid();
      if (phase !== "reveal" && phase !== "result") drawBoard();
      var k;
      for (k = 0; k < items.length; k++) drawItem(items[k]);
      drawParticles();
    }
    function draw() {
      if (cssW < 2 || cssH < 2) return;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var dpr = canvas.width / cssW;
      ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);
      if (phase === "reveal" || phase === "result") drawReveal();
      else drawPlay();
    }
    function publish() {
      var slot = slotGeom();
      canvas.dataset.phase = phase;
      canvas.dataset.count = String(count);
      canvas.dataset.goal = String(GOAL);
      canvas.dataset.reason = endReason;
      canvas.dataset.ready = phase === "play" ? readyState : "";
      canvas.dataset.step = String(stepIndex + 1);
      canvas.dataset.elapsed = elapsed.toFixed(2);
      canvas.dataset.tier = tierOf(count);
      canvas.dataset.rank = rankFor(count).name;
      canvas.dataset.warn = warnEl.hidden ? "" : warnEl.textContent;
      canvas.dataset.slot = slotW.toFixed(1);
      canvas.dataset.enter = slot.enter.toFixed(1);
      canvas.dataset.exit = slot.exit.toFixed(1);
    }

    function tap() {
      if (phase === "warn") {
        say("つぎにそなえて");
        pulseFlash("bad");
        return;
      }
      if (phase !== "play") return;
      var hit = nearestOverlap();
      if (!hit) {
        whiff();
        return;
      }
      var slot = slotGeom();
      var full = hit.x >= slot.enter && hit.x <= slot.exit;
      if (hit.kind === "bad") {
        fail("wrong", hit);
        return;
      }
      if (!full) {
        fail("over", hit);
        return;
      }
      stuff(hit);
    }

    function frame(ts) {
      var now = ts || performance.now();
      var raw = last ? (now - last) / 1000 : 0.016;
      last = now;
      ensureSize();
      if (!(raw > 0.45)) {
        var dt = Math.min(0.034, raw);
        clock += dt;
        if (phase === "play" || phase === "warn") elapsed += dt;
        if (calloutUntil && now > calloutUntil && (phase === "play" || phase === "warn" || phase === "title")) {
          callout.hidden = true;
          calloutUntil = 0;
        }
        step(dt);
      }
      draw();
      publish();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      if (e.isTrusted) audioGesture();
      tap();
    });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });

    btnStart.addEventListener("click", function () {
      audioGesture();
      rulesEl.hidden = true;
      coachMascot.appendChild(mascot);
      beginRun();
    });
    btnRetry.addEventListener("click", function () {
      if (btnRetry.disabled || performance.now() < lockUntil) return;
      audioGesture();
      resultEl.hidden = true;
      resultEl.classList.remove("is-locked");
      resCard.classList.remove("is-win");
      coachMascot.appendChild(mascot);
      beginRun();
    });
    muteBtn.addEventListener("click", function () {
      muted = !muted;
      applyMute();
      saveStore();
      if (!muted) audioGesture();
    });

    loadStore();
    applyMute();
    refreshBest();
    paintDots();
    markPips();
    ensureSize();
    publish();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
