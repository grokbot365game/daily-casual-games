<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9d4f2">
  <title>ねむねむほし貯金 — Sleepy Star Bank</title>
  <style>
    :root {
      --ink: #3a3452;
      --ink-soft: #6d6584;
      --paper: #fffdfb;
      --cream: #fff6ee;
      --lilac: #8d78c8;
      --lilac-deep: #6d5aa8;
      --peach: #e8927c;
      --peach-deep: #d0725c;
      --shadow: rgba(58, 52, 82, .16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100vh;
      height: 100svh;
      max-height: 100vh;
      max-height: 100svh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 12%, rgba(255,255,255,.72) 0 3%, transparent 3.5%),
        radial-gradient(circle at 86% 6%, rgba(255,255,255,.45) 0 2.4%, transparent 3%),
        linear-gradient(155deg, #d9d4f2 0%, #f8d5e4 48%, #f3e6d4 100%);
      font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .game-shell {
      width: min(100%, 480px);
      height: 100%;
      max-height: 840px;
      margin: auto;
      min-height: 0;
    }
    .game-card {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(10px, 2vh, 18px) clamp(12px, 3vw, 18px) 12px;
      border: 3px solid rgba(255,255,255,.72);
      border-radius: 28px;
      background: rgba(255, 253, 251, .84);
      box-shadow: 0 22px 50px var(--shadow);
      backdrop-filter: blur(10px);
      user-select: none;
      -webkit-user-select: none;
    }
    .back {
      flex: none;
      display: inline-flex;
      margin-bottom: 4px;
      color: var(--ink-soft);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-decoration: none;
    }
    .back:hover { color: var(--lilac-deep); }
    header { flex: none; text-align: center; margin-bottom: 8px; }
    .eyebrow {
      margin: 0 0 2px;
      color: var(--lilac-deep);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .18em;
    }
    h1 { margin: 0; font-size: clamp(1.35rem, 5.6vw, 2.05rem); line-height: 1.05; letter-spacing: .06em; }
    .subtitle { margin: 3px 0 0; color: var(--ink-soft); font-size: .78rem; font-weight: 800; letter-spacing: .12em; }
    .hud { flex: none; display: flex; gap: 8px; margin: 0 0 8px; }
    .pill {
      flex: 1;
      min-width: 0;
      padding: 6px 8px 7px;
      text-align: center;
      border-radius: 14px;
      background: var(--cream);
      box-shadow: inset 0 0 0 2px rgba(109, 90, 168, .14);
    }
    .pill span { display: block; color: var(--ink-soft); font-size: .64rem; font-weight: 800; letter-spacing: .08em; }
    .pill strong {
      display: block;
      margin-top: 1px;
      color: var(--lilac-deep);
      font-size: clamp(1.05rem, 4.4vw, 1.4rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .pill.urgent strong { color: var(--peach-deep); }
    .pill.full { box-shadow: inset 0 0 0 2px rgba(208, 114, 92, .55); background: #fff1ea; }
    .pill.full span, .pill.full strong { color: var(--peach-deep); }
    .meter {
      height: 7px;
      margin-top: 5px;
      border-radius: 99px;
      background: rgba(109, 90, 168, .16);
      overflow: hidden;
    }
    .meter i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8d78c8, #e7b15a);
    }
    .pill.full .meter i { background: linear-gradient(90deg, #e8927c, #d0725c); }
    .stage-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      border-radius: 22px;
      box-shadow: 0 0 0 4px rgba(232, 146, 124, .38), 0 10px 22px rgba(58, 52, 82, .12);
      touch-action: none;
      overscroll-behavior: none;
      background: #2a3568;
    }
    .stage-wrap[data-state="playing"] { cursor: grab; }
    .stage-wrap.dragging { cursor: grabbing; }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .bank-button {
      flex: none;
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 900;
      letter-spacing: .14em;
      color: #fff;
      background: var(--peach);
      box-shadow: 0 4px 0 var(--peach-deep);
      cursor: pointer;
      touch-action: manipulation;
    }
    .bank-button:hover:not(:disabled) { transform: translateY(-1px); }
    .bank-button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--peach-deep); }
    .bank-button:disabled {
      color: rgba(255,255,255,.86);
      background: #d4cbe4;
      box-shadow: 0 4px 0 #b9aec8;
      cursor: default;
    }
    .bank-button.full { animation: bank-pulse .9s ease-in-out infinite; }
    .bank-button.soon:not(.full) { box-shadow: 0 4px 0 var(--peach-deep), 0 0 0 3px rgba(232, 146, 124, .35); }
    @keyframes bank-pulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); filter: brightness(1.06); }
    }
    .tip {
      flex: none;
      margin: 8px 0 0;
      text-align: center;
      color: var(--ink-soft);
      font-size: .72rem;
      font-weight: 800;
      line-height: 1.45;
    }
    .tip kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 1px 6px;
      border-radius: 6px;
      background: #f3eaf8;
      box-shadow: inset 0 -2px 0 rgba(58, 52, 82, .12);
      font-size: .68rem;
    }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 10px;
      background: rgba(42, 36, 72, .28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .game-over-card {
      width: min(100%, 320px);
      max-height: 100%;
      overflow: auto;
      padding: 16px 16px 14px;
      text-align: center;
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 14px 32px rgba(58, 52, 82, .22);
      transform: translateY(8px) scale(.98);
      transition: transform .2s ease;
    }
    .overlay.show .game-over-card { transform: none; }
    .game-over-card[hidden] { display: none; }
    .card-kicker { margin: 0 0 2px; color: var(--lilac-deep); font-size: .68rem; font-weight: 800; letter-spacing: .16em; }
    .game-over-card h2 { margin: 0 0 4px; font-size: 1.35rem; letter-spacing: .04em; line-height: 1.2; }
    .game-over-card .en { margin: 0 0 8px; color: var(--ink-soft); font-size: .75rem; font-weight: 800; letter-spacing: .12em; }
    .game-over-card p { margin: 0 0 6px; color: var(--ink-soft); font-size: .88rem; font-weight: 800; line-height: 1.45; }
    .hint-demo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 2px 0 6px;
    }
    .demo-star, .demo-pillow {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      font-weight: 900;
    }
    .demo-star { background: #fff4c4; color: #e0a24a; font-size: 1.25rem; }
    .demo-pillow { background: #ffe4ea; color: var(--peach-deep); font-size: .72rem; letter-spacing: .04em; }
    .demo-arrow { color: var(--lilac); font-weight: 900; }
    .drag-hint {
      display: inline-block;
      margin: 0 0 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fff1ea;
      color: var(--peach-deep);
      font-size: .95rem;
      font-weight: 900;
      letter-spacing: .04em;
    }
    .record { color: var(--peach-deep) !important; }
    .start-button, .restart-button {
      width: 100%;
      margin-top: 6px;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-weight: 900;
      letter-spacing: .08em;
      color: #fff;
      background: var(--peach);
      box-shadow: 0 4px 0 var(--peach-deep);
      cursor: pointer;
      touch-action: manipulation;
    }
    .start-button:hover, .restart-button:hover { transform: translateY(-1px); }
    .start-button:active, .restart-button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--peach-deep); }
    button:focus-visible, .back:focus-visible { outline: 3px solid rgba(232, 146, 124, .55); outline-offset: 3px; }
    @media (max-height: 700px) {
      .subtitle { display: none; }
      header { margin-bottom: 4px; }
      h1 { font-size: 1.28rem; }
      .game-card { padding: 8px 10px 8px; border-radius: 22px; }
      .game-over-card { padding: 12px 12px 10px; }
      .game-over-card h2 { font-size: 1.18rem; }
    }
    @media (max-height: 620px) {
      .tip { display: none; }
      .eyebrow { display: none; }
    }
    @media (max-height: 520px) {
      header { display: none; }
      .hud { margin-bottom: 6px; }
      .pill { padding: 4px 6px 5px; }
      .meter { margin-top: 3px; }
      .bank-button { margin-top: 6px; padding: 10px 12px; }
      .card-kicker, .game-over-card .en { display: none; }
      .hint-demo { display: none; }
      .game-over-card { padding: 8px 10px; }
      .game-over-card h2 { margin-bottom: 2px; font-size: 1.05rem; }
      .game-over-card p { margin-bottom: 3px; font-size: .78rem; line-height: 1.35; }
      .drag-hint { margin-bottom: 3px; padding: 4px 10px; font-size: .82rem; }
      .start-button, .restart-button { margin-top: 2px; padding: 8px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="game-card">
      <a class="back" href="../../index.html">← ギャラリー</a>
      <header>
        <p class="eyebrow">ねむねむゲーム部</p>
        <h1>ねむねむほし貯金</h1>
        <p class="subtitle">Sleepy Star Bank</p>
      </header>
      <div class="hud" aria-live="polite">
        <div class="pill"><span>貯金</span><strong id="score">0</strong></div>
        <div class="pill" id="fill-pill">
          <span id="fill-label">まくら</span>
          <strong id="fill">0/5</strong>
          <div class="meter" aria-hidden="true"><i id="meter"></i></div>
        </div>
        <div class="pill" id="time-pill"><span>のこり</span><strong id="time">45.0</strong></div>
      </div>
      <div id="stage" class="stage-wrap" data-state="ready" tabindex="-1">
        <canvas id="game" width="480" height="640" aria-label="夜空の星を枕にドラッグして貯金する"></canvas>
        <div id="overlay" class="overlay show" aria-hidden="false">
          <div id="ready-card" class="game-over-card" role="dialog" aria-labelledby="ready-title">
            <p class="card-kicker">ねむねむゲーム部</p>
            <h2 id="ready-title">ねむねむほし貯金</h2>
            <p class="en">Sleepy Star Bank</p>
            <p>45秒で星をあつめ、おやすみで貯金</p>
            <div class="hint-demo" aria-hidden="true">
              <span class="demo-star">★</span>
              <span class="demo-arrow">→</span>
              <span class="demo-pillow">まくら</span>
            </div>
            <p class="drag-hint">星を枕にドラッグ</p>
            <p>5つまで。まとめるとボーナス、超えると失敗</p>
            <p id="ready-best" hidden></p>
            <button id="start" class="start-button" type="button">はじめる</button>
          </div>
          <div id="end-card" class="game-over-card" role="dialog" aria-labelledby="end-title" hidden>
            <h2 id="end-title">おやすみなさい</h2>
            <p id="end-detail"></p>
            <p>貯金 <strong id="final-score">0</strong></p>
            <p id="best-line"></p>
            <p id="record" class="record" hidden>ベスト更新！</p>
            <button id="restart" class="restart-button" type="button">もう一回</button>
          </div>
        </div>
      </div>
      <button id="bank" class="bank-button" type="button" disabled>おやすみ</button>
      <p class="tip">いっぱいのまま入れると失敗 / <kbd>Space</kbd> でスタート・リトライ</p>
    </section>
  </main>
  <script>
  (() => {
    'use strict';

    const CAP = 5;
    const ROUND = 45;
    const BEST_KEY = 'sleepy-star-bank-best';
    const FONT = 'ui-rounded, "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif';
    const STAR_COLORS = ['#fff4c8', '#ffe0f0', '#e7f6ff', '#ffe8d0'];

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    const scoreEl = document.getElementById('score');
    const fillEl = document.getElementById('fill');
    const fillLabel = document.getElementById('fill-label');
    const fillPill = document.getElementById('fill-pill');
    const meter = document.getElementById('meter');
    const timeEl = document.getElementById('time');
    const timePill = document.getElementById('time-pill');
    const overlay = document.getElementById('overlay');
    const readyCard = document.getElementById('ready-card');
    const endCard = document.getElementById('end-card');
    const readyBestEl = document.getElementById('ready-best');
    const endTitle = document.getElementById('end-title');
    const endDetail = document.getElementById('end-detail');
    const finalScoreEl = document.getElementById('final-score');
    const bestLine = document.getElementById('best-line');
    const recordEl = document.getElementById('record');
    const startBtn = document.getElementById('start');
    const restartBtn = document.getElementById('restart');
    const bankBtn = document.getElementById('bank');

    const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
    let reduce = motionQuery.matches;
    motionQuery.addEventListener?.('change', () => { reduce = motionQuery.matches; });

    let W = 480;
    let H = 640;
    let dpr = 1;
    let state = 'ready';
    let score = 0;
    let best = 0;
    let timeLeft = ROUND;
    let bobT = 0;
    let hintT = 0;
    let plop = 0;
    let shake = 0;
    let spawnIn = 0.6;
    let sheepAwake = false;
    let danger = false;
    let lastTime = 0;
    let held = null;
    const stars = [];
    const stored = [];
    const spills = [];
    const sparks = [];
    const floaters = [];
    const specks = [];
    const clouds = [];

    try {
      const saved = Number(localStorage.getItem(BEST_KEY) || 0);
      if (Number.isFinite(saved) && saved > 0) best = Math.floor(saved);
    } catch (_) {}

    function rng(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const decor = rng(20260929);
    for (let i = 0; i < 36; i++) {
      specks.push({ x: decor(), y: decor() * 0.72, r: 0.6 + decor() * 1.5, p: decor() * Math.PI * 2 });
    }
    for (let i = 0; i < 3; i++) {
      clouds.push({ x: decor(), y: 0.12 + decor() * 0.22, w: 0.16 + decor() * 0.1, p: decor() * Math.PI * 2 });
    }

    const preview = [
      { nx: 0.22, ny: 0.18, kind: 'star', color: '#fff4c8', phase: 0.4, r: 18, rot: 0.2 },
      { nx: 0.5, ny: 0.34, kind: 'zzz', color: '#efe4ff', phase: 1.7, r: 16, rot: 0 },
      { nx: 0.74, ny: 0.2, kind: 'star', color: '#ffe0f0', phase: 2.5, r: 20, rot: 0.8 },
      { nx: 0.36, ny: 0.48, kind: 'star', color: '#e7f6ff', phase: 3.4, r: 15, rot: 1.2 }
    ];

    function scene() {
      const pillowH = Math.max(72, Math.min(118, H * 0.2));
      const pillowW = Math.min(W * 0.52, 250);
      const bottom = Math.max(16, Math.min(28, H * 0.04));
      const sheepW = Math.min(78, W * 0.16);
      const gap = 10;
      const left = (W - (sheepW + gap + pillowW)) / 2;
      return {
        sheep: { x: left + sheepW * 0.5, y: H - bottom - pillowH * 0.46, s: sheepW / 78 },
        pillow: { x: left + sheepW + gap, y: H - bottom - pillowH, w: pillowW, h: pillowH }
      };
    }

    function fitCanvas() {
      const rect = stage.getBoundingClientRect();
      const cssW = Math.max(1, rect.width);
      const cssH = Math.max(1, rect.height);
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const bw = Math.max(1, Math.round(cssW * dpr));
      const bh = Math.max(1, Math.round(cssH * dpr));
      if (canvas.width !== bw || canvas.height !== bh) {
        canvas.width = bw;
        canvas.height = bh;
      }
      W = 480;
      H = Math.max(1, 480 * (cssH / cssW));
      ctx.setTransform((cssW * dpr) / W, 0, 0, (cssH * dpr) / H, 0, 0);
    }

    function updateHud() {
      const n = stored.length;
      scoreEl.textContent = String(score);
      fillEl.textContent = n + '/' + CAP;
      fillLabel.textContent = n >= CAP ? 'いっぱい' : 'まくら';
      meter.style.width = (n / CAP) * 100 + '%';
      fillPill.classList.toggle('full', n >= CAP && state === 'playing');
      fillPill.setAttribute('aria-label', n >= CAP ? 'まくら いっぱい 5/5' : 'まくら ' + n + '/5 のこり ' + (CAP - n));
      timeEl.textContent = Math.max(0, timeLeft).toFixed(1);
      timePill.classList.toggle('urgent', state === 'playing' && timeLeft <= 8);
      const canBank = state === 'playing' && n > 0;
      bankBtn.disabled = !canBank;
      bankBtn.classList.toggle('full', canBank && n >= CAP);
      bankBtn.classList.toggle('soon', canBank && n < CAP && timeLeft <= 8);
      bankBtn.textContent = n >= CAP && state === 'playing' ? 'おやすみ！' : 'おやすみ';
    }

    function showReady() {
      state = 'ready';
      stage.dataset.state = 'ready';
      stage.classList.remove('dragging');
      readyCard.hidden = false;
      endCard.hidden = true;
      if (best > 0) {
        readyBestEl.hidden = false;
        readyBestEl.textContent = 'ベスト ' + best;
      } else {
        readyBestEl.hidden = true;
      }
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
      updateHud();
      startBtn.focus({ preventScroll: true });
    }

    function finish(kind) {
      if (state !== 'playing') return;
      state = 'ended';
      stage.dataset.state = 'ended';
      stage.classList.remove('dragging');
      danger = false;
      if (held && held.star) held.star.held = false;
      held = null;
      const left = stored.length;
      const improved = score > best;
      if (improved) {
        best = score;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
      }
      finalScoreEl.textContent = String(score);
      bestLine.textContent = 'ベスト ' + best;
      recordEl.hidden = !improved;
      if (kind === 'greed') {
        sheepAwake = true;
        shake = reduce ? 0 : 1;
        endTitle.textContent = '枕がこぼれちゃった…';
        endDetail.textContent = 'ひつじが起きちゃった';
      } else {
        timeLeft = 0;
        endTitle.textContent = 'おやすみなさい';
        endDetail.textContent = left > 0 ? '枕に残った星は、こんど貯金してね' : '45秒のほし貯金、おわり';
      }
      updateHud();
      readyCard.hidden = true;
      endCard.hidden = false;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
      restartBtn.focus({ preventScroll: true });
    }

    function makeStar(x, y) {
      return {
        x, y, baseX: x,
        vx: (Math.random() - 0.5) * 10,
        vy: 14 + Math.random() * 10,
        r: 24 + Math.random() * 8,
        phase: Math.random() * Math.PI * 2,
        rot: Math.random() * Math.PI,
        kind: Math.random() < 0.22 ? 'zzz' : 'star',
        color: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
        held: false
      };
    }

    function spawnStar(y) {
      if (stars.length >= 5) return;
      const margin = 36;
      let x = margin + Math.random() * (W - margin * 2);
      for (let attempt = 0; attempt < 5; attempt++) {
        const crowded = stars.some((s) => Math.hypot(s.x - x, s.y - y) < 68);
        if (!crowded) break;
        x = margin + Math.random() * (W - margin * 2);
      }
      stars.push(makeStar(x, y));
    }

    function seedStars() {
      stars.length = 0;
      const p = scene().pillow;
      const anchor = makeStar(W * 0.5, Math.max(70, p.y * 0.38));
      anchor.anchored = true;
      anchor.vx = 0;
      anchor.vy = 0;
      anchor.r = 30;
      stars.push(anchor);
      const top = 36;
      const bottom = Math.max(top + 40, p.y * 0.55);
      for (let i = 0; i < 3; i++) spawnStar(top + (bottom - top) * ((i + 0.4) / 3));
    }

    function beginRound() {
      if (state === 'playing') return;
      score = 0;
      timeLeft = ROUND;
      hintT = 4;
      plop = 0;
      shake = 0;
      spawnIn = 0.85;
      sheepAwake = false;
      danger = false;
      held = null;
      stored.length = 0;
      spills.length = 0;
      sparks.length = 0;
      floaters.length = 0;
      seedStars();
      state = 'playing';
      stage.dataset.state = 'playing';
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
      readyCard.hidden = true;
      endCard.hidden = true;
      updateHud();
      stage.focus({ preventScroll: true });
    }

    function burst(x, y, color, n) {
      if (reduce) return;
      for (let i = 0; i < n; i++) {
        if (sparks.length > 40) return;
        const a = Math.random() * Math.PI * 2;
        const sp = 20 + Math.random() * 50;
        sparks.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 20,
          life: 0.35 + Math.random() * 0.25,
          max: 0.6,
          r: 1.4 + Math.random() * 2.2,
          color: color || '#fff6d4'
        });
      }
    }

    function storeStar(star) {
      const i = stars.indexOf(star);
      if (i >= 0) stars.splice(i, 1);
      stored.push({ kind: star.kind, color: star.color, phase: star.phase });
      plop = 1;
      burst(star.x, star.y, star.color, 8);
      updateHud();
    }

    function failGreed(star) {
      const slots = stored.map((_, i) => storedSlot(i));
      stored.forEach((item, i) => {
        spills.push({
          kind: item.kind,
          color: item.color,
          phase: item.phase,
          x: slots[i].x,
          y: slots[i].y,
          vx: (Math.random() - 0.5) * 180,
          vy: -90 - Math.random() * 70,
          life: 1.15,
          max: 1.15,
          r: 12
        });
      });
      stored.length = 0;
      const si = stars.indexOf(star);
      if (si >= 0) stars.splice(si, 1);
      spills.push({
        kind: star.kind,
        color: star.color,
        phase: star.phase,
        x: star.x,
        y: star.y,
        vx: (Math.random() - 0.5) * 120,
        vy: -50,
        life: 1.15,
        max: 1.15,
        r: star.r
      });
      sheepAwake = true;
      finish('greed');
    }

    function bank() {
      if (state !== 'playing' || stored.length === 0) return;
      const n = stored.length;
      const gained = n * 10 + (n === CAP ? 20 : 0);
      score += gained;
      const p = scene().pillow;
      floaters.push({
        text: '+' + gained,
        x: p.x + p.w / 2,
        y: p.y + 8,
        life: 1.05,
        max: 1.05,
        big: n === CAP
      });
      burst(p.x + p.w / 2, p.y + p.h * 0.4, n === CAP ? '#ffd27a' : '#fff6d4', n === CAP ? 16 : 8);
      stored.length = 0;
      plop = 1;
      updateHud();
    }

    function overPillow(x, y) {
      const p = scene().pillow;
      return x >= p.x - 36 && x <= p.x + p.w + 36 && y >= p.y - 56 && y <= p.y + p.h + 22;
    }

    function storedSlot(i) {
      const p = scene().pillow;
      const inner = p.w - 36;
      return {
        x: p.x + 18 + inner * ((i + 0.5) / CAP),
        y: p.y + p.h * 0.48
      };
    }

    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((e.clientX - rect.left) / Math.max(1, rect.width)) * W,
        y: ((e.clientY - rect.top) / Math.max(1, rect.height)) * H
      };
    }

    function starPath(x, y, r, rot) {
      ctx.beginPath();
      const spikes = 5;
      for (let i = 0; i < spikes * 2; i++) {
        const a = rot - Math.PI / 2 + (i * Math.PI) / spikes;
        const rad = i % 2 === 0 ? r : r * 0.46;
        const px = x + Math.cos(a) * rad;
        const py = y + Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function drawCollectible(x, y, star, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      const glow = ctx.createRadialGradient(x, y, star.r * 0.2, x, y, star.r * 2.2);
      glow.addColorStop(0, 'rgba(255, 246, 214, .85)');
      glow.addColorStop(1, 'rgba(255, 246, 214, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, star.r * 2.2, 0, Math.PI * 2);
      ctx.fill();
      if (star.kind === 'zzz') {
        const g = ctx.createRadialGradient(x - 3, y - 4, 2, x, y, star.r);
        g.addColorStop(0, '#fff');
        g.addColorStop(1, star.color || '#efe4ff');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, star.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(109, 90, 168, .35)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#6d5aa8';
        ctx.font = '800 ' + Math.round(star.r) + 'px ' + FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('z', x, y + 1);
      } else {
        starPath(x, y, star.r, star.rot || 0);
        const g = ctx.createLinearGradient(x, y - star.r, x, y + star.r);
        g.addColorStop(0, '#fffef8');
        g.addColorStop(1, star.color || '#fff4c8');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(120, 78, 40, .55)';
        ctx.lineWidth = 2;
        ctx.stroke();
        if (star.r >= 14) {
          ctx.strokeStyle = '#6a5478';
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          const ey = y - star.r * 0.02;
          [-0.22, 0.22].forEach((side) => {
            ctx.beginPath();
            ctx.moveTo(x + star.r * side - 3.2, ey);
            ctx.quadraticCurveTo(x + star.r * side, ey + 2.4, x + star.r * side + 3.2, ey);
            ctx.stroke();
          });
          ctx.fillStyle = 'rgba(232, 150, 170, .7)';
          ctx.beginPath();
          ctx.arc(x - star.r * 0.32, y + star.r * 0.16, 2.1, 0, Math.PI * 2);
          ctx.arc(x + star.r * 0.32, y + star.r * 0.16, 2.1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawSky(t) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#24325f');
      g.addColorStop(0.42, '#6a568f');
      g.addColorStop(0.72, '#e7b3c2');
      g.addColorStop(1, '#f6d3c0');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      const mx = W * 0.24;
      const my = Math.min(H * 0.16, 92);
      const glow = ctx.createRadialGradient(mx, my, 8, mx, my, 90);
      glow.addColorStop(0, 'rgba(255, 246, 214, .95)');
      glow.addColorStop(1, 'rgba(255, 246, 214, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(mx, my, 90, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff6d4';
      ctx.beginPath();
      ctx.arc(mx, my, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(214, 186, 140, .45)';
      ctx.beginPath();
      ctx.arc(mx - 8, my - 4, 5, 0, Math.PI * 2);
      ctx.arc(mx + 9, my + 6, 3.2, 0, Math.PI * 2);
      ctx.fill();

      specks.forEach((s) => {
        const tw = reduce ? 0.7 : 0.35 + Math.sin(t * 2 + s.p) * 0.35;
        ctx.globalAlpha = Math.max(0.15, tw);
        ctx.fillStyle = '#fffaf2';
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * Math.min(H * 0.62, scene().pillow.y - 20), s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      clouds.forEach((c) => {
        const cx = c.x * W + (reduce ? 0 : Math.sin(t * 0.15 + c.p) * 10);
        const cy = c.y * Math.min(220, H * 0.28);
        const cw = c.w * W;
        ctx.fillStyle = 'rgba(255,255,255,.28)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, cw * 0.55, 16, 0, 0, Math.PI * 2);
        ctx.ellipse(cx - cw * 0.28, cy + 4, cw * 0.32, 12, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + cw * 0.26, cy + 3, cw * 0.28, 11, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawHills() {
      const p = scene().pillow;
      const base = p.y + p.h * 0.35;
      ctx.fillStyle = '#7d6a96';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, base);
      ctx.quadraticCurveTo(W * 0.28, base - H * 0.08, W * 0.55, base + 6);
      ctx.quadraticCurveTo(W * 0.82, base + H * 0.05, W, base - 10);
      ctx.lineTo(W, H);
      ctx.fill();
      ctx.fillStyle = '#c7b7d4';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, base + 28);
      ctx.quadraticCurveTo(W * 0.4, base + 4, W, base + 36);
      ctx.lineTo(W, H);
      ctx.fill();
    }

    function drawSheep(t) {
      const s = scene().sheep;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.scale(s.s, s.s);
      ctx.fillStyle = 'rgba(58, 52, 82, .18)';
      ctx.beginPath();
      ctx.ellipse(0, 28, 28, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = sheepAwake ? '#fff1f4' : '#fffdfb';
      ctx.beginPath();
      ctx.arc(-16, 6, 14, 0, Math.PI * 2);
      ctx.arc(16, 8, 13, 0, Math.PI * 2);
      ctx.arc(0, 12, 16, 0, Math.PI * 2);
      ctx.arc(0, -2, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(90, 70, 110, .28)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#f7d0c0';
      ctx.beginPath();
      ctx.ellipse(-12, -18, 6, 9, -0.5, 0, Math.PI * 2);
      ctx.ellipse(12, -18, 6, 9, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe8dc';
      ctx.beginPath();
      ctx.arc(0, -8, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#5a4552';
      ctx.fillStyle = '#5a4552';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      if (sheepAwake) {
        [-5, 5].forEach((ex) => {
          ctx.beginPath();
          ctx.ellipse(ex, -8, 2.2, 2.6, 0, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.beginPath();
        ctx.ellipse(0, -2, 2.4, 2, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        [-5, 5].forEach((ex) => {
          ctx.beginPath();
          ctx.moveTo(ex - 3, -8);
          ctx.quadraticCurveTo(ex, -5, ex + 3, -8);
          ctx.stroke();
        });
        ctx.beginPath();
        ctx.moveTo(-2.5, -2);
        ctx.quadraticCurveTo(0, 1, 2.5, -2);
        ctx.stroke();
        ctx.fillStyle = '#8d78c8';
        ctx.font = '700 11px ' + FONT;
        ctx.textAlign = 'center';
        const drift = reduce ? 0 : Math.sin(t * 2) * 2;
        ctx.fillText('z', 22, -20 - drift);
      }
      ctx.fillStyle = 'rgba(232, 140, 160, .55)';
      ctx.beginPath();
      ctx.ellipse(-7, -4, 2.4, 1.5, 0, 0, Math.PI * 2);
      ctx.ellipse(7, -4, 2.4, 1.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPillow(t) {
      const p = scene().pillow;
      const squash = 1 + Math.sin(Math.min(plop, 1) * Math.PI) * 0.05;
      const wobble = !reduce && stored.length >= CAP && state === 'playing' ? Math.sin(t * 8) * 1.4 : 0;
      ctx.save();
      ctx.translate(p.x + p.w / 2 + wobble, p.y + p.h / 2);
      ctx.scale(squash, 2 - squash);
      ctx.translate(-(p.x + p.w / 2), -(p.y + p.h / 2));

      ctx.fillStyle = 'rgba(58, 52, 82, .16)';
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h - 6, p.w * 0.42, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      const body = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
      body.addColorStop(0, '#fffdfb');
      body.addColorStop(0.55, '#ffe4ea');
      body.addColorStop(1, '#f3c3d2');
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, Math.min(46, p.h * 0.46));
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(208, 140, 160, .45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 5]);
      ctx.beginPath();
      ctx.moveTo(p.x + 18, p.y + p.h * 0.5);
      ctx.quadraticCurveTo(p.x + p.w / 2, p.y + p.h * 0.62, p.x + p.w - 18, p.y + p.h * 0.5);
      ctx.stroke();
      ctx.setLineDash([]);

      const pocket = ctx.createLinearGradient(0, p.y + 16, 0, p.y + p.h * 0.62);
      pocket.addColorStop(0, danger ? 'rgba(224, 120, 110, .55)' : 'rgba(232, 170, 190, .55)');
      pocket.addColorStop(1, danger ? 'rgba(208, 90, 90, .28)' : 'rgba(255,255,255,.08)');
      ctx.fillStyle = pocket;
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h * 0.46, p.w * 0.36, p.h * 0.24, 0, 0, Math.PI * 2);
      ctx.fill();

      if (held && overPillow(held.star.x, held.star.y)) {
        ctx.strokeStyle = danger ? 'rgba(208, 84, 74, .9)' : 'rgba(255, 214, 120, .95)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.restore();

      stored.forEach((item, i) => {
        const slot = storedSlot(i);
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ctx.beginPath();
        ctx.arc(slot.x, slot.y, 13, 0, Math.PI * 2);
        ctx.fill();
        drawCollectible(slot.x, slot.y, { kind: item.kind, color: item.color, r: 12, rot: item.phase, phase: item.phase }, 1);
      });

      const n = stored.length;
      const label = n + '/' + CAP;
      ctx.font = '800 14px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText(label).width + 16;
      const bx = p.x + p.w / 2;
      const by = p.y - 16;
      ctx.fillStyle = n >= CAP ? 'rgba(255, 236, 228, .95)' : 'rgba(255, 250, 246, .9)';
      ctx.beginPath();
      ctx.roundRect(bx - tw / 2, by - 11, tw, 22, 11);
      ctx.fill();
      ctx.fillStyle = n >= CAP ? '#d0725c' : '#6d5aa8';
      ctx.fillText(label, bx, by + 1);

      const gap = 16;
      let px = bx - ((CAP - 1) * gap) / 2;
      const py = by - 24;
      for (let i = 0; i < CAP; i++) {
        ctx.beginPath();
        ctx.arc(px, py, 5.2, 0, Math.PI * 2);
        ctx.fillStyle = i < n ? '#ffd56a' : 'rgba(255,255,255,.72)';
        ctx.fill();
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = i < n ? '#e0a24a' : 'rgba(90, 70, 120, .28)';
        ctx.stroke();
        px += gap;
      }
    }

    function drawHint() {
      if (state !== 'playing' || hintT <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, hintT));
      ctx.font = '800 16px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const text = '星を枕にドラッグ';
      const tw = ctx.measureText(text).width + 28;
      ctx.fillStyle = 'rgba(255, 253, 251, .92)';
      ctx.beginPath();
      ctx.roundRect(W / 2 - tw / 2, 16, tw, 32, 16);
      ctx.fill();
      ctx.fillStyle = '#d0725c';
      ctx.fillText(text, W / 2, 33);
      ctx.restore();
    }

    function drawFx() {
      spills.forEach((s) => {
        drawCollectible(s.x, s.y, s, Math.max(0, s.life / s.max));
      });
      sparks.forEach((s) => {
        ctx.globalAlpha = Math.max(0, s.life / s.max);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      floaters.forEach((f) => {
        ctx.globalAlpha = Math.max(0, f.life / f.max);
        ctx.fillStyle = f.big ? '#fff1c4' : '#fff';
        ctx.strokeStyle = 'rgba(90, 60, 80, .35)';
        ctx.lineWidth = 4;
        ctx.font = '800 ' + (f.big ? 26 : 20) + 'px ' + FONT;
        ctx.textAlign = 'center';
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillText(f.text, f.x, f.y);
      });
      ctx.globalAlpha = 1;
    }

    function draw(t) {
      const mag = reduce ? 0 : shake * 5;
      ctx.save();
      if (mag) ctx.translate(Math.sin(t * 42) * mag, Math.cos(t * 36) * mag * 0.55);
      drawSky(t);
      drawHills();
      drawSheep(t);
      drawPillow(t);

      const pillow = scene().pillow;
      if (state === 'ready') {
        preview.forEach((s) => {
          const y = 36 + s.ny * Math.max(40, pillow.y - 80);
          const bob = reduce ? 0 : Math.sin(t * 1.3 + s.phase) * 6;
          drawCollectible(s.nx * W, y + bob, s, 1);
        });
      } else {
        stars.forEach((s) => {
          if (s.held) return;
          const fade = Math.min(1, Math.max(0, (pillow.y - 10 - s.y) / 48));
          drawCollectible(s.x, s.y, s, fade);
        });
        if (held) drawCollectible(held.star.x, held.star.y, held.star, 1);
      }
      if (state === 'playing' && !held && stars.length) {
        let guide = stars.find((s) => s.anchored) || stars[0];
        if (!guide.anchored) stars.forEach((s) => { if (s.y > guide.y) guide = s; });
        const pulse = reduce ? 0.55 : 0.35 + Math.sin(t * 5) * 0.2;
        ctx.save();
        ctx.globalAlpha = stored.length === 0 ? pulse + 0.25 : pulse * 0.35;
        ctx.strokeStyle = '#fff6d4';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(guide.x, guide.y, guide.r + 14, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      drawFx();
      drawHint();
      ctx.restore();
    }

    function update(dt) {
      bobT += dt;
      plop = Math.max(0, plop - dt * 2.4);
      shake = Math.max(0, shake - dt * 1.6);
      if (state === 'playing') hintT = Math.max(0, hintT - dt);

      if (!reduce) {
        sparks.forEach((s) => {
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.vy += 40 * dt;
          s.life -= dt;
        });
      } else {
        sparks.forEach((s) => { s.life -= dt; });
      }
      sparks.splice(0, sparks.length, ...sparks.filter((s) => s.life > 0));

      spills.forEach((s) => {
        s.vy += 320 * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.life -= dt;
      });
      for (let i = spills.length - 1; i >= 0; i--) if (spills[i].life <= 0) spills.splice(i, 1);

      floaters.forEach((f) => {
        f.y -= 28 * dt;
        f.life -= dt;
      });
      for (let i = floaters.length - 1; i >= 0; i--) if (floaters[i].life <= 0) floaters.splice(i, 1);

      if (state !== 'playing' || document.hidden) return;

      const pillow = scene().pillow;
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        if (s.held) continue;
        if (s.anchored) {
          const sky = scene().pillow;
          s.x = W * 0.5 + Math.sin(bobT * 0.9 + s.phase) * 10;
          s.y = Math.max(70, sky.y * 0.38) + Math.sin(bobT * 1.3) * 6;
          s.baseX = s.x;
          continue;
        }
        s.baseX += s.vx * dt;
        if (s.baseX < 28) { s.baseX = 28; s.vx = Math.abs(s.vx); }
        if (s.baseX > W - 28) { s.baseX = W - 28; s.vx = -Math.abs(s.vx); }
        s.y += s.vy * dt;
        s.x = s.baseX + Math.sin(bobT * 1.15 + s.phase) * 8;
        if (!reduce) s.rot += dt * 0.35;
        if (s.y > pillow.y - 6) stars.splice(i, 1);
      }

      spawnIn -= dt;
      if (spawnIn <= 0) {
        spawnStar(-24);
        spawnIn = 0.95 + Math.random() * 0.45;
      }

      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        finish('time');
        return;
      }
      updateHud();
    }

    function loop(now) {
      const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000) || 0);
      lastTime = now;
      const nextDpr = Math.min(window.devicePixelRatio || 1, 2);
      if (nextDpr !== dpr) fitCanvas();
      update(dt);
      draw(bobT);
      requestAnimationFrame(loop);
    }

    function grabStar(pos) {
      let bestHit = null;
      let bestD = 1e9;
      stars.forEach((s) => {
        const reach = s.r + 48;
        const d = Math.hypot(s.x - pos.x, s.y - pos.y);
        if (d <= reach && d < bestD) {
          bestD = d;
          bestHit = s;
        }
      });
      return bestHit;
    }

    function onPointerDown(e) {
      if (state !== 'playing') return;
      if (e.target.closest('button, a, .overlay')) return;
      if (held) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const pos = pointerPos(e);
      const star = grabStar(pos);
      if (!star) return;
      e.preventDefault();
      star.held = true;
      held = { id: e.pointerId, type: e.pointerType, star };
      placeHeld(pos);
      stage.classList.add('dragging');
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    }

    function placeHeld(pos) {
      if (!held) return;
      const lift = held.type === 'touch' ? 36 : 0;
      held.star.x = pos.x;
      held.star.y = pos.y - lift;
      held.star.baseX = held.star.x;
      danger = stored.length >= CAP && overPillow(held.star.x, held.star.y);
    }

    function onPointerMove(e) {
      if (!held || e.pointerId !== held.id) return;
      e.preventDefault();
      placeHeld(pointerPos(e));
    }

    function onPointerUp(e) {
      if (!held || e.pointerId !== held.id) return;
      const star = held.star;
      if (Number.isFinite(e.clientX) && Number.isFinite(e.clientY)) placeHeld(pointerPos(e));
      star.held = false;
      held = null;
      danger = false;
      stage.classList.remove('dragging');
      try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
      if (state !== 'playing') return;
      if (overPillow(star.x, star.y)) {
        if (stored.length >= CAP) failGreed(star);
        else storeStar(star);
        return;
      }
      star.anchored = false;
      star.vy = Math.max(16, star.vy);
    }

    stage.addEventListener('pointerdown', onPointerDown, { passive: false });
    stage.addEventListener('pointermove', onPointerMove, { passive: false });
    stage.addEventListener('pointerup', onPointerUp);
    stage.addEventListener('pointercancel', onPointerUp);
    stage.addEventListener('lostpointercapture', (e) => {
      if (!held || e.pointerId !== held.id) return;
      if (stage.hasPointerCapture(e.pointerId)) return;
      onPointerUp(e);
    });
    stage.addEventListener('contextmenu', (e) => e.preventDefault());

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      beginRound();
    });
    restartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      beginRound();
    });
    overlay.addEventListener('click', (e) => {
      if (state !== 'ready') return;
      if (e.target.closest('button')) return;
      beginRound();
    });
    bankBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      bank();
    });
    window.addEventListener('keydown', (e) => {
      if ((e.code !== 'Space' && e.key !== ' ') || e.repeat) return;
      if (e.target.closest && e.target.closest('a')) return;
      e.preventDefault();
      if (state === 'ready' || state === 'ended') beginRound();
    });
    window.addEventListener('resize', fitCanvas);
    if (window.ResizeObserver) new ResizeObserver(() => fitCanvas()).observe(stage);
    document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

    fitCanvas();
    showReady();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
