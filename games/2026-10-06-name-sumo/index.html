<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7f1d1d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23b45309'/%3E%3Ccircle cx='8' cy='6.2' r='3.1' fill='%23ffd7ba'/%3E%3Ccircle cx='6.9' cy='6' r='.7' fill='%231c1917'/%3E%3Ccircle cx='9.1' cy='6' r='.7' fill='%231c1917'/%3E%3Cpath d='M4.2 11.2h7.6c0 1.6-1.6 2.6-3.8 2.6s-3.8-1-3.8-2.6z' fill='%23facc15'/%3E%3C/svg%3E">
  <title>なまえずもう — Name Sumo</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --card: #fffdf8;
      --line: rgba(28, 25, 23, .12);
      --gold: #facc15;
      --clay: #9a3412;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      color: #fff;
      background:
        radial-gradient(80% 42% at 50% 0%, rgba(250, 204, 21, .28), transparent 46%),
        radial-gradient(60% 40% at 100% 80%, rgba(244, 63, 94, .35), transparent 50%),
        linear-gradient(180deg, #1e1b4b 0%, #7f1d1d 46%, #9a3412 100%);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    .back {
      position: fixed;
      z-index: 20;
      top: max(10px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 253, 248, .94);
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-decoration: none;
    }
    .shell {
      position: relative;
      z-index: 1;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding:
        calc(max(10px, env(safe-area-inset-top)) + 34px)
        14px
        max(10px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    header { flex: none; text-align: center; }
    .kicker {
      margin: 0;
      color: #fde68a;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-shadow: 0 2px 0 rgba(127, 29, 29, .45);
    }
    h1 {
      margin: 1px 0 0;
      font-size: clamp(1.7rem, 7.4vw, 2.4rem);
      line-height: 1.05;
      letter-spacing: .12em;
      text-shadow: 0 3px 0 #7f1d1d, 0 10px 22px rgba(28, 25, 23, .35);
    }
    .en {
      margin: 2px 0 0;
      color: rgba(255, 255, 255, .9);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
    }
    .hud {
      flex: none;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 8px;
      margin: 8px 0 6px;
    }
    .pill {
      padding: 7px 10px 8px;
      border-radius: 14px;
      background: rgba(255, 253, 248, .94);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--line);
      text-align: center;
    }
    .pill span {
      display: block;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .14em;
    }
    .pill strong {
      display: block;
      margin-top: 1px;
      font-size: clamp(1.15rem, 5vw, 1.55rem);
      line-height: 1.05;
    }
    .pill em {
      display: block;
      margin-top: 2px;
      color: var(--clay);
      font-style: normal;
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .04em;
    }
    .stage {
      flex: 1 1 auto;
      min-height: 168px;
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: #3f1d16;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35), 0 14px 30px rgba(28, 25, 23, .25);
    }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .hint {
      flex: none;
      min-height: 1.35em;
      margin: 6px 0 0;
      text-align: center;
      font-size: .95rem;
      font-weight: 900;
      letter-spacing: .04em;
      text-shadow: 0 2px 0 rgba(127, 29, 29, .45);
    }
    .hint.hot {
      color: #fee2e2;
      text-shadow: 0 2px 0 #9f1239, 0 0 16px rgba(244, 63, 94, .8);
    }
    #gate { flex: none; max-height: 52dvh; overflow: auto; touch-action: pan-y; }
    #gate[hidden] { display: none !important; }
    .card {
      width: min(100%, 480px);
      margin: 8px auto 0;
      padding: 12px 14px 12px;
      border-radius: 18px;
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 12px 30px rgba(28, 25, 23, .2), inset 0 0 0 1px rgba(255, 255, 255, .7);
      text-align: center;
    }
    .rule {
      margin: 0;
      font-size: .98rem;
      font-weight: 800;
      line-height: 1.45;
    }
    .rule + .rule { margin-top: 2px; }
    .keys, .sub, .best, .blurb {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
      line-height: 1.4;
    }
    label {
      display: block;
      margin: 10px 0 4px;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .14em;
      color: var(--muted);
    }
    input {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      padding: 8px 12px;
      background: #fff7ed;
      box-shadow: inset 0 0 0 2px rgba(154, 52, 18, .18);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }
    input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .stats {
      margin: 8px 0 0;
      font-weight: 900;
      font-size: 1.02rem;
    }
    .stats b { font-size: 1.15rem; }
    .stats span {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #ffedd5;
      color: var(--clay);
      font-size: .82rem;
    }
    .stars {
      margin: 4px 0 0;
      color: var(--clay);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .02em;
    }
    button {
      width: 100%;
      margin-top: 8px;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: #c2410c;
      color: #fff;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: .12em;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    button:disabled { cursor: default; opacity: .45; }
    button.sweet {
      background: #eab308;
      color: #422006;
      box-shadow: 0 0 0 3px #fef3c7, 0 8px 20px rgba(234, 179, 8, .45);
    }
    button.tell { background: #9f1239; letter-spacing: .16em; }
    button.open {
      background: #e11d48;
      box-shadow: 0 0 0 3px #fff, 0 0 22px rgba(244, 63, 94, .85);
      animation: throb .16s ease-in-out infinite alternate;
    }
    button.warn { background: #44403c; }
    button.ghost {
      min-height: 40px;
      margin-top: 6px;
      background: transparent;
      color: var(--muted);
      font-size: .86rem;
      letter-spacing: .08em;
      box-shadow: none;
    }
    @keyframes throb {
      from { transform: scale(1); }
      to { transform: scale(1.035); }
    }
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px max(14px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(30, 27, 75, .08), rgba(28, 25, 23, .68) 58%);
    }
    .sheet[hidden] { display: none !important; }
    .sheet .card { position: relative; margin: 0; width: min(100%, 420px); }
    .sheet h2 {
      margin: 0;
      font-size: clamp(2rem, 9vw, 2.8rem);
      letter-spacing: .14em;
    }
    .card.win { box-shadow: 0 16px 40px rgba(28, 25, 23, .28), inset 0 0 0 3px #f59e0b; }
    .card.win h2 { color: #b45309; }
    .card.lose { box-shadow: 0 16px 40px rgba(28, 25, 23, .28), inset 0 0 0 3px #e11d48; }
    .card.lose h2 { color: #e11d48; }
    .result-progress {
      margin: 4px 0 0;
      font-size: clamp(1.8rem, 8vw, 2.6rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: .06em;
    }
    .record {
      margin: 6px 0 0;
      color: #b45309;
      font-size: 1.02rem;
      font-weight: 900;
      letter-spacing: .12em;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    [hidden] { display: none !important; }
    @media (max-height: 760px) {
      h1 { font-size: 1.45rem; }
      .hud { margin: 6px 0 4px; }
      .pill { padding: 5px 8px; }
      .card { padding: 8px 10px; }
      .rule { font-size: .88rem; }
      button { min-height: 46px; margin-top: 6px; }
    }
    @media (max-height: 640px) {
      .kicker, .en, .blurb { display: none; }
      .shell { padding-top: calc(max(6px, env(safe-area-inset-top)) + 28px); }
      .stage { min-height: 132px; }
      .stars { font-size: .7rem; }
    }
    @media (max-height: 540px) {
      .stars, .keys { display: none; }
      h1 { font-size: 1.15rem; }
      .pill span { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      button.open { animation: none; }
    }
  </style>
</head>
<body>
  <a class="back" href="../../index.html">ギャラリーへ</a>
  <div class="shell">
    <header>
      <p class="kicker">DAY 11</p>
      <h1>なまえずもう</h1>
      <p class="en">NAME SUMO</p>
    </header>
    <div class="hud">
      <div class="pill">
        <span>連勝</span>
        <strong id="streak-num">0</strong>
        <em id="best-line">ベスト 0連勝</em>
      </div>
      <div class="pill">
        <span>あいて</span>
        <strong id="rival-name">クロジシ</strong>
        <em id="rival-rank">第1番 · けいこ</em>
      </div>
    </div>
    <div class="stage" id="stage"><canvas id="cv" width="300" height="220"></canvas></div>
    <p class="hint" id="hint">タップかスペースで押す</p>
    <div id="gate">
      <div class="card">
        <p class="rule">金の輪があたったときに押すと、強く押せる。</p>
        <p class="rule">相手が赤くためて、大きい「！」が出たら押してうけよう。</p>
        <p class="keys">画面をタップ / スペース</p>
        <label for="name">なまえ</label>
        <input id="name" maxlength="12" placeholder="ななし" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <p class="stats"><b id="stat-weight">70kg</b><span id="stat-trait">おしずもう</span></p>
        <p class="stars" id="stat-stars"></p>
        <p class="blurb" id="stat-blurb"></p>
        <p class="best" id="title-best">ベスト 0連勝</p>
        <button type="button" id="btn-start">はじめる</button>
      </div>
    </div>
    <button type="button" id="btn-push" hidden>押す</button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="card" id="result-card">
      <h2 id="result-title">勝ち！</h2>
      <p class="sub" id="result-sub">押し出した</p>
      <p class="result-progress" id="result-streak">0連勝</p>
      <p class="sub" id="result-who"></p>
      <p class="record" id="result-record" hidden>ベスト更新！</p>
      <p class="best" id="result-best">ベスト 0連勝</p>
      <button type="button" id="btn-retry">つぎの一番</button>
      <button type="button" id="btn-copy">結果をコピー</button>
      <button type="button" class="ghost" id="btn-rename">なまえをかえる</button>
    </div>
  </div>
  <p class="sr-only" id="live" aria-live="polite"></p>

  <script>
    (function () {
      "use strict";

      var STORE = "name-sumo-2026-10-06";
      var PLAY_URL = "https://grokbot365game.github.io/daily-casual-games/games/2026-10-06-name-sumo/";
      var RANKS = ["けいこ", "なみ", "つよめ", "じょうず", "せきとり", "こむすび", "おおぜき", "よこづな"];
      var COUNT_MS = 700;
      var LOCK_MS = 900;
      var OUTRO_MS = 700;

      var phase = "title";
      var streak = 0;
      var best = 0;
      var level = 0;
      var shareStreak = 0;
      var record = false;
      var won = false;
      var pos = 0;
      var vel = 0;
      var breath = 0.48;
      var cooldown = 0;
      var stagger = 0;
      var fightStart = 0;
      var countLeft = 0;
      var countN = 3;
      var lastCount = 0;
      var outroLeft = 0;
      var lockUntil = 0;
      var btnFlashUntil = 0;
      var falseStart = 0;
      var pushPose = 0;
      var hitPose = 0;
      var cpuHit = 0;
      var shake = 0;
      var lastNow = 0;
      var lastAct = -1;
      var sweetWas = false;
      var audioCtx = null;
      var reduce = false;
      var viewW = 300;
      var viewH = 220;
      var floaters = [];
      var particles = [];
      var cpu = { mode: "idle", timer: 3.3, gun: false };
      var params = null;
      var preview = null;
      var wrestler = null;
      var copyTimer = 0;

      var gate = document.getElementById("gate");
      var stage = document.getElementById("stage");
      var canvas = document.getElementById("cv");
      var ctx = canvas.getContext("2d");
      var hintEl = document.getElementById("hint");
      var nameInput = document.getElementById("name");
      var streakEl = document.getElementById("streak-num");
      var bestLine = document.getElementById("best-line");
      var titleBest = document.getElementById("title-best");
      var rivalRank = document.getElementById("rival-rank");
      var statWeight = document.getElementById("stat-weight");
      var statTrait = document.getElementById("stat-trait");
      var statStars = document.getElementById("stat-stars");
      var statBlurb = document.getElementById("stat-blurb");
      var pushBtn = document.getElementById("btn-push");
      var sheet = document.getElementById("sheet");
      var resultCard = document.getElementById("result-card");
      var resultTitle = document.getElementById("result-title");
      var resultSub = document.getElementById("result-sub");
      var resultStreak = document.getElementById("result-streak");
      var resultWho = document.getElementById("result-who");
      var resultRecord = document.getElementById("result-record");
      var resultBest = document.getElementById("result-best");
      var retryBtn = document.getElementById("btn-retry");
      var copyBtn = document.getElementById("btn-copy");
      var renameBtn = document.getElementById("btn-rename");
      var liveEl = document.getElementById("live");

      reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

      function hashString(s) {
        var h = 2166136261;
        var i;
        for (i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function cleanName(s) {
        return String(s || "").replace(/[\r\n\t]/g, " ").replace(/ +/g, " ").trim().slice(0, 12);
      }

      function starRow(v, lo, hi) {
        var t = (v - lo) / (hi - lo);
        t = clamp(t, 0, 1);
        var n = 1 + Math.round(t * 4);
        var s = "";
        var i;
        for (i = 1; i <= 5; i++) s += i <= n ? "★" : "☆";
        return s;
      }

      function buildWrestler(raw) {
        var label = cleanName(raw) || "ななし";
        var h = hashString(label);
        var weight = 70 + (h % 81);
        var trait = (h >>> 9) % 3;
        var heavy = (weight - 70) / 80;
        var outgoing = 1.04 - heavy * 0.2;
        var incoming = 0.8 + (1 - heavy) * 0.36;
        var cycleMul = 0.94 + heavy * 0.2;
        var counterMul = 1;
        var traitName;
        var traitBlurb;
        if (trait === 0) {
          outgoing *= 1.16;
          cycleMul *= 1.08;
          traitName = "おしずもう";
          traitBlurb = "押しが強い。呼吸はすこしおそい";
        } else if (trait === 1) {
          counterMul = 1.24;
          incoming *= 1.1;
          traitName = "うけずもう";
          traitBlurb = "うけが広い。そのぶん押されやすい";
        } else {
          cycleMul *= 0.84;
          outgoing *= 0.9;
          traitName = "そくずもう";
          traitBlurb = "呼吸が速い。一発はひかえめ";
        }
        var weightBlurb = weight >= 128
          ? "重い。押されにくいが、呼吸はおそい"
          : weight <= 90
            ? "軽い。呼吸ははやめだが、押されやすい"
            : "ふつうの体重";
        return {
          label: label,
          weight: weight,
          trait: trait,
          traitName: traitName,
          blurb: weightBlurb + "。" + traitBlurb,
          hue: (h >>> 16) % 360,
          charm: h % 4,
          size: 0.9 + heavy * 0.22,
          outgoing: outgoing,
          incoming: incoming,
          cycleMul: cycleMul,
          counterMul: counterMul,
          pushStars: starRow(outgoing, 0.74, 1.3),
          ukeStars: starRow((2.05 - incoming) * counterMul, 0.7, 1.65),
          speedStars: starRow(1 / cycleMul, 0.78, 1.32)
        };
      }

      function rankName(n) {
        return RANKS[Math.min(n, RANKS.length - 1)];
      }

      function bestText(n) {
        return "ベスト " + n + "連勝";
      }

      function loadStore() {
        try {
          var raw = localStorage.getItem(STORE);
          if (!raw) return;
          var data = JSON.parse(raw);
          if (data && typeof data.best === "number") best = Math.max(0, data.best | 0);
          if (data && typeof data.streak === "number") streak = Math.max(0, data.streak | 0);
          if (data && typeof data.name === "string") nameInput.value = cleanName(data.name);
        } catch (err) {}
      }

      function saveStore() {
        try {
          localStorage.setItem(STORE, JSON.stringify({
            best: best,
            streak: streak,
            name: cleanName(nameInput.value)
          }));
        } catch (err) {}
      }

      function makeParams(lv, w) {
        var tell = Math.max(0.24, 0.56 - lv * 0.03);
        var open = Math.max(0.2, 0.4 - lv * 0.016);
        if (w.trait === 1) open = Math.min(0.62, open * 1.28);
        return {
          cpuMass: 78 + lv * 7,
          pressure: 0.072 + lv * 0.036,
          cycle: Math.max(0.86, (1.36 - lv * 0.038) * w.cycleMul),
          sweetHalf: Math.max(0.066, (0.102 - lv * 0.0042) * (w.trait === 0 ? 0.96 : 1)),
          interval: Math.max(1.65, 4.15 - lv * 0.25),
          firstDelay: Math.max(1.3, 3.35 - lv * 0.36),
          tell: tell,
          open: open,
          charge: 206 + lv * 16,
          good: 64 * w.outgoing,
          counter: 104 * w.counterMul,
          incoming: w.incoming
        };
      }

      function isSweet() {
        if (!params) return false;
        var d = Math.min(breath, 1 - breath);
        return d < params.sweetHalf;
      }

      function setHint(text, hot) {
        if (hintEl.textContent !== text) hintEl.textContent = text;
        hintEl.className = hot ? "hint hot" : "hint";
      }

      function announce(text) {
        liveEl.textContent = "";
        window.setTimeout(function () { liveEl.textContent = text; }, 20);
      }

      function floater(text, color) {
        floaters.push({ text: text, age: 0, color: color || "#fff7ed" });
        if (floaters.length > 4) floaters.shift();
      }

      function puff(x, y, color, n) {
        var i;
        var count = reduce ? Math.min(n, 3) : n;
        for (i = 0; i < count; i++) {
          particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 90,
            vy: -20 - Math.random() * 70,
            age: 0,
            life: 0.35 + Math.random() * 0.25,
            color: color,
            s: 2 + Math.random() * 3
          });
        }
      }

      function tone(freq, dur, type, gain, delay) {
        try {
          if (!audioCtx || audioCtx.state !== "running") return;
          var t = audioCtx.currentTime + (delay || 0);
          var osc = audioCtx.createOscillator();
          var amp = audioCtx.createGain();
          osc.type = type || "sine";
          osc.frequency.value = freq;
          amp.gain.setValueAtTime(gain, t);
          amp.gain.exponentialRampToValueAtTime(0.001, t + dur);
          osc.connect(amp);
          amp.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + dur + 0.02);
        } catch (err) {}
      }

      function unlockAudio() {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === "suspended") {
            var pending = audioCtx.resume();
            if (pending && pending.catch) pending.catch(function () {});
          }
        } catch (err) {}
      }

      function buzz(ms) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (err) {}
      }

      function kick(power, self) {
        var M = wrestler.weight + params.cpuMass;
        var mul = power < 0 ? params.incoming : 1;
        vel += power * 0.98 / M * mul;
        if (self && vel < -0.18) vel = -0.18;
      }

      function refreshHud() {
        var showStreak = phase === "result" ? shareStreak : streak;
        var showLevel = phase === "title" ? streak : level;
        streakEl.textContent = String(showStreak);
        bestLine.textContent = bestText(best);
        titleBest.textContent = bestText(best);
        rivalRank.textContent = "第" + (showLevel + 1) + "番 · " + rankName(showLevel);
      }

      function refreshPreview() {
        preview = buildWrestler(nameInput.value);
        statWeight.textContent = preview.weight + "kg";
        statTrait.textContent = preview.traitName;
        statStars.textContent = "押し " + preview.pushStars + "  うけ " + preview.ukeStars + "  はやさ " + preview.speedStars;
        statBlurb.textContent = preview.blurb;
      }

      function showChrome() {
        gate.hidden = phase !== "title";
        sheet.hidden = phase !== "result";
        if (phase !== "fight" && phase !== "countdown") pushBtn.hidden = true;
      }

      function currentFighter() {
        return phase === "title" || !wrestler ? preview : wrestler;
      }

      function paintButton(now) {
        if (phase !== "countdown" && phase !== "fight") {
          pushBtn.hidden = true;
          return;
        }
        pushBtn.hidden = false;
        if (phase === "countdown") {
          if (now < btnFlashUntil) {
            pushBtn.textContent = "まだ！";
            pushBtn.className = "warn";
          } else {
            pushBtn.textContent = "押す";
            pushBtn.className = "";
          }
          return;
        }
        if (cpu.mode === "open") {
          pushBtn.textContent = "うけろ";
          pushBtn.className = "open";
        } else if (cpu.mode === "tell") {
          pushBtn.textContent = "まて";
          pushBtn.className = "tell";
        } else if (isSweet()) {
          pushBtn.textContent = "押す";
          pushBtn.className = "sweet";
        } else {
          pushBtn.textContent = "押す";
          pushBtn.className = "";
        }
      }

      function updateHint() {
        if (phase === "title") {
          setHint("タップかスペースで押す", false);
          return;
        }
        if (phase === "countdown") {
          setHint(countN + "  ·  まだ押さない", false);
          return;
        }
        if (phase === "outro") {
          setHint(won ? "押し出した！" : "土俵を割った", false);
          return;
        }
        if (phase === "result") return;
        if (cpu.mode === "open") setHint("大きい！ いま押してうけろ", true);
        else if (cpu.mode === "tell") setHint("赤くためてる。大きい！をまて", false);
        else if (isSweet()) setHint("いま押せ！", false);
        else setHint("金の輪をあわせて押せ", false);
      }

      function act(now) {
        if (now - lastAct < 80) return;
        lastAct = now;
        if (phase === "countdown") {
          falseStart = 0.45;
          btnFlashUntil = now + 420;
          floater("まだ！", "#fde68a");
          setHint("まだ！ はっけよいをまて", false);
          announce("まだ");
          tone(180, 0.06, "sine", 0.03);
          buzz(8);
          return;
        }
        if (phase !== "fight") return;
        if (cpu.mode === "tell") {
          cpu.gun = true;
          kick(-8, true);
          cooldown = 0.28;
          stagger = Math.max(stagger, 0.3);
          falseStart = 0.35;
          floater("まだ！", "#fecaca");
          tone(140, 0.07, "sine", 0.04);
          return;
        }
        if (cpu.mode === "open") {
          if (cpu.gun) {
            kick(-6, true);
            stagger = Math.max(stagger, 0.25);
            floater("はやい！", "#fecaca");
          } else {
            kick(params.counter, false);
            cpu.mode = "recover";
            cpu.timer = 0.55;
            cpu.gun = false;
            pushPose = 0.28;
            cpuHit = 0.45;
            floater("うけた！", "#fde68a");
            tone(520, 0.07, "square", 0.05);
            tone(780, 0.1, "square", 0.04, 0.06);
            buzz(12);
            puff(viewW * 0.62, viewH * 0.42, "#fde68a", 8);
          }
          cooldown = 0.3;
          return;
        }
        if (cooldown > 0) {
          kick(-12, true);
          cooldown = 0.32;
          stagger = 0.42;
          hitPose = 0.2;
          floater("はやい！", "#fecaca");
          tone(110, 0.06, "sine", 0.035);
          return;
        }
        if (isSweet()) {
          kick(params.good, false);
          cooldown = 0.3;
          pushPose = 0.22;
          floater("よし！", "#fde68a");
          tone(320, 0.06, "triangle", 0.04);
          puff(viewW * 0.5, viewH * 0.62, "#f6e2b8", 6);
        } else {
          cooldown = 0.28;
          floater("ぬけた", "#e7e5e4");
          tone(90, 0.05, "sine", 0.025);
        }
      }

      function startBout() {
        if (phase !== "title" && phase !== "result") return;
        if (phase === "result" && performance.now() < lockUntil) return;
        unlockAudio();
        wrestler = buildWrestler(nameInput.value);
        nameInput.value = wrestler.label === "ななし" && cleanName(nameInput.value) === "" ? "" : nameInput.value;
        level = streak;
        params = makeParams(level, wrestler);
        pos = 0;
        vel = 0;
        breath = 0.48;
        cooldown = 0;
        stagger = 0;
        cpu.mode = "idle";
        cpu.timer = params.firstDelay;
        cpu.gun = false;
        falseStart = 0;
        pushPose = 0;
        hitPose = 0;
        cpuHit = 0;
        shake = 0;
        floaters = [];
        particles = [];
        sweetWas = false;
        countN = 3;
        lastCount = 0;
        countLeft = COUNT_MS / 1000;
        phase = "countdown";
        saveStore();
        refreshHud();
        showChrome();
        announce("3");
        tone(440, 0.07, "square", 0.04);
      }

      function openResult(didWin) {
        if (phase === "result") return;
        won = didWin;
        if (didWin) {
          streak += 1;
          shareStreak = streak;
          record = streak > best;
          if (record) best = streak;
          resultCard.className = "card win";
          resultTitle.textContent = "勝ち！";
          resultSub.textContent = "押し出した";
          retryBtn.textContent = "つぎの一番";
          tone(523, 0.08, "square", 0.05);
          tone(659, 0.08, "square", 0.045, 0.08);
          tone(784, 0.14, "square", 0.04, 0.16);
        } else {
          shareStreak = streak;
          streak = 0;
          record = false;
          resultCard.className = "card lose";
          resultTitle.textContent = "まけ…";
          resultSub.textContent = "土俵を割った";
          retryBtn.textContent = "もういちど";
          tone(96, 0.22, "sawtooth", 0.04);
        }
        resultStreak.textContent = shareStreak + "連勝";
        resultWho.textContent = wrestler.label + " · " + wrestler.weight + "kg · " + wrestler.traitName;
        resultRecord.hidden = !record;
        resultBest.textContent = bestText(best);
        copyBtn.textContent = "結果をコピー";
        lockUntil = performance.now() + LOCK_MS;
        retryBtn.disabled = true;
        renameBtn.disabled = true;
        phase = "result";
        saveStore();
        refreshHud();
        showChrome();
        announce(didWin ? "勝ち。" + shareStreak + "連勝" : "まけ。" + shareStreak + "連勝");
        if (document.activeElement && document.activeElement !== nameInput && document.activeElement.blur) {
          document.activeElement.blur();
        }
      }

      function finishOutro() {
        openResult(pos >= 1);
      }

      function backToName() {
        if (phase !== "result" || performance.now() < lockUntil) return;
        streak = 0;
        phase = "title";
        saveStore();
        refreshPreview();
        refreshHud();
        showChrome();
        setHint("タップかスペースで押す", false);
      }

      function shareBody() {
        var who = wrestler ? wrestler.label : (preview ? preview.label : "ななし");
        return "なまえずもう " + who + " " + shareStreak + "連勝！ #ねむねむゲーム部\n" + PLAY_URL;
      }

      function markCopied(ok) {
        copyBtn.textContent = ok ? "コピーした" : "コピーできなかった";
        window.clearTimeout(copyTimer);
        copyTimer = window.setTimeout(function () {
          if (phase === "result") copyBtn.textContent = "結果をコピー";
        }, 1600);
      }

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "0";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { ta.setSelectionRange(0, text.length); } catch (err) {}
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      function copyResult() {
        var text = shareBody();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            markCopied(true);
          }, function () {
            markCopied(fallbackCopy(text));
          });
          return;
        }
        markCopied(fallbackCopy(text));
      }

      function stepCpu(dt, acc) {
        if (cpu.mode === "idle") {
          cpu.timer -= dt;
          vel -= acc * dt;
          if (cpu.timer <= 0) {
            cpu.mode = "tell";
            cpu.timer = params.tell;
            cpu.gun = false;
            tone(220, 0.08, "sawtooth", 0.03);
          }
        } else if (cpu.mode === "tell") {
          cpu.timer -= dt;
          vel -= acc * 0.35 * dt;
          if (cpu.timer <= 0) {
            cpu.mode = "open";
            cpu.timer = params.open;
            tone(660, 0.07, "square", 0.05);
            tone(880, 0.09, "square", 0.04, 0.06);
            buzz(15);
          }
        } else if (cpu.mode === "open") {
          cpu.timer -= dt;
          if (cpu.timer <= 0) {
            kick(-params.charge, false);
            cpu.mode = "idle";
            cpu.timer = params.interval;
            cpu.gun = false;
            hitPose = 0.4;
            shake = reduce ? 0 : 7;
            floater("おされた！", "#fecaca");
            tone(70, 0.16, "sawtooth", 0.05);
            buzz(30);
          }
        } else {
          cpu.timer -= dt;
          if (cpu.timer <= 0) {
            cpu.mode = "idle";
            cpu.timer = params.interval;
          }
        }
      }

      function stepFight(dt, now) {
        breath = (breath + dt / params.cycle) % 1;
        var sweet = isSweet();
        if (sweet && !sweetWas && cpu.mode !== "tell" && cpu.mode !== "open") {
          tone(520, 0.03, "sine", 0.012);
        }
        sweetWas = sweet;
        cooldown = Math.max(0, cooldown - dt);
        stagger = Math.max(0, stagger - dt);
        var acc = params.pressure * (stagger > 0 ? 1.65 : 1);
        var elapsed = (now - fightStart) / 1000;
        stepCpu(dt, acc);
        if (elapsed > 18) vel += (pos >= 0 ? 1 : -1) * 0.1 * (elapsed - 18) * dt;
        vel *= Math.exp(-2.25 * dt);
        pos += vel * dt;
        if (pos >= 1 || pos <= -1) {
          pos = clamp(pos, -1.2, 1.2);
          phase = "outro";
          outroLeft = OUTRO_MS / 1000;
          won = pos >= 1;
          shake = reduce ? 0 : 8;
          floater(won ? "勝ち！" : "まけ…", won ? "#fde68a" : "#fecaca");
          if (won) {
            var i;
            var colors = ["#facc15", "#fb7185", "#fff", "#38bdf8", "#f97316"];
            var n = reduce ? 8 : 28;
            for (i = 0; i < n; i++) {
              particles.push({
                x: viewW * 0.5,
                y: viewH * 0.4,
                vx: (Math.random() - 0.5) * 220,
                vy: -80 - Math.random() * 160,
                age: 0,
                life: 0.7 + Math.random() * 0.4,
                color: colors[i % colors.length],
                s: 3 + (i % 3)
              });
            }
          }
        }
      }

      function resize() {
        var rect = stage.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = Math.max(10, rect.width);
        var h = Math.max(10, rect.height);
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        viewW = w;
        viewH = h;
      }

      function hsl(h, s, l) {
        return "hsl(" + h + " " + s + "% " + l + "%)";
      }

      function drawDohyo(cx, cy, rx, ry) {
        var g = ctx.createLinearGradient(0, cy - ry, 0, cy + ry);
        g.addColorStop(0, "#f8e7c3");
        g.addColorStop(1, "#e7c48a");
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.lineWidth = Math.max(6, rx * 0.06);
        ctx.strokeStyle = "#c2410c";
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx * 0.72, ry * 0.62, 0, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(154, 52, 18, .28)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawTawara(cx, cy, rx, ry, front) {
        var i;
        for (i = 0; i < 18; i++) {
          var a = (i / 18) * Math.PI * 2 - Math.PI / 2;
          var s = Math.sin(a);
          if (front && s < 0.08) continue;
          if (!front && s >= 0.08) continue;
          var tx = cx + Math.cos(a) * rx;
          var ty = cy + Math.sin(a) * ry;
          var danger = (pos > 0.72 && Math.cos(a) > 0.35) || (pos < -0.72 && Math.cos(a) < -0.35);
          ctx.beginPath();
          ctx.ellipse(tx, ty, rx * 0.075, ry * 0.16, a, 0, Math.PI * 2);
          ctx.fillStyle = danger ? "#ef4444" : "#e7d3a4";
          ctx.fill();
          ctx.strokeStyle = danger ? "#7f1d1d" : "#a16207";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      function drawBang(x, y, size, big) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        ctx.arc(0, 0, size, 0, Math.PI * 2);
        ctx.fillStyle = big ? "#fff" : "#fecaca";
        ctx.fill();
        ctx.lineWidth = big ? 4 : 3;
        ctx.strokeStyle = "#9f1239";
        ctx.stroke();
        ctx.fillStyle = "#9f1239";
        ctx.font = "900 " + Math.round(size * 1.2) + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("！", 0, size * 0.08);
        ctx.restore();
      }

      function drawBreath(x, y, r) {
        var half = params ? params.sweetHalf : 0.1;
        var sweet = phase === "fight" && isSweet() && cpu.mode !== "tell" && cpu.mode !== "open";
        var dim = phase === "fight" && (cpu.mode === "tell" || cpu.mode === "open");
        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = dim ? 0.35 : 1;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,255,255,.55)";
        ctx.lineWidth = 7;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, r, -Math.PI / 2 - half * Math.PI * 2, -Math.PI / 2 + half * Math.PI * 2);
        ctx.strokeStyle = sweet ? "#fffbeb" : "#facc15";
        ctx.lineWidth = sweet ? 12 : 9;
        ctx.stroke();
        var ang = -Math.PI / 2 + breath * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(Math.cos(ang) * r, Math.sin(ang) * r, sweet ? 10 : 7, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#b45309";
        ctx.stroke();
        ctx.restore();
      }

      function drawSumo(x, footY, scale, dir, kind, pose, expr, hue, lv) {
        ctx.save();
        ctx.translate(x, footY);
        var lean = 0;
        var squash = 1;
        if (pose === "push") { lean = -0.16; squash = 0.96; }
        else if (pose === "hit") lean = 0.24;
        else if (pose === "windup") lean = 0.22;
        else if (pose === "open") lean = 0.36;
        else if (pose === "stamp") { lean = -0.22; squash = 0.9; }
        else if (pose === "win") lean = -0.08;
        else if (pose === "out") lean = 0.7;
        if (!reduce && pose === "idle") ctx.translate(0, Math.sin(lastNow / 280) * 1.5);
        ctx.scale(dir, 1);
        ctx.rotate(lean);
        ctx.scale(scale, scale * squash);
        ctx.translate(0, 4);

        ctx.beginPath();
        ctx.ellipse(0, 2, 34, 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(28,25,23,.18)";
        ctx.fill();

        var skin = kind === "cpu" ? "#f0c3a4" : "#ffd2b8";
        var skin2 = kind === "cpu" ? "#d9a184" : "#f3b89a";
        ctx.fillStyle = skin2;
        ctx.beginPath();
        ctx.ellipse(-14, -16, 12, 10, 0, 0, Math.PI * 2);
        ctx.ellipse(12, -18, 11, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.ellipse(0, -58, kind === "cpu" ? 40 : 36, kind === "cpu" ? 32 : 30, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.28)";
        ctx.beginPath();
        ctx.ellipse(-8, -70, 12, 8, -0.4, 0, Math.PI * 2);
        ctx.fill();

        var belt = kind === "cpu" ? "#172554" : hsl(hue, 72, 42);
        ctx.fillStyle = belt;
        ctx.beginPath();
        ctx.ellipse(0, -50, kind === "cpu" ? 41 : 37, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = kind === "cpu" ? "#facc15" : hsl(hue, 80, 62);
        ctx.fillRect(-28, -53, 56, 4);

        if (kind === "cpu") {
          ctx.fillStyle = "#1e3a8a";
          ctx.beginPath();
          ctx.moveTo(18, -46);
          ctx.lineTo(38, -46);
          ctx.lineTo(34, -16);
          ctx.lineTo(22, -16);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.arc(28, -32, 5, 0, Math.PI * 2);
          ctx.fillStyle = "#facc15";
          ctx.fill();
          if (lv >= 2) {
            ctx.fillStyle = "#facc15";
            ctx.fillRect(-36, -48, 8, 3);
          }
        } else {
          ctx.strokeStyle = hsl(hue, 70, 32);
          ctx.lineWidth = 2;
          var s;
          for (s = 0; s < 4; s++) {
            ctx.beginPath();
            ctx.moveTo(22 + s * 4, -44);
            ctx.lineTo(24 + s * 4, -30);
            ctx.stroke();
          }
          if (previewCharm(kind) === 3) {
            ctx.beginPath();
            ctx.arc(30, -28, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#facc15";
            ctx.fill();
          }
        }

        ctx.strokeStyle = skin2;
        ctx.lineWidth = 12;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(16, -72);
        ctx.quadraticCurveTo(40, -60, 48, -48);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(50, -46, 7, 0, Math.PI * 2);
        ctx.fillStyle = skin;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(2, -104, kind === "cpu" ? 26 : 28, 0, Math.PI * 2);
        ctx.fillStyle = skin;
        ctx.fill();

        ctx.fillStyle = kind === "cpu" ? "#111827" : "#3f2a28";
        ctx.beginPath();
        ctx.ellipse(0, -118, 20, 12, 0, Math.PI, 0);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-2, -132, 8, 0, Math.PI * 2);
        ctx.fill();
        if (kind === "player") {
          ctx.fillStyle = hsl(hue, 75, 52);
          ctx.beginPath();
          ctx.arc(-2, -132, 4, 0, Math.PI * 2);
          ctx.fill();
          if ((wrestler && phase !== "title" ? wrestler.charm : preview.charm) === 0) {
            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.arc(8, -126, 3.5, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.fillStyle = "#facc15";
          ctx.fillRect(-8, -136, 12, 3);
          if (lv >= 7) {
            ctx.strokeStyle = "#f8fafc";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, -108, 30, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
          }
        }

        drawFace(kind, expr, hue, lv);
        ctx.restore();
      }

      function previewCharm() {
        var w = currentFighter();
        return w ? w.charm : 0;
      }

      function drawFace(kind, expr, hue, lv) {
        var fierce = expr === "fierce";
        var hurt = expr === "hurt" || expr === "dizzy";
        var happy = expr === "happy";
        ctx.save();
        if (kind === "cpu") {
          ctx.strokeStyle = "#1f2937";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-14, -114);
          ctx.lineTo(-4, -110);
          ctx.moveTo(6, -112);
          ctx.lineTo(16, -116 - Math.min(lv, 6));
          ctx.stroke();
        } else {
          ctx.strokeStyle = "#7c4a3a";
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(-16, -116);
          ctx.quadraticCurveTo(-10, -120, -4, -116);
          ctx.moveTo(6, -116);
          ctx.quadraticCurveTo(12, -121, 18, -116);
          ctx.stroke();
        }

        function eye(ex, ey, rx, ry) {
          if (happy) {
            ctx.strokeStyle = "#1c1917";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(ex, ey, 5, Math.PI * 0.1, Math.PI * 0.9);
            ctx.stroke();
            return;
          }
          if (expr === "dizzy") {
            ctx.strokeStyle = "#1c1917";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ex - 4, ey - 4);
            ctx.lineTo(ex + 4, ey + 4);
            ctx.moveTo(ex + 4, ey - 4);
            ctx.lineTo(ex - 4, ey + 4);
            ctx.stroke();
            return;
          }
          ctx.beginPath();
          ctx.ellipse(ex, ey, rx, hurt ? ry * 0.7 : ry, 0, 0, Math.PI * 2);
          ctx.fillStyle = "#fff";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex + 1.5, ey + 0.5, fierce ? 2.4 : 3.3, 0, Math.PI * 2);
          ctx.fillStyle = "#1c1917";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex + 3, ey - 2, 1.3, 0, Math.PI * 2);
          ctx.fillStyle = "#fff";
          ctx.fill();
        }

        if (kind === "cpu") {
          eye(-9, -104, 6.5, fierce ? 3.4 : 5);
          eye(9, -104, 6.5, fierce ? 3.4 : 5);
        } else {
          eye(-8, -104, 7.5, 8.2);
          eye(10, -104, 7.5, 8.2);
        }

        ctx.fillStyle = kind === "cpu" ? "rgba(244,63,94,.28)" : "rgba(251,113,133,.45)";
        ctx.beginPath();
        ctx.ellipse(-16, -96, 5, 3, 0, 0, Math.PI * 2);
        ctx.ellipse(18, -96, 5, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        if (kind === "player" && previewCharm() === 1) {
          ctx.fillStyle = hsl(hue, 80, 50);
          ctx.beginPath();
          ctx.arc(18, -96, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = "#9a3412";
        ctx.fillStyle = "#9a3412";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        if (happy || (kind === "player" && expr === "calm")) {
          ctx.beginPath();
          ctx.arc(2, -92, happy ? 7 : 5, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
        } else if (hurt) {
          ctx.beginPath();
          ctx.ellipse(2, -90, 5, 4, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if (kind === "cpu") {
          ctx.beginPath();
          ctx.moveTo(-4, -90);
          ctx.quadraticCurveTo(2, -86, 10, -91);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(-3, -90);
          ctx.lineTo(8, -90);
          ctx.stroke();
        }
        if (expr === "hurt" && kind === "player") {
          ctx.fillStyle = "#7dd3fc";
          ctx.beginPath();
          ctx.ellipse(-16, -86, 2, 3, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function exprFor(pose, kind) {
        if (pose === "out") return "dizzy";
        if (pose === "win") return "happy";
        if (pose === "hit") return "hurt";
        if (pose === "open" || pose === "windup") return "fierce";
        if (pose === "push" || pose === "stamp") return kind === "cpu" ? "fierce" : "go";
        return kind === "cpu" ? "smug" : "calm";
      }

      function posePlayer() {
        if (phase === "outro" && pos < 0) return "out";
        if (phase === "outro" && pos >= 0) return "win";
        if (falseStart > 0) return "stamp";
        if (hitPose > 0.05 && pushPose <= 0) return "hit";
        if (pushPose > 0) return "push";
        return "idle";
      }

      function poseCpu(demo) {
        if (phase === "outro" && pos >= 0) return "out";
        if (phase === "outro" && pos < 0) return "win";
        if (phase === "title") return demo;
        if (cpu.mode === "tell") return "windup";
        if (cpu.mode === "open") return "open";
        if (cpu.mode === "recover" || cpuHit > 0) return "hit";
        return "idle";
      }

      function drawName(text, x, y, align) {
        ctx.save();
        ctx.font = "800 13px sans-serif";
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(28,25,23,.55)";
        ctx.fillStyle = "#fff";
        ctx.strokeText(text, x, y);
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function render(now) {
        if (!ctx) return;
        var w = currentFighter();
        if (!w) return;
        ctx.clearRect(0, 0, viewW, viewH);
        ctx.save();
        if (shake > 0.4 && !reduce) {
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }
        var bg = ctx.createLinearGradient(0, 0, 0, viewH);
        bg.addColorStop(0, "#312e81");
        bg.addColorStop(0.45, "#7f1d1d");
        bg.addColorStop(1, "#9a3412");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, viewW, viewH);

        ctx.fillStyle = "rgba(255,255,255,.08)";
        ctx.fillRect(0, 18, viewW, 10);
        var banner;
        for (banner = 0; banner < 8; banner++) {
          ctx.fillStyle = banner % 2 ? "#166534" : "#b91c1c";
          ctx.beginPath();
          ctx.moveTo(18 + banner * ((viewW - 20) / 8), 28);
          ctx.lineTo(36 + banner * ((viewW - 20) / 8), 28);
          ctx.lineTo(27 + banner * ((viewW - 20) / 8), 48);
          ctx.closePath();
          ctx.fill();
        }

        var ringR = Math.min(viewW * 0.36, (viewH - 28) * 0.4);
        var cx = viewW / 2;
        var cy = viewH * 0.6;
        var rx = ringR;
        var ry = ringR * 0.46;
        drawTawara(cx, cy, rx * 1.02, ry * 1.08, false);
        drawDohyo(cx, cy, rx, ry);

        var demo = "idle";
        if (phase === "title") {
          var loop = (now / 1000) % 6.5;
          if (loop > 3.3 && loop <= 3.95) demo = "windup";
          else if (loop > 3.95 && loop <= 4.45) demo = "open";
        }

        var showLevel = phase === "title" ? streak : level;
        var shift = pos * ringR * 0.82;
        var fly = 0;
        if (phase === "outro") fly = (1 - outroLeft / (OUTRO_MS / 1000)) * ringR * 0.55;
        var spread = ringR * 0.4;
        var pX = cx - spread + shift + (pos < 0 ? -fly : 0);
        var cX = cx + spread + shift + (pos >= 0 ? fly : 0);
        var footY = cy + ry * 0.08;
        var base = ringR / 108;
        var pScale = base * w.size;
        var cScale = base * (0.98 + Math.min(showLevel, 8) * 0.04);

        var pPose = posePlayer();
        var cPose = poseCpu(demo);
        drawSumo(cX, footY, cScale, -1, "cpu", cPose, exprFor(cPose, "cpu"), 220, showLevel);
        drawSumo(pX, footY, pScale, 1, "player", pPose, exprFor(pPose === "push" ? "push" : pPose, "player"), w.hue, 0);
        drawTawara(cx, cy, rx * 1.02, ry * 1.08, true);

        var ringY = footY - 78 * pScale;
        if (phase !== "outro") drawBreath(pX, ringY, Math.max(36, 54 * pScale));

        if (cPose === "windup") {
          ctx.save();
          ctx.globalAlpha = 0.35;
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.arc(cX, footY - 70 * cScale, 48 * cScale, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          drawBang(cX + 36 * cScale, footY - 150 * cScale, 16, false);
        }
        if (cPose === "open") {
          var pulse = 22 + Math.sin(now / 60) * 4;
          ctx.save();
          ctx.globalAlpha = 0.28;
          ctx.fillStyle = "#fb7185";
          ctx.beginPath();
          ctx.arc(cX, footY - 70 * cScale, 58 * cScale, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          drawBang(cX + 40 * cScale, footY - 158 * cScale, pulse, true);
        }

        drawName(w.label, pX, footY + 16, "center");
        drawName("クロジシ", cX, footY + 16, "center");

        if (phase === "countdown") {
          ctx.save();
          ctx.font = "900 " + Math.round(Math.min(viewW, viewH) * 0.28) + "px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineWidth = 10;
          ctx.strokeStyle = "#7f1d1d";
          ctx.fillStyle = "#fff";
          ctx.strokeText(String(countN), cx, cy - ry * 0.1);
          ctx.fillText(String(countN), cx, cy - ry * 0.1);
          ctx.restore();
        }

        var fi;
        for (fi = 0; fi < floaters.length; fi++) {
          var f = floaters[fi];
          ctx.save();
          ctx.globalAlpha = clamp(1 - f.age / 0.7, 0, 1);
          ctx.font = "900 22px sans-serif";
          ctx.textAlign = "center";
          ctx.lineWidth = 5;
          ctx.strokeStyle = "rgba(28,25,23,.55)";
          ctx.fillStyle = f.color;
          var fy = footY - 150 * pScale - f.age * 46;
          ctx.strokeText(f.text, pX, fy);
          ctx.fillText(f.text, pX, fy);
          ctx.restore();
        }

        var pi;
        for (pi = 0; pi < particles.length; pi++) {
          var p = particles[pi];
          ctx.globalAlpha = clamp(1 - p.age / p.life, 0, 1);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.s, p.s);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      function frame(now) {
        if (!lastNow) lastNow = now;
        var dt = Math.min(0.033, (now - lastNow) / 1000);
        lastNow = now;
        if (phase === "countdown") {
          breath = (breath + dt / (params ? params.cycle : 1.36)) % 1;
          countLeft -= dt;
          falseStart = Math.max(0, falseStart - dt);
          if (countN !== lastCount) {
            lastCount = countN;
            announce(String(countN));
          }
          if (countLeft <= 0) {
            if (countN > 1) {
              countN -= 1;
              countLeft = COUNT_MS / 1000;
              tone(440 + (3 - countN) * 80, 0.07, "square", 0.04);
            } else {
              phase = "fight";
              fightStart = now;
              floater("はっけよい", "#fff");
              tone(720, 0.09, "square", 0.05);
              announce("はっけよい");
            }
          }
        } else if (phase === "fight") {
          falseStart = Math.max(0, falseStart - dt);
          pushPose = Math.max(0, pushPose - dt);
          hitPose = Math.max(0, hitPose - dt);
          cpuHit = Math.max(0, cpuHit - dt);
          stepFight(dt, now);
        } else if (phase === "outro") {
          outroLeft -= dt;
          pushPose = Math.max(0, pushPose - dt);
          if (outroLeft <= 0) finishOutro();
        } else if (phase === "title") {
          breath = (breath + dt / (preview ? Math.max(0.86, 1.36 * preview.cycleMul) : 1.36)) % 1;
        } else if (phase === "result") {
          var locked = now < lockUntil;
          retryBtn.disabled = locked;
          renameBtn.disabled = locked;
        }
        shake *= Math.exp(-dt * 8);
        var i;
        for (i = particles.length - 1; i >= 0; i--) {
          particles[i].age += dt;
          particles[i].x += particles[i].vx * dt;
          particles[i].y += particles[i].vy * dt;
          particles[i].vy += 180 * dt;
          if (particles[i].age > particles[i].life) particles.splice(i, 1);
        }
        for (i = floaters.length - 1; i >= 0; i--) {
          floaters[i].age += dt;
          if (floaters[i].age > 0.75) floaters.splice(i, 1);
        }
        if (phase !== "result") updateHint();
        paintButton(now);
        render(now);
        window.requestAnimationFrame(frame);
      }

      loadStore();
      refreshPreview();
      refreshHud();
      showChrome();
      resize();
      if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
      window.addEventListener("resize", resize);

      nameInput.addEventListener("input", function () {
        refreshPreview();
        saveStore();
      });
      nameInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          startBout();
        }
      });
      document.getElementById("btn-start").addEventListener("click", startBout);
      retryBtn.addEventListener("click", startBout);
      renameBtn.addEventListener("click", backToName);
      copyBtn.addEventListener("click", copyResult);

      function pressFrom(e) {
        if (phase !== "countdown" && phase !== "fight") return;
        e.preventDefault();
        act(performance.now());
      }
      pushBtn.addEventListener("pointerdown", pressFrom);
      stage.addEventListener("pointerdown", pressFrom);
      stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      window.addEventListener("keydown", function (e) {
        if (e.code !== "Space" && e.key !== " ") return;
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (phase === "title") return;
        e.preventDefault();
        if (e.repeat) return;
        if (phase === "result" || phase === "outro") return;
        act(performance.now());
      });

      document.addEventListener("touchmove", function (e) {
        var el = e.target;
        if (el && el.closest && (el.closest("#gate") || el.closest("input"))) return;
        e.preventDefault();
      }, { passive: false });

      if (/debug=1/.test(location.search)) {
        window.__nameSumo = {
          snapshot: function () {
            return {
              phase: phase,
              pos: pos,
              vel: vel,
              mode: cpu.mode,
              breath: breath,
              sweet: isSweet(),
              streak: streak,
              best: best,
              level: level,
              hint: hintEl.textContent,
              button: pushBtn.hidden ? "" : pushBtn.textContent,
              weight: currentFighter().weight,
              trait: currentFighter().traitName,
              lock: performance.now() < lockUntil,
              share: shareStreak,
              result: resultTitle.textContent,
              retry: retryBtn.textContent,
              retryDisabled: retryBtn.disabled
            };
          },
          press: function () { act(performance.now()); },
          shareText: shareBody
        };
      }

      window.requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
