<!doctype html>
<html lang="ja">
<head>

  <title>ウソつきおてつだい — Lying Chores</title>

  <style>
    :root {
      --ink: #3a2618;
      --muted: #7a5b40;
      --cream: #fff8ec;
      --line: rgba(58, 38, 24, .14);
      --green: #16a34a;
      --green-dark: #166534;
      --red: #e11d48;
      --red-dark: #9f1239;
      --amber: #f59e0b;
      --amber-dark: #b45309;
      --teal: #0f766e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(80% 40% at 50% 0%, #ffe7b8 0%, transparent 60%),
        linear-gradient(180deg, #ffd18a 0%, #f3b56a 45%, #e0974e 100%);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "WenQuanYi Micro Hei", "Droid Sans Fallback", "Meiryo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    [hidden] { display: none !important; }
    button, a { -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #ffe08a; outline-offset: 2px; }
    .back {
      position: fixed;
      z-index: 50;
      top: max(10px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 248, 236, .94);
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-decoration: none;
    }
    .shell {
      position: relative;
      z-index: 1;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding:
        calc(max(10px, env(safe-area-inset-top)) + 42px)
        max(12px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      min-height: 0;
    }
    .hud {
      flex: none;
      padding: 8px 12px 10px;
      border-radius: 18px;
      background: rgba(255, 248, 236, .96);
      box-shadow: inset 0 0 0 1px var(--line), 0 8px 20px rgba(90, 50, 20, .12);
    }
    .hud-top { display: flex; align-items: center; gap: 8px; }
    .titles { flex: 1; min-width: 0; line-height: 1.1; }
    .titles b { display: block; font-size: 1.02rem; letter-spacing: .03em; }
    .titles span {
      color: var(--muted);
      font-size: .95rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .hearts { display: flex; gap: 4px; flex: none; }
    .hearts svg { width: 26px; height: 26px; display: block; }
    .hearts .break { animation: popheart .35s ease; }
    @keyframes popheart {
      0% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    .time-row { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
    .time-row strong {
      flex: none;
      min-width: 2.6em;
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;

    .time-row.warn strong { color: var(--red); }
    .bar {
      flex: 1;
      height: 14px;
      border-radius: 999px;
      background: #efe4d4;
      box-shadow: inset 0 0 0 1px rgba(58, 38, 24, .08);
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(1);
      border-radius: inherit;
      background: linear-gradient(90deg, #16a34a, #f5c518 70%, #ef4444);
    }
    .time-row.warn .bar > div { animation: heatpulse .28s ease-in-out infinite alternate; }
    @keyframes heatpulse { to { filter: brightness(1.25); } }
    .pips { margin-top: 6px; display: flex; gap: 5px; }
    .pips i {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: #ead9c2;
      display: block;
    }
    .pips i.now { background: var(--teal); }
    .pips i.ok { background: var(--green); }

    .stage {

      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border-radius: 22px;
      overflow: hidden;
      background:
        radial-gradient(50% 30% at 90% 0%, #fff 0%, transparent 70%),
        linear-gradient(180deg, #fff6ea 0%, #ffe6c4 38%, #f0c48a 38.2%, #e7b36a 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 248, 236, .55), 0 14px 30px rgba(70, 40, 16, .16);
    }
    .toprow {
      flex: none;
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 6px;
      align-items: center;
      min-height: 96px;
      position: relative;
      z-index: 2;
    }
    .parrot-slot { width: 84px; align-self: end; }
    .bubble {
      margin: 0;
      padding: 8px 12px 10px;
      border-radius: 8px 18px 18px 18px;
      background:
        linear-gradient(#e11d48, #e11d48) 0 0 / 8px 100% no-repeat,
        repeating-linear-gradient(#fffdf8, #fffdf8 27px, #f3e2c4 28px);

    }
    .bubble.pop { animation: cardpop .28s cubic-bezier(.2, 1.4, .3, 1); }
    @keyframes cardpop {

    }
    .bubble.urgent {
      box-shadow: 0 0 0 3px #ef4444, 0 8px 0 rgba(92, 59, 34, .12);
      animation: urgent .32s ease-in-out infinite alternate;
    }
    @keyframes urgent { to { transform: rotate(-.6deg); } }
    .bubble small {
      display: block;
      margin: 0 0 2px 6px;
      color: var(--red);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .16em;
    }
    .line {

      line-height: 1.25;

    }
    .floor {

      min-height: 0;

      box-shadow: inset 0 0 0 3px #a86b32, inset 0 10px 0 rgba(255, 255, 255, .12);
      overflow: hidden;
    }
    .cloth {
      position: absolute;
      left: 16%;
      top: 40%;
      width: 78%;
      height: 56%;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 58%, rgba(15, 118, 110, .05), transparent 60%),

      box-shadow: inset 0 0 0 3px #f0d2a4;
    }
    .legend {

      left: 18%;
      top: 41.5%;

      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 250, 243, .92);
      color: var(--teal);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .06em;
      pointer-events: none;
    }
    .marker, .prop, .piece, #splash {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .marker { z-index: 1; width: 54px; height: 54px; pointer-events: none; }
    .marker svg, .prop svg, .piece svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .marker.gone { opacity: 0; }
    #g-napkin { z-index: 5; }
    .prop { pointer-events: none; text-align: center; }
    #wan { width: 52px; height: 52px; }
    #chair { width: 62px; height: 70px; }
    .prop .tag, .piece .tag {
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translate(-50%, 1px);
      padding: 0 4px;
      border-radius: 6px;
      background: rgba(255, 248, 236, .94);
      color: #5c3b22;
      font-size: .72rem;
      font-weight: 900;
      white-space: nowrap;
      line-height: 1.3;
    }
    .piece {
      width: 54px;
      height: 54px;
      padding: 0;
      border: 0;
      background: transparent;
      z-index: 3;
      touch-action: manipulation;
      transition: left .34s cubic-bezier(.2, .8, .2, 1), top .34s cubic-bezier(.2, .8, .2, 1);
    }
    .piece .body {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 3px 0 rgba(58, 38, 24, .18));
    }
    .piece.is-placed { z-index: 4; }
    .piece.is-placed .tag { display: none; }
    .piece.is-mess { z-index: 6; }
    .piece.is-mess .body { transform: rotate(-16deg) scale(1.06); }
    .piece.hot .body { animation: hotpulse .55s ease-in-out infinite; }
    .piece.snapping .body { animation: snap .36s cubic-bezier(.2, 1.5, .3, 1); }
    @keyframes hotpulse {
      50% { transform: scale(1.1); filter: drop-shadow(0 0 0 #16a34a) drop-shadow(0 3px 0 rgba(58, 38, 24, .18)); }
    }
    @keyframes snap {
      0% { transform: scale(.55); }
      100% { transform: scale(1); }
    }
    #splash {
      width: 74px;
      height: 74px;
      z-index: 5;
      pointer-events: none;
    }
    .kid-slot {
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 78px;
      z-index: 5;
      pointer-events: none;
    }
    .callout {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 42%;
      z-index: 8;
      text-align: center;
      pointer-events: none;
    }
    .callout.beat b {
      display: inline-block;
      padding: .08em .42em .12em;
      border-radius: 16px;
      background: var(--green);
      color: #fff;
      font-size: clamp(2.3rem, 11vw, 3.4rem);
      letter-spacing: .08em;
      line-height: 1.15;
      transform: rotate(-7deg);
      box-shadow: 0 6px 0 var(--green-dark);
      animation: stampin .26s cubic-bezier(.2, 1.5, .3, 1) both;
    }
    .callout.scold {
      top: 36%;
      padding: 10px 12px 12px;
      border-radius: 18px;
      background: rgba(255, 250, 242, .97);
      box-shadow: 0 12px 28px rgba(58, 38, 24, .2);
    }
    .callout.scold .ico { width: 64px; height: 64px; margin: 0 auto 2px; }
    .callout.scold .ico svg { width: 100%; height: 100%; display: block; }
    .callout.scold b {
      display: block;
      font-size: clamp(1.35rem, 6vw, 1.85rem);
      line-height: 1.2;
      letter-spacing: .02em;
    }
    .callout.scold span {
      display: block;
      margin-top: 4px;
      font-size: clamp(1.02rem, 4.4vw, 1.2rem);
      font-weight: 800;
      line-height: 1.35;
    }
    .callout.scold-lie { box-shadow: inset 0 0 0 4px #c026d3, 0 12px 28px rgba(58, 38, 24, .2); }
    .callout.scold-lie b { color: #a21caf; }
    .callout.scold-truth { box-shadow: inset 0 0 0 4px #ea580c, 0 12px 28px rgba(58, 38, 24, .2); }
    .callout.scold-truth b { color: #c2410c; }
    .callout.scold-time { box-shadow: inset 0 0 0 4px #2563eb, 0 12px 28px rgba(58, 38, 24, .2); }
    .callout.scold-time b { color: #1d4ed8; }
    @keyframes stampin {
      0% { transform: scale(1.6) rotate(-16deg); opacity: 0; }
      100% { transform: scale(1) rotate(-7deg); opacity: 1; }
    }
    .controls {
      flex: none;
      display: grid;
      gap: 8px;
      padding: 0 2px 2px;
    }
    .do, .lie {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 66px;
      padding: 8px 14px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }
    .do {
      border: 0;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      box-shadow: 0 6px 0 var(--green-dark);
      font-size: clamp(1.15rem, 5vw, 1.45rem);
      letter-spacing: .03em;
    }
    .do-ico {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 2px rgba(22, 101, 52, .15);
    }
    .do-ico svg { width: 30px; height: 30px; }
    .lie {
      border-radius: 8px;
      border: 3px dashed #fff;
      background: var(--red);
      color: #fff;
      box-shadow: 0 0 0 3px var(--red), 0 6px 0 var(--red-dark);
      font-size: clamp(1.3rem, 5.8vw, 1.7rem);
      letter-spacing: .08em;
      transform: rotate(-1deg);
    }
    .lie-ico {
      flex: none;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
    }
    .lie-ico svg { width: 32px; height: 32px; display: block; }
    .do:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--green-dark); }
    .lie:active { transform: rotate(-1deg) translateY(2px); box-shadow: 0 0 0 3px var(--red), 0 4px 0 var(--red-dark); }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding:
        calc(max(10px, env(safe-area-inset-top)) + 46px)
        14px
        max(12px, env(safe-area-inset-bottom));
      overflow: auto;
      background:
        radial-gradient(80% 40% at 100% 0%, rgba(255, 214, 140, .45), transparent 50%),
        linear-gradient(180deg, rgba(255, 176, 90, .94), rgba(196, 104, 48, .94));
    }
    #result { z-index: 24; background: rgba(58, 32, 16, .55); }
    #result.is-locked .actions a,
    #result.is-locked .actions button { pointer-events: none; }
    .panel {
      width: min(100%, 420px);
      margin: auto;
      padding: 14px 16px 16px;
      border-radius: 22px;
      background: var(--cream);
      box-shadow: 0 18px 48px rgba(48, 28, 16, .35);
      text-align: center;
    }
    .cast { display: flex; justify-content: center; align-items: end; gap: 8px; }
    .cast .actor { width: 112px; }
    .panel h1 {
      margin: 4px 0 0;
      font-size: clamp(1.7rem, 8vw, 2.3rem);
      letter-spacing: .04em;
      line-height: 1.15;
    }
    .en { margin: 2px 0 0; color: var(--muted); font-weight: 800; }
    .dayline { margin: 2px 0 0; color: #c2410c; font-size: .86rem; font-weight: 900; letter-spacing: .06em; }
    .rules { margin: 10px 0 0; display: grid; gap: 8px; text-align: left; }
    .rule {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: #fff;
      font-weight: 900;
      font-size: clamp(1rem, 4.4vw, 1.15rem);
      line-height: 1.3;
    }
    .swatch {
      flex: none;
      display: grid;
      place-items: center;
      min-width: 74px;
      height: 36px;
      padding: 0 8px;
      font-size: .85rem;
      letter-spacing: .04em;
    }
    .swatch.do {
      min-height: 36px;
      width: auto;
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--green-dark);
      font-size: .85rem;
    }
    .swatch.lie {
      min-height: 36px;
      width: auto;
      border-radius: 6px;
      box-shadow: 0 0 0 2px var(--red), 0 3px 0 var(--red-dark);
      transform: none;
      font-size: .85rem;
      letter-spacing: .04em;
    }
    .stake { margin: 8px 0 0; font-size: 1.02rem; font-weight: 800; line-height: 1.45; }
    .fine { margin: 6px 0 0; color: var(--muted); font-size: .78rem; font-weight: 800; }
    .primary, .xbtn, .ghost {
      appearance: none;
      border: 0;
      border-radius: 16px;
      min-height: 54px;
      font-weight: 900;
      letter-spacing: .06em;
      cursor: pointer;
      touch-action: manipulation;
      text-decoration: none;
      display: grid;
      place-items: center;
    }
    .primary {
      width: 100%;
      margin-top: 12px;
      background: var(--amber);
      color: #3a2618;
      box-shadow: 0 6px 0 var(--amber-dark);
      font-size: 1.3rem;
    }
    .primary:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--amber-dark); }
    .primary:disabled, .ghost:disabled, .xbtn.is-off {
      opacity: .45;
      cursor: default;
    }
    .kicker {
      margin: 6px 0 0;
      font-size: .95rem;
      font-weight: 900;
      letter-spacing: .14em;
      color: var(--muted);
    }
    .result-ico { width: 72px; height: 72px; margin: 4px auto 0; }
    .result-ico svg { width: 100%; height: 100%; display: block; }
    .why {
      margin: 8px 0 0;
      padding: 8px 10px;
      border-radius: 12px;
      background: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.4;
    }
    .rounds {
      margin: 8px 0 0;
      font-size: 1.2rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .obeyline {
      margin: 2px 0 0;
      font-size: clamp(1.05rem, 4.6vw, 1.25rem);
      font-weight: 900;
      line-height: 1.35;
    }
    .share {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: #fff;
      box-shadow: inset 0 0 0 1.5px #efd7b4;
      font-size: .95rem;
      font-weight: 800;
      line-height: 1.45;
      text-align: left;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions .ghost { flex: .8; background: #fff; color: var(--ink); box-shadow: 0 5px 0 #e4d3bc; font-size: 1rem; }
    .actions .xbtn {
      flex: 1.3;
      background: #111;
      color: #fff;
      box-shadow: 0 5px 0 #000;
      font-size: 1.05rem;
      letter-spacing: .04em;
    }
    .ghost:active, .xbtn:active { transform: translateY(2px); }
    .panel[data-kind="clear"] h1 { color: #0f7a45; }
    .panel[data-kind="lie"] h1 { color: #a21caf; }
    .panel[data-kind="truth"] h1 { color: #c2410c; }
    .panel[data-kind="time"] h1 { color: #1d4ed8; }
    .panel[data-kind="clear"] .why { background: #e8f8ee; }
    .panel[data-kind="lie"] .why { background: #fae8ff; }
    .panel[data-kind="truth"] .why { background: #ffedd5; }
    .panel[data-kind="time"] .why { background: #dbeafe; }
    .actor svg { width: 100%; height: auto; display: block; overflow: visible; }
    .actor .face, .actor .sweat, .actor .stamp-prop { display: none; }
    .actor.is-idle .face-idle,
    .actor.is-yay .face-yay,
    .actor.is-sad .face-sad,
    .actor.is-stamp .face-stamp,
    .actor.is-panic .face-panic,
    .actor.is-nod .face-nod,
    .actor.is-fluster .face-fluster,
    .actor.is-laugh .face-laugh,
    .actor.is-huh .face-huh { display: block; }
    .actor.is-stamp .stamp-prop,
    .actor.is-fluster .sweat,
    .actor.is-panic .sweat { display: block; }
    .actor.is-idle { animation: bob 2.2s ease-in-out infinite; }
    .actor.is-yay, .actor.is-nod { animation: hop .48s ease-in-out 2; }
    .actor.is-laugh { animation: hop .28s ease-in-out 3; }
    .actor.is-sad, .actor.is-panic, .actor.is-fluster, .actor.is-huh { animation: shudder .36s linear 2; }
    .actor.is-stamp { animation: squish .32s ease; }
    .actor.is-idle .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.8s infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }
    @keyframes shudder {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-4px) rotate(-2deg); }
      70% { transform: translateX(4px) rotate(2deg); }
    }

      return '<svg viewBox="0 0 70 84" aria-hidden="true"><rect x="18" y="8" width="34" height="28" rx="8" fill="#c9843d" stroke="#5c3b22" stroke-width="3"/><rect x="10" y="36" width="50" height="12" rx="4" fill="#e0a15a" stroke="#5c3b22" stroke-width="3"/><path d="M16 48 v16 M54 48 v16" stroke="#5c3b22" stroke-width="3"/><ellipse cx="35" cy="22" rx="16" ry="8" fill="#f5d76e" stroke="#5c3b22" stroke-width="3"/><path d="M22 22 h26" stroke="#e7b84a" stroke-width="2"/><rect x="31" y="10" width="8" height="8" rx="2" fill="#e11d48"/></svg><span class="tag">ぼうし</span>';
    }

    function iconSvg(kind) {
      if (kind === "lie") {
        return '<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="32" fill="#fae8ff" stroke="#c026d3" stroke-width="4"/><ellipse cx="36" cy="40" rx="16" ry="8" fill="#f5d76e" stroke="#5c3b22" stroke-width="3"/><path d="M24 28 q12 -16 24 0" fill="#e11d48" stroke="#5c3b22" stroke-width="3"/><path d="M30 44 q4 8 0 12 M40 44 q4 8 0 12" fill="none" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/><path d="M18 18 l10 10 M28 18 l-10 10" stroke="#c026d3" stroke-width="4" stroke-linecap="round"/></svg>';
      }
      if (kind === "truth") {
        return '<svg viewBox="0 0 72 72" aria-hidden="true"><rect x="6" y="6" width="60" height="60" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/><path d="M20 38 l10 10 l22 -24" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 50 l12 8 M52 48 l10 -2" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/></svg>';
      }
      if (kind === "time") {
        return '<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="38" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><rect x="30" y="6" width="12" height="8" rx="2" fill="#2563eb"/><path d="M36 38 V24" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/><path d="M36 38 l12 6" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/><circle cx="36" cy="38" r="3" fill="#1d4ed8"/></svg>';
      }
      return '<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="32" fill="#e8f8ee" stroke="#16a34a" stroke-width="4"/><path d="M20 38 l10 10 l22 -24" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }

    function splashSvg() {
      return '<svg viewBox="0 0 74 74" aria-hidden="true"><path d="M37 8 l4 14 -12 4 14 6 -6 14 10 -8 8 12 -2 -14 14 -2 -12 -8 8 -10 -14 4 z" fill="#fb7185" stroke="#9f1239" stroke-width="2"/></svg>';
    }

    function mount(hostId, tplId) {
      var host = document.getElementById(hostId);
      host.replaceChildren(document.getElementById(tplId).content.cloneNode(true));
    }

    function setMood(hostId, mood) {
      document.getElementById(hostId).className = hostClass(hostId) + " actor is-" + mood;
    }

    function hostClass(hostId) {
      if (hostId === "kid") return "kid-slot";
      if (hostId === "parrot") return "parrot-slot";
      return "";
    }

    function movePiece(id, xy, animate) {
      var el = document.getElementById("p-" + id);
      if (!animate) el.style.transition = "none";
      el.style.left = xy[0] + "%";
      el.style.top = xy[1] + "%";
      if (!animate) {
        void el.offsetWidth;
        el.style.transition = "";
      }
    }

    function placeProp(id, xy) {
      var el = document.getElementById(id);
      el.style.left = xy[0] + "%";
      el.style.top = xy[1] + "%";
    }

    function syncGhosts() {
      ["hashi", "sara", "koppu", "napkin", "spoon"].forEach(function (id) {
        var g = document.getElementById("g-" + id);
        if (g) g.classList.toggle("gone", spot[id] === "place");
      });
    }

    function resetTable(animate) {
      PIECES.forEach(function (id) {
        spot[id] = "home";
        var el = document.getElementById("p-" + id);
        el.classList.remove("is-placed", "is-mess", "hot", "snapping");
        movePiece(id, HOME[id], animate);
      });
      syncGhosts();
      splash.hidden = true;
    }

    function paintHearts(justLost) {
      heartsEl.replaceChildren();
      for (var i = 0; i < 3; i++) {
        var on = i < lives;
        var wrap = document.createElement("span");
        wrap.className = "heart" + (!on && justLost && i === lives ? " break" : "");
        wrap.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z" fill="' + (on ? "#e11d48" : "#e7d3b8") + '"/></svg>';
        heartsEl.appendChild(wrap);
      }
    }

    function paintPips() {
      var nodes = pipsEl.children;
      for (var i = 0; i < TOTAL; i++) {
        var cls = marks[i] || "";
        if (!cls && i === index && (phase === "play" || phase === "beat" || phase === "scold")) cls = "now";
        nodes[i].className = cls;
      }
    }

    function paintTime(leftMs) {
      var left = Math.max(0, leftMs);
      var p = roundMs > 0 ? left / roundMs : 0;
      timeFill.style.transform = "scaleX(" + Math.max(0, Math.min(1, p)) + ")";
      timeLabel.textContent = (left / 1000).toFixed(1);
      timeRow.classList.toggle("warn", left <= 1500 && phase === "play");
      bubble.classList.toggle("urgent", left <= 1500 && phase === "play");
    }

    function later(fn, ms) {
      var my = ++token;
      setTimeout(function () {
        if (my === token) fn();
      }, ms);
    }

    function cancelLater() { token++; }

    function blurFocus() {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }

    function ensureAudio() {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) {
        try { audioCtx = new AC(); } catch (e) { return; }
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function tone(freq, dur, type, gain, delay) {
      if (!audioCtx) return;
      var t = audioCtx.currentTime + (delay || 0);
      var end = t + Math.max(0.04, dur);
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(Math.max(gain, 0.0001), t);
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      o.connect(g).connect(audioCtx.destination);
      o.start(t);
      o.stop(end + 0.02);
    }

    function noise(dur, gain, freq) {
      if (!audioCtx) return;
      var sr = audioCtx.sampleRate;
      var len = Math.max(1, Math.floor(sr * dur));
      var buf = audioCtx.createBuffer(1, len, sr);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      var filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = freq || 900;
      var g = audioCtx.createGain();
      var t = audioCtx.currentTime;
      g.gain.setValueAtTime(Math.max(gain, 0.0001), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter).connect(g).connect(audioCtx.destination);
      src.start();
    }

    function sfxOk() {
      tone(523, 0.08, "triangle", 0.07, 0);
      tone(659, 0.09, "triangle", 0.07, 0.07);
      tone(784, 0.14, "triangle", 0.06, 0.14);
    }
    function sfxBad() {
      tone(196, 0.14, "sawtooth", 0.035, 0);
      tone(130, 0.2, "square", 0.03, 0.08);
    }
    function sfxStamp() { noise(0.07, 0.05, 420); tone(160, 0.09, "square", 0.04, 0.01); }
    function sfxSnap() { tone(520, 0.05, "sine", 0.06, 0); tone(740, 0.07, "sine", 0.05, 0.04); }
    function sfxTick() { tone(980, 0.035, "square", 0.025, 0); }
    function sfxTime() { tone(660, 0.07, "square", 0.04, 0); tone(440, 0.12, "square", 0.04, 0.09); }
    function sfxStart() { tone(392, 0.06, "triangle", 0.05, 0); tone(523, 0.08, "triangle", 0.05, 0.06); }

    function showBeat() {
      callout.className = "callout beat";
      callout.innerHTML = "<b>せいかい！</b>";
      callout.hidden = false;
    }

    function showScold(type, headline, detail) {
      callout.className = "callout scold scold-" + type;
      callout.innerHTML = '<div class="ico">' + iconSvg(type) + "</div><b>" + headline + "</b><span>" + detail + "</span>";
      callout.hidden = false;
    }

    function hideCallout() { callout.hidden = true; }

    function currentRound() { return ROUNDS[index]; }

    function beginRound() {
      var round = currentRound();
      phase = "play";
      roundMs = round.sec * 1000;
      deadline = performance.now() + roundMs;
      lastTick = 0;
      hideCallout();
      splash.hidden = true;
      lineEl.textContent = round.say;
      doLabel.textContent = round.verb;
      doIco.innerHTML = pieceSvg(round.item);
      btnDo.setAttribute("aria-label", round.verb);
      roundLabel.textContent = (index + 1) + " / " + TOTAL;
      PIECES.forEach(function (id) {
        var el = document.getElementById("p-" + id);
        el.classList.toggle("hot", id === round.item);
        el.classList.remove("is-mess", "snapping");
      });
      bubble.classList.remove("pop");
      void bubble.offsetWidth;
      bubble.classList.add("pop");
      setMood("kid", "idle");
      setMood("parrot", "idle");
      paintTime(roundMs);
      paintPips();
      paintHearts(false);
    }

    function messXY(round) {
      if (round.mess === "koppu") {
        var el = document.getElementById("p-koppu");
        return [parseFloat(el.style.left), parseFloat(el.style.top)];
      }
      if (round.mess === "hat") return PROPS.chair;
      return [50, 6];
    }

    function xyNow(id) {
      return spot[id] === "place" && PLACE[id] ? PLACE[id] : HOME[id];
    }

    function succeed(kind) {
      var round = currentRound();
      correct += 1;
      marks[index] = "ok";
      phase = "beat";
      if (round.truth) {
        spot[round.item] = "place";
        var el = document.getElementById("p-" + round.item);
        el.classList.add("is-placed", "snapping");
        el.classList.remove("hot");
        movePiece(round.item, PLACE[round.item], true);
        syncGhosts();
        setMood("kid", "yay");
        setMood("parrot", "nod");
        sfxSnap();
        sfxOk();
      } else {
        document.getElementById("p-" + round.item).classList.remove("hot");
        setMood("kid", "stamp");
        setMood("parrot", "fluster");
        sfxStamp();
        sfxOk();
      }
      showBeat();
      paintPips();
      later(afterResolve, BEAT_MS);
    }

    function fail(type) {
      var round = currentRound();
      lives -= 1;
      marks[index] = "bad";
      phase = "scold";
      var headline = type === "lie" ? "ウソにしたがった" : type === "truth" ? "ほんとうだったのに ことわった" : "じかんぎれ";
      var detail = type === "time"
        ? "「" + round.say + "」を えらぶまえに 時間切れ"
        : round.detail;
      lastFail = { type: type, headline: headline, detail: detail };
      PIECES.forEach(function (id) {
        document.getElementById("p-" + id).classList.remove("hot");
      });
      if (type === "lie" && round.mess) {
        var xy = messXY(round);
        var el = document.getElementById("p-" + round.item);
        el.classList.add("is-mess");
        movePiece(round.item, xy, true);
        splash.hidden = false;
        splash.style.left = xy[0] + "%";
        splash.style.top = xy[1] + "%";
        setMood("kid", "sad");
        setMood("parrot", "laugh");
        sfxSnap();
        sfxBad();
      } else if (type === "truth") {
        setMood("kid", "sad");
        setMood("parrot", "huh");
        sfxStamp();
        sfxBad();
      } else {
        setMood("kid", "panic");
        setMood("parrot", "huh");
        sfxTime();
        sfxBad();
      }
      showScold(type, headline, detail);
      paintHearts(true);
      paintPips();
      paintTime(0);
      later(function () {
        if (type === "lie") {
          var piece = document.getElementById("p-" + round.item);
          piece.classList.remove("is-mess");
          movePiece(round.item, xyNow(round.item), false);
          splash.hidden = true;
        }
        afterResolve();
      }, lives <= 0 ? 800 : SCOLD_MS);
    }

    function afterResolve() {
      if (lives <= 0) {
        showResult(false);
        return;
      }
      if (index >= TOTAL - 1) {
        showResult(true);
        return;
      }
      index += 1;
      beginRound();
    }

    function obey() {
      if (phase !== "play") return;
      blurFocus();
      obeyed += 1;
      var round = currentRound();
      if (round.truth) succeed("do");
      else fail("lie");
    }

    function refuse() {
      if (phase !== "play") return;
      blurFocus();
      var round = currentRound();
      if (!round.truth) succeed("refuse");
      else fail("truth");
    }

    function onTimeout() {
      if (phase !== "play") return;
      fail("time");
    }

    function shareBody() {
      var status = won ? "クリア！" : "ゲームオーバー";
      return "ウソつきおてつだい " + status + " " + correct + "/8ラウンド あなたは " + obeyed + "/8回 したがった #ねむねむゲーム部\n" + PLAY_URL;
    }

    function showResult(didWin) {
      won = didWin;
      phase = "result";
      hideCallout();
      paintPips();
      var text = shareBody();
      document.getElementById("share-text").textContent = text;
      shareLink.href = "https://x.com/intent/post?text=" + encodeURIComponent(text);
      document.getElementById("result-rounds").textContent = correct + "/8 ラウンドクリア";
      document.getElementById("result-obey").textContent = "あなたは " + obeyed + "/8回 したがった";
      var kicker = document.getElementById("result-kicker");
      var title = document.getElementById("result-title");
      var why = document.getElementById("result-why");
      var ico = document.getElementById("result-ico");
      if (didWin) {
        resultPanel.dataset.kind = "clear";
        kicker.textContent = "クリア";
        title.textContent = "クリア！";
        why.textContent = correct === TOTAL ? "8回とも、しるしをみぬいた！" : "ミスがあっても、8回のりきった！";
        ico.innerHTML = iconSvg("clear");
        setMood("result-kid", "yay");
        setMood("result-parrot", "nod");
        setMood("kid", "yay");
        setMood("parrot", "nod");
      } else {
        var failInfo = lastFail || { type: "time", headline: "じかんぎれ", detail: "じかんぎれ" };
        resultPanel.dataset.kind = failInfo.type;
        kicker.textContent = "ゲームオーバー";
        title.textContent = failInfo.headline;
        why.textContent = failInfo.detail;
        ico.innerHTML = iconSvg(failInfo.type);
        setMood("result-kid", failInfo.type === "time" ? "panic" : "sad");
        setMood("result-parrot", failInfo.type === "lie" ? "laugh" : "huh");
      }
      btnCopy.textContent = "コピー";
      resultReadyAt = performance.now() + LOCK_MS;
      needRelease = held.Space || held.Enter;
      resultEl.classList.add("is-locked");
      btnRetry.disabled = true;
      btnCopy.disabled = true;
      shareLink.classList.add("is-off");
      shareLink.setAttribute("aria-disabled", "true");
      resultEl.hidden = false;
      blurFocus();
      later(function () {
        if (phase !== "result") return;
        resultEl.classList.remove("is-locked");
        btnRetry.disabled = false;
        btnCopy.disabled = false;
        shareLink.classList.remove("is-off");
        shareLink.removeAttribute("aria-disabled");
      }, LOCK_MS);
    }

    function beginGame() {
      if (phase !== "title" && phase !== "result") return;
      if (phase === "result" && performance.now() < resultReadyAt) return;
      cancelLater();
      ensureAudio();
      phase = "boot";
      index = 0;
      lives = 3;
      correct = 0;
      obeyed = 0;
      marks = [];
      for (var i = 0; i < TOTAL; i++) marks.push("");
      lastFail = null;
      won = false;
      resetTable(false);
      titleEl.hidden = true;
      resultEl.hidden = true;
      resultEl.classList.remove("is-locked");
      sfxStart();
      beginRound();
    }

    function onKeyDown(e) {
      if (e.code !== "Space" && e.code !== "Enter") return;
      e.preventDefault();
      if (e.repeat) return;
      if (e.code === "Space") held.Space = true;
      if (e.code === "Enter") held.Enter = true;
      if (phase === "title") {
        beginGame();
        return;
      }
      if (phase === "result") {
        if (needRelease || performance.now() < resultReadyAt || btnRetry.disabled) return;
        beginGame();
        return;
      }
      if (phase === "play") {
        if (e.code === "Enter") obey();
        else refuse();
      }
    }

    function onKeyUp(e) {
      if (e.code === "Space") held.Space = false;
      if (e.code === "Enter") held.Enter = false;
      if (!held.Space && !held.Enter) needRelease = false;
    }

    function bindPress(el, fn) {
      el.addEventListener("pointerdown", function (e) {
        if (e.button != null && e.button > 0) return;
        e.preventDefault();
        fn();
      });
    }

    mount("kid", "tpl-kid");
    mount("parrot", "tpl-parrot");
    mount("title-kid", "tpl-kid");
    mount("title-parrot", "tpl-parrot");
    mount("result-kid", "tpl-kid");
    mount("result-parrot", "tpl-parrot");
    setMood("title-kid", "yay");
    setMood("title-parrot", "idle");

    PIECES.forEach(function (id) {
      document.querySelector("#p-" + id + " .body").innerHTML = pieceSvg(id);
      var g = document.getElementById("g-" + id);
      if (g) g.innerHTML = ghostSvg(id);
    });
    document.getElementById("wan").innerHTML = propSvg("wan");
    document.getElementById("chair").innerHTML = propSvg("chair");
    splash.innerHTML = splashSvg();
    Object.keys(PROPS).forEach(function (id) { placeProp(id, PROPS[id]); });
    for (var p = 0; p < TOTAL; p++) {
      var pip = document.createElement("i");
      pipsEl.appendChild(pip);
    }
    resetTable(false);
    paintHearts(false);
    paintTime(5000);

    bindPress(btnDo, obey);
    bindPress(btnLie, refuse);
    bindPress(document.getElementById("btn-start"), beginGame);
    bindPress(btnRetry, beginGame);
    PIECES.forEach(function (id) {
      var el = document.getElementById("p-" + id);
      el.addEventListener("pointerdown", function (e) {
        if (!el.classList.contains("hot")) return;
        if (e.button != null && e.button > 0) return;
        e.preventDefault();
        obey();
      });
    });

    btnCopy.addEventListener("click", function () {
      if (btnCopy.disabled || performance.now() < resultReadyAt) return;
      var text = shareBody();
      var done = function () {
        btnCopy.textContent = "コピーした！";
        copyTimer = performance.now() + 1200;
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          done();
        });
      } else {
        done();
      }
    });

    shareLink.addEventListener("click", function (e) {
      if (shareLink.classList.contains("is-off") || performance.now() < resultReadyAt) e.preventDefault();
    });

    document.addEventListener("keydown", onKeyDown);
    document.addEventListener("keyup", onKeyUp);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        document.hiddenAt = performance.now();
      } else if (document.hiddenAt && phase === "play") {
        deadline += performance.now() - document.hiddenAt;
        document.hiddenAt = 0;
      }
    });
    document.getElementById("stage").addEventListener("contextmenu", function (e) { e.preventDefault(); });

    var last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      if (copyTimer && now > copyTimer) {
        copyTimer = 0;
        if (phase === "result") btnCopy.textContent = "コピー";
      }
      if (phase !== "play") return;
      var left = deadline - now;
      if (left <= 0) {
        paintTime(0);
        onTimeout();
        return;
      }
      paintTime(left);
      if (left <= 1500) {
        var gap = left < 700 ? 160 : 320;
        if (now - lastTick >= gap) {
          lastTick = now;
          sfxTick();
        }
      }
      last = now;
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
