<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8fd4ff">
  <title>合図よみ — Signal Read</title>
  <style>
    :root {
      --ink: #1b2340;
      --muted: #5c6784;
      --card: #fffdf8;
      --go: #00a8c0;
      --wait: #ff3b6a;
      --good: #0c9a62;
      --gold: #ffbf1a;
      --line: rgba(27, 35, 64, .12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(circle at 100% -10%, #fff4c4 0%, transparent 42%),
        linear-gradient(180deg, #9fd8ff 0%, #fff3d4 58%, #ffd59a 100%);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    body.almost {
      background:
        radial-gradient(circle at 100% -8%, #fff1b0 0%, transparent 40%),
        linear-gradient(180deg, #ffb15a 0%, #ff7d3c 52%, #ff5d6c 100%);
    }
    .sun {
      position: fixed;
      z-index: 0;
      top: -140px;
      right: -120px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff8d4 0%, #ffe08a 48%, rgba(255, 196, 77, 0) 70%);
      pointer-events: none;
    }
    body.almost .sun {
      background: radial-gradient(circle, #fff 0%, #ffd0a4 42%, rgba(255, 120, 60, 0) 70%);
    }
    .back {
      position: fixed;
      z-index: 8;
      top: max(10px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 253, 248, .88);
      box-shadow: inset 0 0 0 1px var(--line);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-decoration: none;
    }
    .shell {
      position: relative;
      z-index: 1;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding:
        calc(max(10px, env(safe-area-inset-top)) + 34px)
        16px
        max(10px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    body.almost .shell {
      box-shadow: inset 0 0 0 4px var(--gold), inset 0 0 70px rgba(255, 120, 40, .28);
    }
    body.final-push .shell {
      animation: rim .55s ease-in-out infinite;
    }
    @keyframes rim {
      0%, 100% { box-shadow: inset 0 0 0 4px var(--gold), inset 0 0 40px rgba(255, 90, 40, .25); }
      50% { box-shadow: inset 0 0 0 7px #fff1b8, inset 0 0 90px rgba(255, 70, 40, .45); }
    }
    header { flex: none; text-align: center; }
    .kicker {
      margin: 0;
      color: #0c7f92;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
    }
    body.almost .kicker { color: #8a2e12; }
    h1 {
      margin: 2px 0 0;
      font-size: clamp(1.6rem, 7vw, 2.3rem);
      line-height: 1.05;
      letter-spacing: .08em;
    }
    .en {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
    }
    #gate { flex: none; }
    #gate[hidden] { display: none !important; }
    .card {
      width: min(100%, 460px);
      margin: 8px auto 0;
      padding: 14px 14px 12px;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 12px 30px rgba(27, 35, 64, .12), inset 0 0 0 1px rgba(255, 255, 255, .7);
      text-align: center;
    }
    .rule {
      margin: 0;
      font-size: .98rem;
      font-weight: 800;
      line-height: 1.45;
    }
    .rule + .rule { margin-top: 4px; }
    .sym { font-style: normal; font-size: 1.15em; line-height: 1; }
    .sym.go { color: var(--go); }
    .sym.wait { color: var(--wait); }
    .keys, .sub, .why {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }
    .keys.foot { flex: none; text-align: center; margin: 2px 0 0; }
    button {
      width: 100%;
      margin-top: 10px;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: .08em;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .hud {
      flex: none;
      display: grid;
      grid-template-columns: 1.3fr .7fr;
      gap: 8px;
      margin: 8px 0 6px;
    }
    .pill {
      padding: 7px 10px 8px;
      border-radius: 14px;
      background: rgba(255, 253, 248, .9);
      box-shadow: inset 0 0 0 1px var(--line);
      text-align: center;
    }
    .pill span {
      display: block;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .pill strong {
      display: block;
      margin-top: 1px;
      font-size: clamp(1.25rem, 5.5vw, 1.7rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .pill.score strong { font-size: clamp(1rem, 4.2vw, 1.25rem); color: #c47a00; }
    .pips {
      flex: none;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin: 0 0 4px;
    }
    .pips i {
      display: block;
      height: 7px;
      border-radius: 99px;
      background: rgba(27, 35, 64, .16);
    }
    .pips i.on { background: var(--good); box-shadow: 0 0 8px rgba(12, 154, 98, .55); }
    .pips i.bad { background: var(--wait); }
    body.almost .pips i:not(.on):not(.bad) {
      background: rgba(255, 255, 255, .45);
      animation: pip .7s ease-in-out infinite;
    }
    @keyframes pip {
      50% { background: var(--gold); }
    }
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .heat {
      flex: none;
      margin: 0;
      text-align: center;
      font-size: clamp(1.35rem, 6vw, 2rem);
      font-weight: 900;
      letter-spacing: .2em;
      color: #fff8e8;
      text-shadow: 0 2px 0 #9a3412, 0 0 16px rgba(255, 80, 40, .45);
    }
    .heat[hidden] { display: none !important; }
    .hero {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: block;
    }
    .face, .mark { display: none; }
    .mood-idle .face-idle,
    .mood-go .face-go,
    .mood-wait .face-wait,
    .mood-good .face-good,
    .mood-bad .face-bad,
    .mood-hot .face-hot,
    .sign-blank .mark-blank,
    .sign-go .mark-go,
    .sign-wait .mark-wait { display: inline; }
    .brow, .mouthline {
      fill: none;
      stroke: #1b2340;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mouthline { stroke: #6d3044; }
    #bob { transform-box: fill-box; transform-origin: center bottom; }
    .mood-idle #bob { animation: breathe 2.8s ease-in-out infinite; }
    .mood-hot #bob { animation: eager .5s ease-in-out infinite; }
    .mood-go #bob { animation: anticipate .18s ease-out; }
    .mood-good #bob { animation: hop .42s cubic-bezier(.2, .8, .2, 1); }
    .mood-bad #bob { animation: wince .48s linear; }
    .signboard { transform-box: fill-box; transform-origin: center center; }
    .mood-go .signboard { animation: signpop .2s ease-out; }
    .mood-bad .signboard {
      transform: rotate(9deg) translateY(6px);
      transform-origin: 30% 100%;
    }
    .board { fill: #243056; }
    .sign-go .board { fill: #073844; }
    .sign-wait .board { fill: #3d1224; }
    .frame { fill: none; stroke: #10182c; stroke-width: 8; }
    .sign-go .frame { stroke: #7af4ff; }
    .sign-wait .frame { stroke: #ff8aa3; }
    .halo { transform-box: fill-box; transform-origin: center; }
    .sign-go .halo { animation: halo .48s ease-in-out infinite; }
    .dots { transform-box: fill-box; transform-origin: center; }
    .sign-blank .dots { animation: dots 1s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes eager {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes anticipate {
      0% { transform: translateY(5px); }
      100% { transform: translateY(0); }
    }
    @keyframes hop {
      0% { transform: translateY(0) scale(1, 1); }
      40% { transform: translateY(-16px) scale(.98, 1.04); }
      75% { transform: translateY(0) scale(1.03, .96); }
      100% { transform: translateY(0) scale(1, 1); }
    }
    @keyframes wince {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-1.5deg); }
      50% { transform: translateX(7px) rotate(1.5deg); }
      75% { transform: translateX(-3px); }
    }
    @keyframes signpop {
      0% { transform: scale(.84); }
      100% { transform: scale(1); }
    }
    @keyframes halo {
      0%, 100% { opacity: .18; }
      50% { opacity: .95; }
    }
    @keyframes dots {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
    .meter {
      flex: none;
      height: 10px;
      margin: 0 18px 4px;
      border-radius: 99px;
      background: rgba(27, 35, 64, .16);
      overflow: hidden;
    }
    .meter[hidden] { display: none !important; }
    .meter i {
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      background: #fff;
      border-radius: inherit;
    }
    .meter.urgent i { background: var(--gold); }
    .legend, .hint {
      flex: none;
      margin: 0;
      text-align: center;
      font-weight: 900;
    }
    .legend { font-size: .92rem; letter-spacing: .06em; }
    .hint {
      min-height: 1.3em;
      color: var(--ink);
      font-size: .95rem;
    }
    .flash {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
    }
    .flash.bad { background: var(--wait); }
    .flash.good { background: #7af4ff; }
    .flash.on { animation: flash .65s linear forwards; }
    @keyframes flash {
      0% { opacity: .45; }
      100% { opacity: 0; }
    }
    .boom {
      position: fixed;
      inset: 0;
      z-index: 7;
      display: grid;
      place-items: center;
      align-content: center;
      pointer-events: none;
      text-align: center;
    }
    .boom[hidden] { display: none !important; }
    .boom strong {
      display: block;
      font-size: clamp(3rem, 14vw, 5.4rem);
      line-height: .95;
      letter-spacing: .06em;
      color: var(--ink);
      text-shadow: 0 3px 0 #fff, 0 10px 28px rgba(255, 255, 255, .8);
      animation: pop .16s ease-out;
    }
    .boom.good strong { color: var(--good); }
    .boom.bad strong { color: var(--wait); }
    @keyframes pop {
      from { transform: scale(.72); opacity: .2; }
      to { transform: scale(1); opacity: 1; }
    }
    .shell.shake { animation: shake .48s linear; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px max(14px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(20, 24, 40, .05), rgba(20, 24, 40, .55) 55%);
    }
    .sheet[hidden] { display: none !important; }
    .sheet .card { margin: 0; width: min(100%, 420px); }
    .sheet h2 {
      margin: 0;
      font-size: clamp(1.8rem, 8vw, 2.4rem);
      letter-spacing: .12em;
    }
    .card.fail { box-shadow: 0 16px 40px rgba(27, 35, 64, .2), inset 0 0 0 2px var(--wait); }
    .card.fail h2, .miss-word { color: var(--wait); }
    .card.clear { box-shadow: 0 16px 40px rgba(27, 35, 64, .2), inset 0 0 0 2px var(--good); }
    .card.clear h2 { color: var(--good); }
    .miss-word {
      margin: 2px 0 0;
      font-size: 1.6rem;
      font-weight: 900;
    }
    .result-progress {
      margin: 2px 0 0;
      font-size: clamp(1.8rem, 8vw, 2.6rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-height: 760px) {
      h1 { font-size: 1.45rem; }
      .hud { margin: 6px 0 4px; }
      .pill { padding: 5px 8px; }
      .pill strong { font-size: 1.2rem; }
      .card { padding: 10px 12px 8px; }
      .rule { font-size: .9rem; }
      button { min-height: 42px; margin-top: 8px; }
    }
    @media (max-height: 640px) {
      .kicker, .en { display: none; }
      .shell { padding-top: calc(max(6px, env(safe-area-inset-top)) + 30px); }
      .legend { display: none; }
      .rule { font-size: .84rem; line-height: 1.35; }
      .keys { margin-top: 4px; }
      .meter { height: 8px; }
    }
      @media (max-height: 520px) {
      h1 { font-size: 1.15rem; }
      .hud { margin: 4px 0; }
      .pill span { display: none; }
      .card { padding: 8px; }
      button { min-height: 36px; font-size: .95rem; }
      .heat { font-size: 1.05rem; letter-spacing: .12em; }
    }
    @media (prefers-reduced-motion: reduce) {
      #bob, .signboard, .halo, .dots, .shell, body.final-push .shell, body.almost .pips i { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <a class="back" href="../../index.html">ギャラリーへ</a>
  <div class="shell" id="shell">
    <header>
      <p class="kicker">DAY 8</p>
      <h1>合図よみ</h1>
      <p class="en">SIGNAL READ</p>
    </header>
    <div id="gate">
      <div class="card">
        <p class="rule"><b class="sym go">○</b>が出たらタップ、<b class="sym wait">×</b>が出たら待つ。</p>
        <p class="rule">まちがいもおくれも即失敗で、7連続でクリア。</p>
        <p class="keys">タップ / クリック / Space</p>
        <button type="button" id="btn-start">スタート</button>
      </div>
    </div>
    <div class="hud">
      <div class="pill"><span>連続</span><strong id="progress">0 / 7</strong></div>
      <div class="pill score"><span>スコア</span><strong id="score">0</strong></div>
    </div>
    <div class="pips" id="pips" aria-hidden="true"></div>
    <div class="stage" id="stage">
      <p class="heat" id="heat" hidden>あと少し</p>
      <svg id="hero" class="hero mood-idle sign-blank" viewBox="0 0 460 380" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <g id="bob">
          <ellipse cx="155" cy="366" rx="92" ry="11" fill="#000" opacity=".12"/>
          <g class="legs">
            <rect x="112" y="262" width="30" height="72" rx="14" fill="#2a3148"/>
            <rect x="162" y="262" width="30" height="72" rx="14" fill="#242a40"/>
            <rect x="104" y="318" width="46" height="22" rx="8" fill="#1c2030"/>

          </g>

          <path class="arm" d="M206 188 C236 210 258 196 262 168" fill="none" stroke="#e4462c" stroke-width="20" stroke-linecap="round"/>
          <path d="M92 176 C92 148 118 136 155 136 C192 136 218 148 218 176 L226 268 C192 294 112 294 82 268 Z" fill="#ff5a36"/>
          <path d="M155 146 V255" stroke="#ffe08a" stroke-width="8" stroke-linecap="round"/>

          <path d="M180 176 Q208 204 194 236" fill="none" stroke="#14b8a8" stroke-width="11" stroke-linecap="round"/>
          <polygon points="118,196 121,204 130,204 123,209 126,218 118,213 110,218 113,209 106,204 115,204" fill="#ffe08a"/>

            <rect class="frame" x="252" y="28" width="188" height="188" rx="26"/>
            <g class="mark mark-blank">
              <g class="dots">
                <circle cx="328" cy="122" r="8" fill="#9aa6c2"/>
                <circle cx="346" cy="122" r="8" fill="#9aa6c2"/>
                <circle cx="364" cy="122" r="8" fill="#9aa6c2"/>
              </g>
            </g>
            <g class="mark mark-go">
              <circle class="halo" cx="346" cy="122" r="70" fill="#7af4ff"/>
              <circle cx="346" cy="122" r="52" fill="none" stroke="#7af4ff" stroke-width="18"/>
            </g>
            <g class="mark mark-wait">
              <path d="M300 76 L392 168 M392 76 L300 168" fill="none" stroke="#ff5d82" stroke-width="18" stroke-linecap="round"/>
            </g>
          </g>
          <circle cx="90" cy="326" r="14" fill="#ffc8a8"/>

            <path class="brow" d="M106 100 Q124 90 142 100"/>
            <path class="brow" d="M158 100 Q176 90 194 100"/>
            <path class="mouthline" d="M108 116 Q124 100 140 116" stroke-width="5"/>
            <path class="mouthline" d="M160 116 Q176 100 192 116" stroke-width="5"/>
            <path d="M122 146 Q150 178 178 146 Q150 162 122 146 Z" fill="#6d3044"/>
            <ellipse cx="102" cy="140" rx="12" ry="8" fill="#ff8b9a" opacity=".9"/>
            <ellipse cx="198" cy="140" rx="12" ry="8" fill="#ff8b9a" opacity=".9"/>
          </g>
          <g class="face face-bad">
            <path class="brow" d="M106 108 L140 96"/>
            <path class="brow" d="M194 108 L160 96"/>
            <path class="mouthline" d="M112 104 L138 126 M138 104 L112 126" stroke-width="4"/>
            <path class="mouthline" d="M162 104 L188 126 M188 104 L162 126" stroke-width="4"/>
            <path class="mouthline" d="M128 158 Q150 142 172 158"/>
            <path d="M206 92 Q218 110 206 120 Q194 110 206 92 Z" fill="#7ad7ff"/>
          </g>
          <g class="face face-hot">
            <path class="brow" d="M104 92 Q124 78 144 94"/>
            <path class="brow" d="M156 94 Q176 78 196 92"/>
            <ellipse cx="124" cy="116" rx="14" ry="16" fill="#1b2340"/>
            <ellipse cx="176" cy="116" rx="14" ry="16" fill="#1b2340"/>
            <path d="M119 112 L121 106 L123 112 L129 114 L123 116 L121 122 L119 116 L113 114 Z" fill="#ffe08a"/>
            <path d="M171 112 L173 106 L175 112 L181 114 L175 116 L173 122 L171 116 L165 114 Z" fill="#ffe08a"/>
            <path d="M124 148 Q150 172 178 148" class="mouthline" stroke-width="5"/>
            <ellipse cx="102" cy="138" rx="11" ry="7" fill="#ff8b9a" opacity=".85"/>
            <ellipse cx="198" cy="138" rx="11" ry="7" fill="#ff8b9a" opacity=".85"/>
          </g>
        </g>
      </svg>
      <div class="meter" id="meter" hidden><i id="meter-fill"></i></div>
    </div>
    <p class="legend"><b class="sym go">○</b> タップ　<b class="sym wait">×</b> 待つ</p>
    <p class="hint" id="hint">合図を見て</p>
    <p class="keys foot">タップ / クリック / Space</p>
  </div>

  <div class="flash" id="flash"></div>
  <div class="boom" id="boom" hidden><strong id="boom-main"></strong></div>
  <p class="sr-only" id="live" aria-live="polite"></p>

  <div class="sheet" id="fail-modal" hidden>
    <div class="card fail">
      <h2>失敗</h2>
      <p class="miss-word" id="fail-word">はずれ！</p>
      <p class="why" id="fail-why"></p>
      <p class="result-progress" id="fail-progress">0 / 7</p>
      <p class="sub" id="fail-score">スコア 0</p>
      <button type="button">もう一度</button>
      <p class="keys">タップ / クリック / Space</p>
    </div>
  </div>

  <div class="sheet" id="clear-modal" hidden>
    <div class="card clear">
      <h2>クリア！</h2>
      <p class="result-progress">7 / 7</p>
      <p class="sub" id="clear-score">スコア 0</p>
      <button type="button">もう一度</button>
      <p class="keys">タップ / クリック / Space</p>
    </div>
  </div>

  <script>
    (function () {
      var GOAL = 7;
      var BEATS = [
        { window: 1600, lead: 920 },
        { window: 1500, lead: 860 },
        { window: 1100, lead: 680 },
        { window: 900, lead: 560 },
        { window: 760, lead: 460 },
        { window: 640, lead: 400 },
        { window: 540, lead: 340 }
      ];
      var REACT_MS = 420;
      var FAIL_MS = 880;

      var phase = "start";
      var streak = 0;
      var score = 0;
      var kind = "go";
      var sign = "blank";
      var mood = "idle";
      var kinds = [];
      var leadMs = BEATS[0].lead;
      var windowMs = BEATS[0].window;
      var phaseAt = 0;
      var failReason = "early";
      var heroClass = "";
      var audioCtx = null;
      var lastAct = 0;
      var reactTimer = 0;

      var shell = document.getElementById("shell");
      var hero = document.getElementById("hero");
      var gate = document.getElementById("gate");
      var progressEl = document.getElementById("progress");
      var scoreEl = document.getElementById("score");
      var pipsEl = document.getElementById("pips");
      var heatEl = document.getElementById("heat");
      var hintEl = document.getElementById("hint");
      var meterEl = document.getElementById("meter");
      var meterFill = document.getElementById("meter-fill");
      var flashEl = document.getElementById("flash");
      var boomEl = document.getElementById("boom");
      var boomMain = document.getElementById("boom-main");
      var liveEl = document.getElementById("live");
      var failModal = document.getElementById("fail-modal");
      var clearModal = document.getElementById("clear-modal");
      var failWord = document.getElementById("fail-word");
      var failWhy = document.getElementById("fail-why");
      var failProgress = document.getElementById("fail-progress");
      var failScore = document.getElementById("fail-score");
      var clearScore = document.getElementById("clear-score");
      var pipEls = [];

      var FAIL_COPY = {
        early: ["まだ！", "合図の前に押した"],
        wrong: ["ちがう！", "× なのに押した"],
        late: ["おくれた！", "○ に間に合わなかった"]
      };

      for (var i = 0; i < GOAL; i++) {
        var pip = document.createElement("i");
        pipsEl.appendChild(pip);
        pipEls.push(pip);
      }

      function progressText(n) {
        return n + " / " + GOAL;
      }

      function planKinds() {
        var rest = ["go", "wait", "go", "wait", "go"];
        var i, j, tmp;
        for (i = rest.length - 1; i > 0; i--) {
          j = Math.floor(Math.random() * (i + 1));
          tmp = rest[i];
          rest[i] = rest[j];
          rest[j] = tmp;
        }
        kinds = ["go", "wait"].concat(rest);
      }

      function tone(freq, dur, type, gain, delay) {
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          var t = audioCtx.currentTime + (delay || 0);
          var o = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          o.type = type;
          o.frequency.value = freq;
          g.gain.setValueAtTime(gain, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(t);
          o.stop(t + dur);
        } catch (err) {}
      }

      function buzz(ms) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (err) {}
      }

      function announce(text) {
        liveEl.textContent = "";
        window.setTimeout(function () { liveEl.textContent = text; }, 20);
      }

      function showBoom(kindName, text) {
        boomEl.className = "boom " + kindName;
        boomMain.textContent = text;
        boomEl.hidden = false;
      }

      function hideBoom() {
        boomEl.hidden = true;
      }

      function pulseFlash(kindName) {
        flashEl.className = "flash " + kindName;
        void flashEl.offsetWidth;
        flashEl.className = "flash " + kindName + " on";
      }

      function render() {
        var playing = phase === "lead" || phase === "signal" || phase === "react";
        var almost = streak >= 5 && phase !== "start";
        var finalPush = streak >= 6 && playing;
        var nextClass = "hero mood-" + mood + " sign-" + sign;
        if (heroClass !== nextClass) {
          heroClass = nextClass;
          hero.setAttribute("class", nextClass);
        }
        document.body.classList.toggle("almost", almost);
        document.body.classList.toggle("final-push", finalPush);
        progressEl.textContent = progressText(streak);
        scoreEl.textContent = String(score);
        gate.hidden = phase !== "start";
        failModal.hidden = phase !== "fail";
        clearModal.hidden = phase !== "clear";
        meterEl.hidden = phase !== "signal";
        heatEl.hidden = !(playing && streak >= 5 && streak < GOAL);
        heatEl.textContent = streak >= 6 ? "あと1" : "あと少し";
        var p;
        for (p = 0; p < GOAL; p++) {
          pipEls[p].className = "";
          if (p < streak) pipEls[p].className = "on";
          else if ((phase === "fail" || phase === "failhold") && p === streak) pipEls[p].className = "bad";
        }
        if (phase === "start") hintEl.textContent = "合図を見て";
        else if (phase === "lead" && streak === 0) hintEl.textContent = "○ を待て";
        else if (phase === "lead" && streak === 1) hintEl.textContent = "× なら待つ";
        else if (phase === "lead" && almost) hintEl.textContent = "あと少し";
        else if (phase === "lead") hintEl.textContent = "合図を見ろ";
        else if (phase === "signal") hintEl.textContent = "読め";
        else if (phase === "clear") hintEl.textContent = "7連続でクリア";
        else if (phase === "fail") hintEl.textContent = FAIL_COPY[failReason][0];
        else hintEl.textContent = "";
        if (phase === "fail") {
          failWord.textContent = FAIL_COPY[failReason][0];
          failWhy.textContent = FAIL_COPY[failReason][1];
          failProgress.textContent = progressText(streak);
          failScore.textContent = "スコア " + score;
        } else if (phase === "clear") {
          clearScore.textContent = "スコア " + score;
        }
      }

      function beginBeat() {
        var spec = BEATS[Math.min(streak, GOAL - 1)];
        kind = kinds[streak];
        sign = "blank";
        mood = streak >= 5 ? "hot" : "idle";
        leadMs = spec.lead;
        windowMs = spec.window;
        phase = "lead";
        phaseAt = performance.now();
        hideBoom();
        announce("待機");
        render();
      }

      function openSignal(now) {
        phase = "signal";
        phaseAt = now;
        sign = kind;
        mood = kind === "go" ? "go" : "wait";
        tone(kind === "go" ? 660 : 440, 0.07, "sine", 0.04);
        announce(kind === "go" ? "まる。タップ" : "ばつ。待つ");
        render();
      }

      function succeed(how) {
        if (phase !== "signal") return;
        phase = "react";
        streak += 1;
        score += 100 * streak;
        sign = how === "wait" ? "wait" : "go";
        mood = "good";
        showBoom("good", how === "wait" ? "待てた！" : "読めた！");
        pulseFlash("good");
        tone(740, 0.08, "square", 0.05);
        tone(980, 0.1, "square", 0.05, 0.08);
        buzz(12);
        render();
        window.clearTimeout(reactTimer);
        reactTimer = window.setTimeout(function () {
          if (streak >= GOAL) {
            phase = "clear";
            mood = "good";
            hideBoom();
            tone(523, 0.08, "square", 0.05);
            tone(659, 0.08, "square", 0.05, 0.09);
            tone(784, 0.08, "square", 0.05, 0.18);
            tone(1046, 0.16, "square", 0.05, 0.27);
            announce("クリア");
            render();
          } else {
            beginBeat();
          }
        }, REACT_MS);
      }

      function fail(reason) {
        if (phase !== "signal" && phase !== "lead") return;
        phase = "failhold";
        failReason = reason;
        mood = "bad";
        showBoom("bad", FAIL_COPY[reason][0]);
        pulseFlash("bad");
        shell.classList.remove("shake");
        void shell.offsetWidth;
        shell.classList.add("shake");
        tone(120, 0.22, "sawtooth", 0.05);
        buzz(40);
        announce("失敗。" + FAIL_COPY[reason][0]);
        render();
        window.clearTimeout(reactTimer);
        reactTimer = window.setTimeout(function () {
          phase = "fail";
          hideBoom();
          render();
        }, FAIL_MS);
      }

      function resolveWindow() {
        if (phase !== "signal") return;
        if (kind === "go") fail("late");
        else succeed("wait");
      }

      function startRun() {
        window.clearTimeout(reactTimer);
        streak = 0;
        score = 0;
        planKinds();
        hideBoom();
        flashEl.className = "flash";
        shell.classList.remove("shake");
        beginBeat();
      }

      function act(e) {
        if (e && e.target && e.target.closest && e.target.closest("a")) return;
        var now = performance.now();
        if (now - lastAct < 90) return;
        lastAct = now;
        if (phase === "start" || phase === "fail" || phase === "clear") {
          startRun();
          return;
        }
        if (phase === "lead") {
          fail("early");
          return;
        }
        if (phase === "signal") {
          if (kind === "go") succeed("go");
          else fail("wrong");
        }
      }

      function frame(now) {
        requestAnimationFrame(frame);
        if (phase === "lead" && now >= phaseAt + leadMs) {
          openSignal(now);
          return;
        }
        if (phase === "signal") {
          var p = 1 - (now - phaseAt) / windowMs;
          if (p < 0) p = 0;
          meterFill.style.transform = "scaleX(" + p + ")";
          meterEl.classList.toggle("urgent", p < 0.34);
          if (now >= phaseAt + windowMs) resolveWindow();
        }
      }

      document.addEventListener("pointerdown", function (e) {
        if (e.button !== 0) return;
        var t = e.target;
        if (t && typeof t.closest === "function" && t.closest("a")) return;
        e.preventDefault();
        act(e);
      }, { passive: false });

      document.addEventListener("keydown", function (e) {
        if (e.code !== "Space" && e.key !== " ") return;
        if (e.repeat) return;
        e.preventDefault();
        act(e);
      });

      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });

      document.addEventListener("touchmove", function (e) {
        e.preventDefault();
      }, { passive: false });

      window.__signalRead = {
        getState: function () {
          return {
            phase: phase,
            streak: streak,
            score: score,
            kind: kind,
            sign: sign,
            mood: mood,
            goal: GOAL,
            kinds: kinds.slice(),
            leadMs: leadMs,
            windowMs: windowMs,
            almost: document.body.classList.contains("almost")
          };
        }
      };

      render();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
