      return function () {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        var t0 = Math.imul(a ^ (a >>> 15), 1 | a);
        t0 = (t0 + Math.imul(t0 ^ (t0 >>> 7), 61 | t0)) ^ t0;

    function setMood(m) {

    function extremes(spec) {

      var seen = {};
      ps.forEach(function (p) {

    }
    function audit() {
      var problems = [];
      var i, ai, bi;
      if (ROUNDS.length !== 6) problems.push("round count");
      for (i = 0; i < ROUNDS.length - 1; i++) {
        if (!(ROUNDS[i + 1].time[1] < ROUNDS[i].time[0])) problems.push("time slope " + i);
        var A = extremes(ROUNDS[i]);
        var B = extremes(ROUNDS[i + 1]);
        for (ai = 0; ai < A.length; ai++) {
          for (bi = 0; bi < B.length; bi++) {
            var a = A[ai], b = B[bi];
            if (!(b.peas > a.peas || b.time < a.time || b.crowd > a.crowd)) {

      }
      if (!ROUNDS[0].practice) problems.push("r1 practice");
      if (ROUNDS[0].foodCount[1] !== 0 || ROUNDS[0].decoyCount[1] !== 0) problems.push("r1 empty");
      if (!(ROUNDS[2].peas[1] < ROUNDS[1].peas[0])) problems.push("r3 fewer peas");
      if (ROUNDS[2].decoyKinds.join(",") !== "edamame") problems.push("r3 edamame only");
      if (ROUNDS[1].decoyCount[1] !== 0) problems.push("r2 no decoy");
      if (ROUNDS[1].foodCount[0] < 4) problems.push("r2 crowd");
      var c4min = ROUNDS[3].peas[0] + ROUNDS[3].foodCount[0] + ROUNDS[3].decoyCount[0];
      var c4max = ROUNDS[3].peas[1] + ROUNDS[3].foodCount[1] + ROUNDS[3].decoyCount[1];
      var c5max = ROUNDS[4].peas[1] + ROUNDS[4].foodCount[1] + ROUNDS[4].decoyCount[1];
      var c6min = ROUNDS[5].peas[0] + ROUNDS[5].foodCount[0] + ROUNDS[5].decoyCount[0];
      if (!(c5max < c4min)) problems.push("r5 fewer items");
      if (ROUNDS[3].motion || !ROUNDS[4].motion || !ROUNDS[5].motion) problems.push("motion intro");
      if (!(ROUNDS[5].motion.freq[0] > ROUNDS[4].motion.freq[1])) problems.push("r6 faster");
      if (!(ROUNDS[5].motion.slide[0] > ROUNDS[4].motion.slide[1])) problems.push("r6 bigger slide");
      if (!(ROUNDS[5].motion.rot[0] > ROUNDS[4].motion.rot[1])) problems.push("r6 bigger rot");
      if (!(c6min > c4max)) problems.push("r6 most crowded");
      for (i = 0; i < 5; i++) {
        if (!(ROUNDS[5].time[1] < ROUNDS[i].time[0])) problems.push("r6 time vs " + i);
        if (ROUNDS[i].motion && i < 4) problems.push("early motion " + i);
      }
      if (ROUNDS[3].decoyKinds.indexOf("edamame") < 0 || ROUNDS[3].decoyKinds.indexOf("mint") < 0) problems.push("r4 both decoys");
      return { ok: problems.length === 0, problems: problems };
    }

    function pickKinds(rng, kinds, count) {
      var out = [];
      if (!kinds.length || count <= 0) return out;
      for (var i = 0; i < count; i++) out.push(kinds[Math.floor(rng() * kinds.length)]);
      return out;
    }
    function placeKinds(rng, kinds, b) {
      var n = Math.max(1, kinds.length);
      var area = Math.max(40, (b.hw - b.rim) * 2) * Math.max(40, (b.hh - b.rim) * 2);
      var ideal = Math.sqrt(area / (n * 7.2));
      ideal = clamp(ideal, 13, 22);
      var r, placed;
      for (r = ideal; r >= 12; r -= 1) {
        placed = relax(rng, kinds, b, r);
        if (placed) return placed;
      }
      return forceGrid(kinds, b, 13);
    }
    function relax(rng, kinds, b, r) {
      var innerX = b.hw - b.rim - r - 3;
      var innerY = b.hh - b.rim - r - 3;
      if (innerX < 8 || innerY < 8) return null;
      var pts = kinds.map(function (k) {
        return { kind: k, nx: rng() * 2 - 1, ny: rng() * 2 - 1, r: r, spin: rng() * Math.PI * 2 };
      });
      var iter, i, j, ok;
      for (iter = 0; iter < 70; iter++) {
        ok = true;
        for (i = 0; i < pts.length; i++) {
          for (j = i + 1; j < pts.length; j++) {
            var dx = (pts[j].nx - pts[i].nx) * innerX;
            var dy = (pts[j].ny - pts[i].ny) * innerY;
            var dist = Math.hypot(dx, dy) || 0.001;
            var min = pts[i].r + pts[j].r + 2;
            if (dist < min) {
              ok = false;
              var push = (min - dist) / 2;
              var nx = dx / dist;
              var ny = dy / dist;
              pts[i].nx -= (nx * push) / innerX;
              pts[i].ny -= (ny * push) / innerY;
              pts[j].nx += (nx * push) / innerX;
              pts[j].ny += (ny * push) / innerY;
            }
          }
          pts[i].nx = clamp(pts[i].nx, -1, 1);
          pts[i].ny = clamp(pts[i].ny, -1, 1);
        }
        if (ok && iter > 10) return pts;
      }
      for (i = 0; i < pts.length; i++) {
        for (j = i + 1; j < pts.length; j++) {
          var ddx = (pts[j].nx - pts[i].nx) * innerX;
          var ddy = (pts[j].ny - pts[i].ny) * innerY;
          if (Math.hypot(ddx, ddy) < pts[i].r + pts[j].r - 0.5) return null;
        }
      }
      return pts;
    }
    function forceGrid(kinds, b, r) {
      var cols = Math.ceil(Math.sqrt(kinds.length));
      var rows = Math.ceil(kinds.length / cols);
      return kinds.map(function (k, i) {
        var c = i % cols;
        var row = Math.floor(i / cols);
        return {
          kind: k,
          nx: cols === 1 ? 0 : (c / (cols - 1)) * 2 - 1,
          ny: rows === 1 ? 0 : (row / (rows - 1)) * 2 - 1,
          r: r,
          spin: 0
        };
      });
    }
    function build(spec, rng, b) {
      var peas = randInt(rng, spec.peas[0], spec.peas[1]);
      var foodN = randInt(rng, spec.foodCount[0], spec.foodCount[1]);
      var decoyN = randInt(rng, spec.decoyCount[0], spec.decoyCount[1]);
      var tenths = randInt(rng, spec.time[0], spec.time[1]);
      var foods = pickKinds(rng, spec.foodKinds, foodN);
      var decoys = pickKinds(rng, spec.decoyKinds, decoyN);
      var kinds = [];
      var i;
      for (i = 0; i < peas; i++) kinds.push("pea");
      for (i = 0; i < foods.length; i++) kinds.push(foods[i]);
      for (i = 0; i < decoys.length; i++) kinds.push(decoys[i]);
      shuffle(rng, kinds);
      var motionOut = null;
      if (spec.motion) {
        motionOut = {
          slide: randInt(rng, spec.motion.slide[0], spec.motion.slide[1]) / 100,
          rot: randInt(rng, spec.motion.rot[0], spec.motion.rot[1]) / 100,
          freq: randInt(rng, spec.motion.freq[0], spec.motion.freq[1]) / 100,
          dir: rng() < 0.5 ? -1 : 1,
          phase: rng() * Math.PI * 2,
          phaseY: rng() * Math.PI * 2,
          phaseR: rng() * Math.PI * 2
        };
      }
      return {
        peas: peas,
        foods: foods.slice(),
        decoys: decoys.slice(),
        time: tenths / 10,
        timeTenths: tenths,
        crowd: kinds.length,
        motion: motionOut,
        items: placeKinds(rng, kinds, b)
      };
    }

    function ensureLayout() {
      var rect = stage.getBoundingClientRect();
      var w = rect.width;
      var h = rect.height;
      if (w < 20 || h < 20) { w = 360; h = 520; }
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      view.w = w;
      view.h = h;
      view.dpr = dpr;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      var fit = current && current.fit ? current.fit : 0.9;
      var geom = computeLayout(w, h, fit);
      box = geom.box;
      layoutDragon = geom.dragon;
      roomX = Math.max(0, Math.min(box.cx - box.hw - 4, w - (box.cx + box.hw) - 4));
      roomY = Math.max(0, Math.min(box.cy - box.hh - 4, h - (box.cy + box.hh) - 4));
    }
    function computeLayout(w, h, fit) {
      var rim = 12;
      var landscape = w > h * 1.2;
      if (landscape) {
        var dw = Math.min(w * 0.32, 210);
        var maxW = (w - dw - 18) * Math.min(1, fit + 0.08);
        var maxH = (h - 8) * Math.min(1, fit + 0.12);
        var boxW = Math.min(maxW, maxH * 1.4);
        var boxH = Math.min(maxH, boxW / 1.08);
        var cx = dw + 12 + boxW / 2;
        var cy = h / 2;
        var sL = clamp((h - 10) / 158, 0.42, 0.78);
        var dragonY = 6 + 142 * sL;
        return {
          dragon: { x: Math.max(40, dw * 0.46), y: dragonY, s: sL },
          box: { cx: cx, cy: cy, hw: boxW / 2, hh: boxH / 2, rim: rim }
        };
      }
      var dragonBudget = clamp(h * 0.28, 78, 150);
      var availH = Math.max(120, h - dragonBudget + 8);
      var boxW = Math.min((w - 16) * fit, availH * 1.35);
      var boxH = Math.min(availH * 0.92, boxW / 1.25);
      var cxp = w / 2;
      var cyp = dragonBudget + (h - dragonBudget) * 0.52;
      cyp = clamp(cyp, boxH / 2 + 4, h - boxH / 2 - 4);
      var boxTop = cyp - boxH / 2;
      var s = clamp(Math.min((boxTop - 8) / 130, boxW / 240), 0.55, 1.12);
      var dragonY = boxTop + 6;
      if (dragonY - 142 * s < 2) s = Math.max(0.48, (dragonY - 2) / 142);
      return {
        dragon: { x: w * 0.5, y: dragonY, s: s },
        box: { cx: cxp, cy: cyp, hw: boxW / 2, hh: boxH / 2, rim: rim }
      };
    }

    function currentPose() {
      if (!motion) return { ox: 0, oy: 0, rot: 0 };
      var ampX = roomX * motion.slide;
      var ampY = roomY * motion.slide * 0.65;
      var ox = Math.sin(t * motion.freq + motion.phase) * ampX * motion.dir;
      var oy = Math.cos(t * motion.freq * 0.73 + motion.phaseY) * ampY;
      var rot = Math.sin(t * motion.freq * 0.81 + motion.phaseR) * motion.rot * motion.dir;
      return { ox: ox, oy: oy, rot: rot };
    }
    function localToWorld(lx, ly, pose, b) {
      var c = Math.cos(pose.rot);
      var s = Math.sin(pose.rot);
      return { x: b.cx + pose.ox + lx * c - ly * s, y: b.cy + pose.oy + lx * s + ly * c };
    }
    function worldToLocal(x, y, pose, b) {
      var dx = x - (b.cx + pose.ox);
      var dy = y - (b.cy + pose.oy);
      var c = Math.cos(pose.rot);
      var s = Math.sin(pose.rot);
      return { x: dx * c + dy * s, y: -dx * s + dy * c };
    }
    function innerLimits(it) {
      return {
        x: Math.max(6, box.hw - box.rim - it.r - 2),
        y: Math.max(6, box.hh - box.rim - it.r - 2)
      };
    }
    function applyLocal(it) {
      var lim = innerLimits(it);
      it.lx = it.nx * lim.x;
      it.ly = it.ny * lim.y;
    }
    function syncResting() {
      var pose = currentPose();
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.loose || it.out) continue;
        applyLocal(it);
        var w = localToWorld(it.lx, it.ly, pose, box);
        it.x = w.x;
        it.y = w.y;
        it.vx = 0;
        it.vy = 0;
      }
    }
    function isOutside(it, pose) {
      var loc = worldToLocal(it.x, it.y, pose, box);
      return Math.abs(loc.x) > box.hw - box.rim || Math.abs(loc.y) > box.hh - box.rim;
    }
    function reattach(it, pose) {
      var loc = worldToLocal(it.x, it.y, pose, box);
      var lim = innerLimits(it);
      it.nx = clamp(loc.x / lim.x, -1, 1);
      it.ny = clamp(loc.y / lim.y, -1, 1);
      it.loose = false;
      it.vx = 0;
      it.vy = 0;
      applyLocal(it);
    }

    function collide(a, b) {
      if (a.out || b.out) return;
      if (!a.loose && !b.loose) return;
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      var dist = Math.hypot(dx, dy) || 0.0001;
      var min = a.r + b.r;
      if (dist >= min) return;
      var nx = dx / dist;
      var ny = dy / dist;
      if (a.loose && b.loose) {
        var overlap = min - dist;
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;
        var rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rel < 0) return;
        var impulse = rel * 0.86;
        a.vx -= impulse * nx;
        a.vy -= impulse * ny;
        b.vx += impulse * nx;
        b.vy += impulse * ny;
        return;
      }
      var loose = a.loose ? a : b;
      var rest = a.loose ? b : a;
      var lx = rest.x - loose.x;
      var ly = rest.y - loose.y;
      var ld = Math.hypot(lx, ly) || 0.0001;
      var nnx = lx / ld;
      var nny = ly / ld;
      var lov = (loose.r + rest.r) - ld;
      if (lov > 0) {
        loose.x -= nnx * lov;
        loose.y -= nny * lov;
      }
      var approach = loose.vx * nnx + loose.vy * nny;
      if (approach > DETACH_SPEED) {
        var knock = approach * 0.82;
        loose.vx -= knock * nnx;
        loose.vy -= knock * nny;
        rest.loose = true;
        rest.vx = knock * 0.78 * nnx;
        rest.vy = knock * 0.78 * nny;
      }
    }
    function physics(dt) {
      t += dt;
      var pose = currentPose();
      var i, j, it;
      for (i = 0; i < items.length; i++) {
        it = items[i];
        if (it.out || it.loose) continue;
        applyLocal(it);
        var w = localToWorld(it.lx, it.ly, pose, box);
        it.x = w.x;
        it.y = w.y;
        it.vx = 0;
        it.vy = 0;
      }
      var damp = Math.exp(-DAMP * dt);
      for (i = 0; i < items.length; i++) {
        it = items[i];
        if (!it.loose || it.out) continue;
        it.vx *= damp;
        it.vy *= damp;
        it.x += it.vx * dt;
        it.y += it.vy * dt;
      }
      for (i = 0; i < items.length; i++) {
        for (j = i + 1; j < items.length; j++) collide(items[i], items[j]);
      }
      for (i = 0; i < items.length; i++) {
        it = items[i];
        if (!it.loose || it.out) continue;
        if (isOutside(it, pose)) {
          it.out = true;
          it.justOut = true;
          it.fade = it.kind === "pea" ? 0.5 : 999;
        } else if (Math.hypot(it.vx, it.vy) < STOP_SPEED) {
          reattach(it, pose);
        }
      }
    }

    function burst(x, y) {
      for (var i = 0; i < 12; i++) {
        var a = (Math.PI * 2 * i) / 12 + Math.random() * 0.2;
        var sp = 80 + Math.random() * 110;
        sparkles.push({
          x: x, y: y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 0.45,
          max: 0.45,
          color: i % 2 ? "#fff6b0" : "#c8ff7a",
          rot: Math.random() * 6

      }
    }
    function flash() {
      flashEl.classList.remove("on");
      void flashEl.offsetWidth;
      flashEl.classList.add("on");
    }
    function decayVisuals(dt) {
      var i;
      for (i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.highlight > 0 && it.highlight < 100) it.highlight -= dt;
        if (it.mark > 0 && it.mark < 100) it.mark -= dt;
        if (it.fade > 0 && it.fade < 100) {

          it.x += it.vx * dt * 0.35;

      for (i = 0; i < sparkles.length; i++) {

    function updateUrgency() {

    function maybeRefreshSay() {

    var urgentSaid = false;

    function failRound(text) {

    function winRound() {

    function resolveFrame() {
      var bad = null;
      var i;
      for (i = 0; i < items.length; i++) {
        var it = items[i];
        if (!it.justOut) continue;
        it.justOut = false;
        if (it.kind === "pea") {
          cue("pop");
          cue("sparkle");
          burst(it.x, it.y);
          popSound();
        } else {
          it.highlight = 999;
          if (!bad) bad = it;
        }
      }
      if (bad) {
        cue("buzz");
        cue("flash");
        cue("highlight");
        flash();
        buzzSound();
        try { navigator.vibrate(40); } catch (err) {}
        failRound(FOOD_NAME[bad.kind] + "が落ちた！");
        return;
      }
      if (peasLeft() === 0 && !hasLooseNonPea() && !anyBadOut()) {

        return;

    function flickVector(samples) {

      c.restore();
    }
    function drawItem(c, it) {
      c.save();
      c.translate(it.x, it.y);
      c.rotate(it.spin || 0);
      var r = it.r;
      if (it.kind === "pea") {
        c.fillStyle = "#2f9e3a";
        c.beginPath();
        c.arc(0, 0, r, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = "#5ee06a";
        c.beginPath();
        c.arc(-r * 0.08, -r * 0.06, r * 0.72, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = "rgba(255,255,255,.9)";
        c.beginPath();
        c.arc(-r * 0.32, -r * 0.36, r * 0.22, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = "#1c7a30";
        c.lineWidth = Math.max(1.2, r * 0.1);
        c.beginPath();
        c.arc(0, 0, r * 0.42, 0.2, 1.5);
        c.stroke();
      } else if (it.kind === "edamame") {
        c.fillStyle = "#6f8f2e";
        c.beginPath();
        c.ellipse(-r * 0.32, 0, r * 0.55, r * 0.42, -0.2, 0, Math.PI * 2);
        c.ellipse(r * 0.32, 0, r * 0.55, r * 0.42, 0.2, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = "#3d5a18";
        c.lineWidth = 2;
        c.stroke();
        c.strokeStyle = "#dfe8b0";
        c.beginPath();
        c.moveTo(-r * 0.7, 0);
        c.quadraticCurveTo(0, -r * 0.2, r * 0.7, 0);
        c.stroke();
        c.strokeStyle = "#3d5a18";
        c.beginPath();
        c.moveTo(r * 0.7, 0);
        c.lineTo(r * 1.05, -r * 0.35);
        c.stroke();
      } else if (it.kind === "mint") {
        c.fillStyle = "#14b39a";
        roundRect(c, -r * 0.82, -r * 0.82, r * 1.64, r * 1.64, r * 0.28);
        c.fill();
        c.strokeStyle = "#0c6d62";
        c.lineWidth = 2;
        c.stroke();
        c.strokeStyle = "rgba(255,255,255,.85)";
        c.lineWidth = Math.max(2, r * 0.16);
        c.beginPath();
        c.arc(0, 0, r * 0.28, 0.4, 4.2);
        c.stroke();
        c.fillStyle = "rgba(255,255,255,.35)";
        c.beginPath();
        c.moveTo(-r * 0.82, -r * 0.1);
        c.lineTo(-r * 1.15, -r * 0.35);
        c.lineTo(-r * 1.15, r * 0.2);
        c.closePath();
        c.fill();
      } else if (it.kind === "corn") {
        c.fillStyle = "#f2c230";
        roundRect(c, -r * 0.7, -r * 0.85, r * 1.4, r * 1.7, r * 0.4);
        c.fill();
        c.fillStyle = "#ffe27a";
        for (var cy = -1; cy <= 1; cy++) {
          for (var cx = -1; cx <= 1; cx++) {
            c.beginPath();
            c.arc(cx * r * 0.32, cy * r * 0.38, r * 0.16, 0, Math.PI * 2);
            c.fill();
          }
        }
      } else if (it.kind === "rice") {
        c.fillStyle = "#fffaf2";
        c.strokeStyle = "#e4d3b4";
        c.lineWidth = 1.5;
        c.beginPath();
        c.ellipse(0, 0, r * 0.55, r * 0.38, 0.4, 0, Math.PI * 2);
        c.ellipse(-r * 0.4, r * 0.15, r * 0.48, r * 0.32, -0.4, 0, Math.PI * 2);
        c.ellipse(r * 0.38, r * 0.2, r * 0.46, r * 0.3, 0.2, 0, Math.PI * 2);
        c.fill();
        c.stroke();
      } else if (it.kind === "carrot") {
        c.fillStyle = "#f07a22";
        c.beginPath();
        c.moveTo(0, -r);
        c.lineTo(r * 0.7, r * 0.75);
        c.lineTo(-r * 0.7, r * 0.75);
        c.closePath();
        c.fill();
        c.fillStyle = "#3aaa4a";
        c.beginPath();
        c.moveTo(0, -r);
        c.lineTo(-r * 0.45, -r * 1.15);
        c.lineTo(0, -r * 0.7);
        c.lineTo(r * 0.4, -r * 1.2);
        c.closePath();
        c.fill();
      } else if (it.kind === "egg") {
        c.fillStyle = "#f6d35b";
        roundRect(c, -r, -r * 0.7, r * 2, r * 1.4, r * 0.3);
        c.fill();
        c.fillStyle = "#e7b53a";
        c.fillRect(-r, -r * 0.15, r * 2, r * 0.28);
        c.fillRect(-r, r * 0.28, r * 2, r * 0.22);
      }
      c.restore();
      if (it.highlight > 0) {
        var pulse = 1 + Math.sin(animT * 16) * 0.08;
        c.strokeStyle = "#ff2a2a";
        c.lineWidth = 4;
        c.beginPath();
        c.arc(it.x, it.y, (it.r + 6) * pulse, 0, Math.PI * 2);
        c.stroke();
      } else if (it.mark > 0) {
        c.strokeStyle = "#e6a100";
        c.lineWidth = 3;
        c.beginPath();
        c.arc(it.x, it.y, it.r + 5, 0, Math.PI * 2);
        c.stroke();
      }
    }
    function drawSparkles(c) {
      for (var i = 0; i < sparkles.length; i++) {
        var s = sparkles[i];
        c.globalAlpha = Math.max(0, s.life / s.max);
        c.fillStyle = s.color;
        c.save();
        c.translate(s.x, s.y);
        c.rotate(s.rot + animT * 6);
        c.beginPath();
        c.moveTo(0, -6);
        c.lineTo(2, -2);
        c.lineTo(6, 0);
        c.lineTo(2, 2);
        c.lineTo(0, 6);
        c.lineTo(-2, 2);
        c.lineTo(-6, 0);
        c.lineTo(-2, -2);
        c.closePath();
        c.fill();
        c.restore();
        c.globalAlpha = 1;
      }
    }
    function drawArrow(c) {
      if (!drag) return;
      var it = findId(drag.id);
      if (!it) return;
      var last = drag.samples[drag.samples.length - 1];
      var dx = last.x - it.x;
      var dy = last.y - it.y;
      var dist = Math.hypot(dx, dy) || 1;
      var len = drag.preview ? clamp(drag.preview.speed / 12, 36, 90) : clamp(dist, 12, 36);
      var ok = !!drag.preview;
      c.strokeStyle = ok ? "#1f8a3d" : "rgba(80,60,40,.45)";
      c.fillStyle = c.strokeStyle;
      c.lineWidth = ok ? 4 : 2;
      c.beginPath();
      c.moveTo(it.x, it.y);
      c.lineTo(it.x + (dx / dist) * len, it.y + (dy / dist) * len);
      c.stroke();
    }
    function drawScene(closed) {
      var pose = currentPose();
      drawTable(ctx);
      drawDragon(ctx, layoutDragon.x, layoutDragon.y, layoutDragon.s, mood, animT);
      drawPlacemat(ctx);
      drawBento(ctx, pose, closed);
      if (!closed) {
        var list = items.filter(function (it) { return !it.out || it.fade > 0 || it.highlight > 0; });
        list.sort(function (a, b) { return a.y - b.y; });
        for (var i = 0; i < list.length; i++) {
          ctx.save();
          ctx.globalAlpha = list[i].out && list[i].fade < 100 ? Math.max(0.25, list[i].fade / 0.5) : 1;
          ctx.fillStyle = "rgba(80,40,10,.16)";
          ctx.beginPath();
          ctx.ellipse(list[i].x, list[i].y + list[i].r * 0.7, list[i].r * 0.7, list[i].r * 0.25, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          drawItem(ctx, list[i]);
        }
        drawSparkles(ctx);
        drawArrow(ctx);
      }
    }
    function drawMini(el, m) {
      if (!el) return;
      var overlay = el.closest(".overlay");
      if (overlay && overlay.hidden) return;
      var w = el.clientWidth;
      var h = el.clientHeight;
      if (w < 4 || h < 4) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var c = el.getContext("2d");
      if (el.width !== Math.round(w * dpr) || el.height !== Math.round(h * dpr)) {
        el.width = Math.round(w * dpr);
        el.height = Math.round(h * dpr);
      }
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, w, h);
      drawDragon(c, w / 2, h * 0.95, Math.min(w / 140, h / 120), m, animT);
    }
    function draw() {
      ensureLayout();
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.clearRect(0, 0, view.w, view.h);
      if (phase === "title") drawScene(true);
      else drawScene(false);
      drawMini(titleDragon, "worried");
      if (!endEl.hidden) drawMini(endDragon, mood);
    }
    function frame(now) {
      if (!lastNow) lastNow = now;
      var dt = Math.min(0.05, (now - lastNow) / 1000);
      lastNow = now;
      animT += dt;
      if (!manual && phase !== "title") advance(dt);
      if ((phase === "play" || phase === "clear" || phase === "failflash") && items.length) syncRestingIdle();
      draw();
      requestAnimationFrame(frame);
    }
    function syncRestingIdle() {
      if (phase === "play") return;
      syncResting();
    }

    function place(list) {
      ensureLayout();
      var pose = currentPose();
      items = list.map(function (src, i) {
        var r = src.r || 16;
        var limX = Math.max(6, box.hw - box.rim - r - 2);
        var limY = Math.max(6, box.hh - box.rim - r - 2);
        var loc = worldToLocal(src.x, src.y, pose, box);
        var it = {
          id: i + 1,
          kind: src.kind,
          r: r,
          nx: loc.x / limX,
          ny: loc.y / limY,
          lx: 0, ly: 0,
          x: src.x, y: src.y,
          vx: src.vx || 0,
          vy: src.vy || 0,
          spin: src.spin || 0,
          loose: !!src.loose,
          out: false,
          justOut: false,
          highlight: 0,
          mark: 0,
          fade: 0
        };
        if (!it.loose) {
          applyLocal(it);
          var w = localToWorld(it.lx, it.ly, pose, box);
          it.x = w.x;
          it.y = w.y;
        }
        return it;
      });
    }
    function snapshot() {
      return {
        phase: phase,
        hearts: hearts,
        misses: misses,
        cleared: cleared,
        reached: reached,
        round: roundIndex + 1,
        roundId: current ? current.id : 0,
        practice: !!(current && current.practice),
        peas: peasLeft(),
        timeLeft: timeLeft,
        timeMax: timeMax,
        mood: mood,
        say: sayText.textContent,
        nums: numsEl.textContent,
        left: leftEl.textContent,
        note: noteEl.textContent,
        roundLabel: roundLabelEl.textContent,
        cues: cueLog.slice(),
        sparkles: sparkles.length,
        flash: flashEl.classList.contains("on"),
        urgent: timebar.classList.contains("urgent"),
        items: items.map(function (it) {
          return { id: it.id, kind: it.kind, x: it.x, y: it.y, r: it.r, out: it.out, loose: it.loose, highlight: it.highlight, nx: it.nx, ny: it.ny };
        }),
        box: { cx: box.cx, cy: box.cy, hw: box.hw, hh: box.hh, rim: box.rim },
        motion: motion ? { slide: motion.slide, rot: motion.rot, freq: motion.freq, dir: motion.dir, phase: motion.phase } : null,
        rank: rankFor(cleared, misses, reached),
        cause: endCause,
        failText: failText.textContent,
        failSub: failSub.textContent,
        titleOpen: !titleEl.hidden,
        endOpen: !endEl.hidden
      };
    }

    document.getElementById("btn-start").addEventListener("click", function () {
      ensureAudio();
      newRun();
    });
    document.getElementById("btn-fail").addEventListener("click", function () {
      ensureAudio();
      continueAfterFail();
    });
    document.getElementById("btn-retry").addEventListener("click", function () {
      ensureAudio();
      newRun();
    });
    muteBtn.addEventListener("click", function () {
      muted = !muted;
      applyMute();
      if (!muted) ensureAudio();
    });
    canvas.addEventListener("pointerdown", onDown, { passive: false });
    canvas.addEventListener("pointermove", onMove, { passive: false });
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    window.addEventListener("resize", function () {
      ensureLayout();
      if (phase === "play" || phase === "clear" || phase === "failflash") syncResting();
    });
    window.addEventListener("keydown", function (e) {
      if (e.code === "Space") e.preventDefault();
    });

    updateHearts(false);
    setMood("worried");
    setSay("緑の豆が残ってると、食べられない。");
    applyMute();
    window.__pea = {
      audit: audit,
      sample: function (i, seed) { return build(ROUNDS[i], mulberry32(seed >>> 0), SAMPLE_BOX); },
      newRun: newRun,
      loadRound: loadRound,
      setManual: function (v) { manual = !!v; },
      step: function (sec) { advance(sec); },
      state: snapshot,
      place: place,
      flick: function (index, vx, vy) { launch(items[index], vx, vy); },
      gesture: flickVector,
      applyGesture: applyGesture,
      setTime: function (sec) { timeLeft = sec; },
      continueFail: continueAfterFail,
      rankFor: rankFor,
      RANK_LINE: RANK_LINE
    };
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
