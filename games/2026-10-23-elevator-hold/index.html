    function dealSpecies(n) {
      var pool = ["usagi", "neko", "kuma", "tori", "kaeru", "panda"];
      var i;
      for (i = pool.length - 1; i > 0; i--) {
        var j = (Math.random() * (i + 1)) | 0;
        var tmp = pool[i];
        pool[i] = pool[j];
        pool[j] = tmp;
      }
      var out = [];
      for (i = 0; i < n; i++) out.push(pool[i % pool.length]);
      return out;
    }

    function buildSchedule(i) {
      var specs = [];
      var sp = dealSpecies(4);
      function add(delay, kind, side, speed) {
        specs.push({
          delay: delay,
          kind: kind,
          side: side,
          speed: speed,
          species: sp[specs.length % sp.length],
          spawned: false
        });
      }
      var left = Math.random() < 0.5;
      var sA = left ? -1 : 1;
      var sB = -sA;
      if (i === 0) {
        add(0.32, "real", sA, rand(34, 42));
        add(rand(2.0, 2.6), "pass", sB, rand(40, 50));
      } else if (i === 1) {
        add(0.28, "real", sA, rand(52, 62));
      } else if (i === 2) {
        var realFirst = Math.random() < 0.5;
        add(realFirst ? 0.26 : rand(1.35, 1.85), "real", sA, rand(64, 78));
        add(realFirst ? rand(0.85, 1.3) : 0.24, "pass", sB, rand(58, 72));
      } else if (i === 3) {
        add(0.24, "phone", sA, rand(60, 74));
        add(rand(1.7, 2.3), "real", sB, rand(72, 86));
      } else if (i === 4) {
        add(0.24, "real", -1, rand(90, 108));
        add(rand(1.55, 2.15), "real", 1, rand(88, 106));
      } else if (i === 5) {
        add(0.22, "turn", sA, rand(80, 96));
        add(rand(1.65, 2.25), "real", sB, rand(100, 118));
      } else if (i === 6) {
        add(0.2, "real", -1, rand(112, 132));
        add(rand(1.35, 1.95), "real", 1, rand(108, 128));
        add(rand(0.4, 0.8), Math.random() < 0.5 ? "pass" : "phone", Math.random() < 0.5 ? -1 : 1, rand(64, 80));
      } else {
        add(0.18, "pass", sA, rand(150, 180));
        add(rand(4.15, 4.7), "dash", sB, rand(200, 230));
      }
      return specs;
    }

    function isRealKind(kind) { return kind === "real" || kind === "dash"; }

    function spawnActor(spec) {
      var fromLeft = spec.side < 0;
      var a = {
        kind: spec.kind,
        real: isRealKind(spec.kind),
        side: spec.side,
        dir: fromLeft ? 1 : -1,
        x: fromLeft ? -24 : LW + 24,
        y: HALL_FEET,
        speed: spec.speed,
        species: spec.species,
        state: "walk",
        t: 0,
        enterT: 0,
        waitT: 0,
        pauseLeft: 0,
        pauseDur: spec.kind === "phone" ? rand(1.05, 1.4) : rand(0.24, 0.4),
        say: spec.kind === "dash" ? "まって！" : "",
        sayT: spec.kind === "dash" ? 1 : 0,
        bow: 0,
        fromX: 0,
        slotX: 120,
        tried: false,
        seed: Math.random() * 10
      };
      actors.push(a);
    }

    function realOnField() {

      }
      return false;
    }
    function realQueued() {
      var i;
      for (i = 0; i < schedule.length; i++) {
        if (!schedule[i].spawned && isRealKind(schedule[i].kind)) return true;

    function outstanding() { return realOnField() || realQueued(); }

        var d = Math.abs(a.x - CX);
        if (d < bestD) { bestD = d; best = a; }

    }

    function audioGesture() {
      if (muted) return null;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        if (!ac) {
          ac = new AC();
          master = ac.createGain();
          master.gain.value = 0.8;
          master.connect(ac.destination);
        }
        if (ac.state === "suspended") ac.resume();
        return ac;
      } catch (err) {
        return null;
      }
    }
    function tone(freqHz, dur, type, vol, delay) {
      if (!ac || muted || !master) return;
      try {
        var t = ac.currentTime + (delay || 0);
        var osc = ac.createOscillator();
        var gain = ac.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freqHz, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain);
        gain.connect(master);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      } catch (err) { /* ignore */ }
    }
    function noiseBuffer() {
      if (!ac) return null;
      if (noiseBuf) return noiseBuf;
      var len = ac.sampleRate;
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var data = buf.getChannelData(0);
      var b0 = 0;
      var n;
      for (n = 0; n < len; n++) {
        var white = Math.random() * 2 - 1;
        b0 = 0.97 * b0 + 0.03 * white;
        data[n] = b0 * 3;
      }
      noiseBuf = buf;
      return buf;
    }
    function burstNoise(freqHz, dur, vol) {
      if (!ac || muted || !master) return;
      try {
        var t = ac.currentTime;
        var src = ac.createBufferSource();
        src.buffer = noiseBuffer();
        var filter = ac.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(freqHz, t);
        filter.Q.value = 0.8;
        var gain = ac.createGain();
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        src.start(t);
        src.stop(t + dur + 0.02);
      } catch (err) { /* ignore */ }
    }

    function beginEnter(a) {
      a.state = "enter";
      a.enterT = 0;
      a.fromX = a.x;
      a.slotX = 112 + slotCursor * 34;
      if (a.slotX > 180) a.slotX = 112 + (slotCursor % 3) * 30;
      slotCursor += 1;
      a.tried = true;
    }

    function updateActor(a, dt) {
      a.t += dt;
      if (a.sayT > 0) a.sayT -= dt;
      if (a.bow > 0) a.bow -= dt;
      if (a.state === "gone" || a.state === "in" || a.state === "caught") return;

      if (a.state === "enter") {
        a.enterT += dt;
        var k = clamp(a.enterT / ENTER_TIME, 0, 1);
        var ease = k * k * (3 - 2 * k);
        a.x = lerp(a.fromX, a.slotX, ease);
        a.y = lerp(HALL_FEET, IN_FEET, ease);
        if (k >= 1) {
          a.state = "in";
          a.x = a.slotX;
          a.y = IN_FEET;
          a.say = a.kind === "dash" ? "助かった！" : "ありがとう";
          a.sayT = 1.15;
          a.bow = 0.75;
          shibaHappy = 1;
          setMood("happy");
          sparkle(a.slotX, IN_FEET - 78);
          playThanks();
        }
        return;
      }

      if (a.state === "pause") {
        a.pauseLeft -= dt;
        if (a.pauseLeft <= 0) {
          a.state = "leave";
          a.dir *= -1;
        }
        return;
      }

      if (a.state === "wait") {
        a.waitT += dt;
        a.x += (CX - a.x) * Math.min(1, dt * 8);
        if (door > 0.45) a.tried = true;
        if (door > ENTER_DOOR && phase === "play") beginEnter(a);
        return;
      }

      a.x += a.dir * a.speed * dt;

      if (a.state === "leave" || a.kind === "pass") {
        if (a.x < -70 || a.x > LW + 70) a.state = "gone";
        return;
      }

      if (a.kind === "phone") {
        var stopX = a.side < 0 ? CX - 118 : CX + 118;
        if ((a.side < 0 && a.x >= stopX) || (a.side > 0 && a.x <= stopX)) {
          a.x = stopX;
          a.state = "pause";
          a.pauseLeft = a.pauseDur;
        }
        return;
      }

      if (a.kind === "turn") {
        var turnX = a.side < 0 ? CX - 54 : CX + 54;
        if ((a.side < 0 && a.x >= turnX) || (a.side > 0 && a.x <= turnX)) {
          a.x = turnX;
          a.state = "pause";
          a.pauseLeft = a.pauseDur;
        }
        return;
      }

      if (a.real && Math.abs(a.x - CX) <= 22) {
        if (door > ENTER_DOOR && phase === "play") beginEnter(a);
        else a.state = "wait";
      }
    }

        a.state = "walk";
        a.enterT = 0;
        a.waitT = 0;
        a.tried = false;
        a.y = HALL_FEET;
        if (a.side < 0) a.x = Math.min(a.x, CX - 120);
        else a.x = Math.max(a.x, CX + 120);
        a.dir = a.side < 0 ? 1 : -1;

    }

    function rankFor() {
      var pool;
      if (won && misses <= 0) pool = RANKS.perfect;

      return pick(pool);

    function openResult(didWin) {
      won = didWin;

      var reached = didWin ? STOPS : stopIndex;
      if (reached > bestFloor) {

        saveStore();
      }
      refreshBest();
      var rank = rankFor();
      var quote = "「開ボタン係 ランク：" + rank.name + "」";
      resQuote.textContent = quote;
      if (didWin) {
        resScore.textContent = "ミス " + misses + "回 · " + STOPS + "階クリア";
        setMood("yay");
        burstConfetti();
        playWin();
      } else {
        resScore.textContent = "ミス " + misses + "回 · " + (stopIndex + 1) + "階でストップ";
        setMood("gasp");
      }
      resFlavor.textContent = rank.line;

    function madRateNow() {
      if (realOnField()) return 0;
      if (realQueued()) return stopIndex >= 7 ? 0.045 : 0.07;
      return lingerRate();
    }

    function step(dt) {
      clock += dt;
      if (phase === "play" || phase === "depart" || phase === "failpause" || phase === "practicefail") runTime += dt;
      if (immune > 0) immune -= dt;
      if (shibaHappy > 0) {
        shibaHappy -= dt;
        if (shibaHappy <= 0 && phase === "play") setMood(holding ? "hold" : "idle");
      }
      if (shakeT > 0) shakeT -= dt;

      if (phase === "practicefail" || phase === "failpause") {
        pauseT -= dt;
        if (pauseT <= 0) {
          if (phase === "practicefail") recoverPractice(failKind);
          else if (hearts <= 0) openResult(false);
          else beginStop(stopIndex);
        }
        return;
      }

      if (phase === "depart") {
        departT -= dt;
        rideShift = Math.sin(clock * 18) * 3;
        if (departT <= 0) {
          rideShift = 0;
          if (stopIndex >= STOPS - 1) openResult(true);
          else beginStop(stopIndex + 1);
        }
        return;
      }

      if (phase !== "play") return;
      stopTime += dt;

      var i;
      for (i = 0; i < schedule.length; i++) {
        var spec = schedule[i];
        if (!spec.spawned && stopTime >= spec.delay) {
          spec.spawned = true;
          spawnActor(spec);
        }
      }

      if (forceOpen > 0) forceOpen -= dt;
      prevDoor = door;
      var wantOpen = holding || forceOpen > 0;
      var beforeDoor = door;
      if (wantOpen) door = Math.min(1, door + 2.6 * dt);
      else door = Math.max(0, door - closeSpeed() * dt);
      if (beforeDoor < 0.25 && door >= 0.25) playWhoosh();
      if (beforeDoor > 0.92 && door <= 0.92) playWhoosh();
      if (door > 0.9) sawOpen = true;

      for (i = 0; i < actors.length; i++) updateActor(actors[i], dt);

      if (immune <= 0) {
        for (i = 0; i < actors.length; i++) {
          var a = actors[i];
          if (!a.real) continue;
          if ((a.state === "wait" || a.state === "enter") && door > 0.45) a.tried = true;
          var vulnerable = (a.state === "enter" && a.enterT < CRUSH_WINDOW) || a.state === "wait";
          var closing = door < prevDoor - 0.001;
          if (vulnerable && a.tried && closing && door < CRUSH_DOOR) {
            fail("caught");
            return;
          }
          if (a.state === "wait" && !a.tried && door < 0.12 && a.waitT > 0.32) {
            fail("left");
            return;
          }
        }
        if (sawOpen && door <= 0.001 && prevDoor > 0.001) {
          door = 0;
          if (realOnField()) {
            var v = closestReal();
            fail(v && v.tried ? "caught" : "left");
            return;
          }
          if (!realQueued()) {
            succeedStop();
            return;
          }
        }
        if (holding && door > 0.55 && stopTime > 0.35) {
          var rate = madRateNow();
          if (rate > 0) {
            var prevMad = impatience;
            impatience = Math.min(1.05, impatience + rate * dt);
            if (prevMad < 0.72 && impatience >= 0.72) playMadBeep();
            if (impatience >= 1) {
              impatience = 1;
              fail("mad");
              return;
            }
          }
        }
      }

      var si;
      for (si = sparkles.length - 1; si >= 0; si--) {
        var p = sparkles[si];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0) sparkles.splice(si, 1);
      }

      if (holding && shibaHappy <= 0 && mood !== "hold") setMood("hold");
      if (!holding && shibaHappy <= 0 && mood === "hold") setMood("idle");

      if (outstanding()) {
        if (realOnField()) say("乗る人が来てる");
      } else if (holding && door > 0.6 && impatience > 0.08) {
        say("もう閉めていいよ");
      }
      updateHud();
    }

    function roundRect(x, y, w, h, r) {
      var rr = Math.min(r, w * 0.5, h * 0.5);

      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();

      var edgesL = CX - (INNER.w / 2) * door;
      var edgesR = CX + (INNER.w / 2) * door;

      ctx.save();
      ctx.beginPath();
      ctx.rect(edgesL, INNER.y, Math.max(0, edgesR - edgesL), INNER.h);
      ctx.clip();
      ctx.fillStyle = "rgba(255, 214, 140, .35)";
      ctx.fillRect(INNER.x, INNER.y, INNER.w, 18);
      drawRiders();
      var i;
      for (i = 0; i < actors.length; i++) {
        if (actors[i].state === "in") drawActor(actors[i]);
      }
      drawShiba(196, IN_FEET + 8, 1);
      drawPanel();
      ctx.restore();

      ctx.fillStyle = "#d5dde2";
      if (edgesL > INNER.x) ctx.fillRect(INNER.x, INNER.y, edgesL - INNER.x, INNER.h);
      if (edgesR < INNER.x + INNER.w) ctx.fillRect(edgesR, INNER.y, INNER.x + INNER.w - edgesR, INNER.h);
      ctx.fillStyle = "rgba(255,255,255,.45)";
      if (edgesL - INNER.x > 8) ctx.fillRect(edgesL - 7, INNER.y + 8, 3, INNER.h - 16);
      if (INNER.x + INNER.w - edgesR > 8) ctx.fillRect(edgesR + 4, INNER.y + 8, 3, INNER.h - 16);

      ctx.strokeStyle = "#b4233a";
      ctx.lineWidth = 8;
      roundRect(FRAME.x + 4, FRAME.y + 4, FRAME.w - 8, FRAME.h - 8, 14);
      ctx.stroke();

      roundRect(CX - 28, FRAME.y + 8, 56, 32, 8);
      ctx.fillStyle = "#241816";
      ctx.fill();
      ctx.fillStyle = "#ffb703";
      ctx.font = "900 20px " + FONT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      var lamp = (phase === "title") ? 1 : (stopIndex + 1);
      ctx.fillText(String(lamp), CX, FRAME.y + 25);

      ctx.fillStyle = "#e7c39a";
      ctx.fillRect(0, FRAME.y + FRAME.h - 8, LW, LH);
      ctx.fillStyle = "#c4473d";
      ctx.fillRect(CX - 70, FRAME.y + FRAME.h - 4, 140, 18);
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fillRect(CX - 70, FRAME.y + FRAME.h - 4, 140, 3);

      ctx.fillStyle = "#3d9a4a";
      ctx.beginPath();
      ctx.ellipse(36, 430, 16, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#2f6d38";
      ctx.beginPath();
      ctx.arc(30, 418, 10, 0, Math.PI * 2);
      ctx.arc(42, 416, 12, 0, Math.PI * 2);
      ctx.fill();

      for (i = 0; i < actors.length; i++) {
        var st = actors[i].state;
        if (st === "in" || st === "gone") continue;
        drawActor(actors[i]);
      }

      for (i = 0; i < sparkles.length; i++) {
        var s = sparkles[i];
        ctx.globalAlpha = Math.max(0, s.life / s.max);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (i = 0; i < confetti.length; i++) {
        var c = confetti[i];
        ctx.globalAlpha = Math.max(0, c.life / c.max);
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, 5, 8);
      }
      ctx.globalAlpha = 1;
    }

    function updateConfetti(dt) {
      var i;
      for (i = confetti.length - 1; i >= 0; i--) {
        var c = confetti[i];
        c.life -= dt;
        c.y += c.vy * dt;
        c.x += c.vx * dt;
        if (c.life <= 0) confetti.splice(i, 1);
      }
    }

    function ensureSize() {
      var rect = canvas.getBoundingClientRect();
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(2, rect.width);
      var h = Math.max(2, rect.height);
      var pw = Math.round(w * dpr);
      var ph = Math.round(h * dpr);
      if (canvas.width !== pw || canvas.height !== ph) {
        canvas.width = pw;
        canvas.height = ph;
      }
      cssW = w;
      cssH = h;
    }

    function draw() {
      if (cssW < 2 || cssH < 2) return;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#f6e2cf";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      var dpr = canvas.width / cssW;
      var scale = Math.min(cssW / LW, cssH / LH);
      var ox = (cssW - LW * scale) / 2;
      var oy = (cssH - LH * scale) / 2;
      ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
      drawScene();
    }

    function refreshHint() {
      if (!started || phase === "title") {
        hintEl.textContent = "長押しで開　はなすと閉まる　スペースキーも";
        return;
      }
      if (phase === "result") {
        hintEl.textContent = won ? "8階、おつかれさま" : "つぎは、閉じるタイミング";
        return;
      }
      if (impatience > 0.55 && !outstanding()) hintEl.textContent = "待たせすぎ。はなして閉めよう";
      else if (realOnField()) hintEl.textContent = "乗マークの人は、入るまで開";
      else hintEl.textContent = "長押しで開　はなすと閉まる";
    }

    function publish() {
      var c = closestReal();
      canvas.dataset.phase = phase;
      canvas.dataset.stop = String(stopIndex + 1);
      canvas.dataset.hearts = String(hearts);
      canvas.dataset.misses = String(misses);
      canvas.dataset.door = door.toFixed(2);
      canvas.dataset.mad = impatience.toFixed(2);
      canvas.dataset.holding = holding ? "1" : "0";
      canvas.dataset.reals = outstanding() ? "1" : "0";
      canvas.dataset.dist = c ? Math.abs(c.x - CX).toFixed(0) : "";
      canvas.dataset.pstate = c ? c.state : "";
      canvas.dataset.reason = failKind;
      canvas.dataset.runtime = runTime.toFixed(2);
      canvas.dataset.won = won ? "1" : "0";
      holdBtn.classList.toggle("is-down", holding && phase === "play");
      holdBtn.setAttribute("aria-pressed", holding ? "true" : "false");
      holdBtn.disabled = phase === "result" || phase === "title";
    }

    function syncHold() {
      var next = (holdPointer || holdKey) && (phase === "play" || phase === "depart" || phase === "practicefail" || phase === "failpause");
      if (next && !holding && phase === "play") playPress();
      holding = next;
    }

    function frame(ts) {
      var now = ts || performance.now();
      var raw = last ? (now - last) / 1000 : 0.016;
      last = now;
      ensureSize();
      if (warnUntil && now > warnUntil) warnEl.hidden = true;
      if (bannerUntil && now > bannerUntil && phase === "play") hideBanner();
      if (!(raw > 0.45)) {
        var dt = Math.min(0.034, raw);
        syncHold();
        if (phase === "title") {
          door = 1;
          clock += dt;
        } else {
          step(dt);
          if (phase === "result") updateConfetti(dt);
        }
      }
      refreshHint();
      draw();
      publish();
      requestAnimationFrame(frame);
    }

    function pointerDown(e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (phase === "title" || phase === "result") return;
      e.preventDefault();
      holdPointer = true;
      if (e.currentTarget.setPointerCapture) {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }
      audioGesture();
    }
    function pointerUp() { holdPointer = false; }

    holdBtn.addEventListener("pointerdown", pointerDown);
    stageEl.addEventListener("pointerdown", pointerDown);
    window.addEventListener("pointerup", pointerUp);
    window.addEventListener("pointercancel", pointerUp);
    holdBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    stageEl.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });

    document.addEventListener("keydown", function (e) {
      if (e.code !== "Space" && e.code !== "Enter") return;
      if (e.code === "Space") e.preventDefault();
      if (e.repeat) return;
      audioGesture();
      if (phase === "title" && (e.code === "Space" || e.code === "Enter")) {
        startGame(e.code === "Space");
        return;
      }
      if (phase === "result" && !btnRetry.disabled && (e.code === "Enter")) {
        retryGame();
        return;
      }
      if (e.code === "Space") holdKey = true;
    });
    document.addEventListener("keyup", function (e) {
      if (e.code === "Space") holdKey = false;
    });
    window.addEventListener("blur", function () { holdKey = false; holdPointer = false; });

    function startGame(fromSpace) {
      audioGesture();
      titleEl.hidden = true;
      hudMascot.appendChild(mascot);
      beginRun();
      if (fromSpace) holdKey = true;
    }
    function retryGame() {
      if (btnRetry.disabled || performance.now() < lockUntil) return;
      audioGesture();
      resultEl.hidden = false;
      resultEl.hidden = true;
      document.body.classList.remove("is-locked");
      hudMascot.appendChild(mascot);
      beginRun();
    }

    btnStart.addEventListener("click", function () { startGame(false); });
    btnRetry.addEventListener("click", retryGame);
    muteBtn.addEventListener("click", function () {
      muted = !muted;
      applyMute();
      saveStore();
      if (!muted) audioGesture();
    });

    loadStore();
    applyMute();
    refreshBest();
    updateHud();
    ensureSize();
    publish();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
